PLG_SYSTEM_SOCIALLOGIN="Σύστημα - Akeeba Social Login"
PLG_SYSTEM_SOCIALLOGIN_DESCRIPTION="Σύνδεση ή δημιουργία χρηστών χρησιμοποιώντας συνδέσεις κοινωνικών δικτύων. Αυτό το πρόσθετο ενημερώνει το Joomla ποια κουμπιά πρέπει να εμφανίσει."

PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI="Callback URI"
PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI_DESC="Αυτό είναι το Callback URI το οποίο πρέπει να επικολληθεί στο αντίστοιχο πεδίο διαμόρφωσης της υπηρεσίας σύμφωνα με τις οδηγίες της τεκμηρίωσης."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_SUCCESS="Το Callback URI αντιγράφηκε στο πρόχειρο."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_FAIL="Δεν ήταν δυνατή η αντιγραφή του Callback URI στο πρόχειρο. Κάντε τριπλό κλικ στο Callback URI, στη συνέχεια κάντε δεξί κλικ (ή παρατεταμένο πάτημα, σε συσκευές αφής) και επιλέξτε Αντιγραφή."
PLG_SYSTEM_SOCIALLOGIN_COPY_DESC="Αντιγράφει το Callback URI στο πρόχειρο, επιτρέποντάς σας να το επικολλήσετε στο αντίστοιχο πεδίο διαμόρφωσης της υπηρεσίας σύμφωνα με τις οδηγίες της τεκμηρίωσης."
PLG_SYSTEM_SOCIALLOGIN_COPY="Αντιγραφή στο Πρόχειρο"

PLG_SYSTEM_SOCIALLOGIN_FIELD_DOCUMENTATION="Τεκμηρίωση"

PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_LABEL="Προσθήκη κουμπιών στη σελίδα λογαριασμού χρήστη"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_DESC="Όταν είναι ενεργοποιημένο, το πρόσθετο θα προσθέτει αυτόματα ένα τμήμα κοινωνικών μέσων στη σελίδα Επεξεργασία Λογαριασμού Χρήστη του com_users του Joomla. Αυτό επιτρέπει στους χρήστες να συνδέσουν ή να αποσυνδέσουν τον λογαριασμό τους από την παρουσία τους στα κοινωνικά μέσα."

PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_LABEL="Εμφάνιση του πεδίου «Να μην υπενθυμίζεται» στη σελίδα λογαριασμού χρήστη"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_DESC="Όταν τόσο αυτή όσο και η προηγούμενη επιλογή είναι ενεργοποιημένες, το πρόσθετο θα προσθέτει ένα πεδίο «Να μην μου υπενθυμίζεται η σύνδεση των προφίλ μου στα κοινωνικά μέσα» στο προφίλ χρήστη. Εάν ο χρήστης το ορίσει σε Ναι, το πρόσθετο ΔΕΝ θα εκχωρεί τον χρήστη σε καμία ομάδα χρηστών, ανεξάρτητα από τις ρυθμίσεις σας παρακάτω."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_TITLE="Ομάδα χρηστών όταν ο λογαριασμός κοινωνικού δικτύου είναι συνδεδεμένος"
PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_DESC="Προσθέτει τον χρήστη σε αυτή την Ομάδα Χρηστών του Joomla <em>δυναμικά</em> όταν έχει συνδέσει το προφίλ χρήστη του Joomla με έναν λογαριασμό κοινωνικού δικτύου. Η εκχώρηση ομάδας χρηστών ισχύει μόνο κατά τη διάρκεια της συνεδρίας σύνδεσης και ΔΕΝ αποθηκεύεται στη βάση δεδομένων."

PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_TITLE="Ομάδα χρηστών όταν ο λογαριασμός κοινωνικού δικτύου ΔΕΝ είναι συνδεδεμένος"
PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_DESC="Προσθέτει τον χρήστη σε αυτή την Ομάδα Χρηστών του Joomla <em>δυναμικά</em> όταν ΔΕΝ έχει συνδέσει το προφίλ χρήστη του Joomla με έναν λογαριασμό κοινωνικού δικτύου. Η εκχώρηση ομάδας χρηστών ισχύει μόνο κατά τη διάρκεια της συνεδρίας σύνδεσης και ΔΕΝ αποθηκεύεται στη βάση δεδομένων."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_NOGROUP="-- Να μην εκχωρηθεί Ομάδα Χρηστών --"

PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDACTION="Μη έγκυρη ενέργεια Social Login"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDSLUG="Μη έγκυρο slug Social Login"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDUSER="Μη έγκυρο αναγνωριστικό χρήστη"

PLG_SYSTEM_SOCIALLOGIN_ERR_NOUSER="Δεν είναι δυνατή η διαμόρφωση κοινωνικής σύνδεσης για μη υπαρκτό χρήστη."

PLG_SYSTEM_SOCIALLOGIN_HEADER="Κοινωνική Σύνδεση"
PLG_SYSTEM_SOCIALLOGIN_FIELD_LABEL="Ρύθμιση κοινωνικής σύνδεσης"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DESC="Ρυθμίστε την κοινωνική σύνδεση για να συνδέεστε στον ιστότοπό μας πιο εύκολα. ΠΡΟΣΟΧΗ! Η τροποποίηση των ρυθμίσεων κοινωνικής σύνδεσης θα χάσει τυχόν άλλες αλλαγές που έχετε κάνει στις ρυθμίσεις του λογαριασμού χρήστη σας."

PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_LABEL="Να μην μου υπενθυμίζεται η σύνδεση των προφίλ μου στα κοινωνικά μέσα"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_DESC="Ορίστε αυτό σε Ναι για να αποφύγετε την παραλαβή ειδοποιήσεων σχετικά με τη σύνδεση των προφίλ σας στα κοινωνικά μέσα με τον λογαριασμό σας σε αυτόν τον ιστότοπο."
