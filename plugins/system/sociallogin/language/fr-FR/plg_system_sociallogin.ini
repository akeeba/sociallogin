PLG_SYSTEM_SOCIALLOGIN="Système - Akeeba Social Login"
PLG_SYSTEM_SOCIALLOGIN_DESCRIPTION="Connexion ou création de comptes utilisateurs via les réseaux sociaux. Cette extension indique à Joomla! quels boutons afficher."

PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI="URI de rappel"
PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI_DESC="Voici l'URI de rappel qui doit être collée dans le champ de configuration du service correspondant, conformément aux instructions de la documentation."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_SUCCESS="L'URI de rappel a été copiée dans le presse-papier."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_FAIL="Impossible de copier l'URI de rappel dans le presse-papier. Triple-cliquez sur l'URI de rappel, puis faites un clic droit (ou un appui long sur les appareils tactiles) et sélectionnez Copier."
PLG_SYSTEM_SOCIALLOGIN_COPY_DESC="Copie l'URI de rappel dans le presse-papier, vous permettant de la coller dans le champ de configuration du service correspondant conformément aux instructions de la documentation."
PLG_SYSTEM_SOCIALLOGIN_COPY="Copier dans le presse-papier"

PLG_SYSTEM_SOCIALLOGIN_FIELD_DOCUMENTATION="Documentation"

PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_LABEL="Ajouter des boutons à la page du compte utilisateur"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_DESC="Lorsque cette option est activée, l'extension ajoute automatiquement une section réseaux sociaux dans la page Modifier le compte utilisateur du composant com_users de Joomla!. Cela permet aux utilisateurs d'associer ou de dissocier leur compte de leurs profils sur les réseaux sociaux."

PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_LABEL="Afficher le champ «&nbsp;Ne plus me rappeler&nbsp;» sur la page du compte utilisateur"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_DESC="Lorsque cette option et la précédente sont toutes deux activées, l'extension ajoute un champ «&nbsp;Ne plus me rappeler d'associer mes profils de réseaux sociaux&nbsp;» dans le profil utilisateur. Si l'utilisateur définit ce champ sur Oui, l'extension n'affectera PAS cet utilisateur à des groupes d'utilisateurs, quels que soient vos paramètres ci-dessous."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_TITLE="Groupe d'utilisateurs lorsqu'un compte de réseau social est associé"
PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_DESC="Ajoute l'utilisateur à ce groupe d'utilisateurs Joomla! de manière <em>dynamique</em> lorsqu'il a associé son profil utilisateur Joomla! à un compte de réseau social. L'affectation au groupe d'utilisateurs n'est valable que pendant la session de connexion et n'est PAS enregistrée dans la base de données."

PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_TITLE="Groupe d'utilisateurs lorsqu'aucun compte de réseau social n'est associé"
PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_DESC="Ajoute l'utilisateur à ce groupe d'utilisateurs Joomla! de manière <em>dynamique</em> lorsqu'il n'a PAS associé son profil utilisateur Joomla! à un compte de réseau social. L'affectation au groupe d'utilisateurs n'est valable que pendant la session de connexion et n'est PAS enregistrée dans la base de données."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_NOGROUP="-- Ne pas affecter de groupe d'utilisateurs --"

PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDACTION="Action de connexion sociale invalide"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDSLUG="Identifiant de connexion sociale invalide"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDUSER="Identifiant utilisateur invalide"

PLG_SYSTEM_SOCIALLOGIN_ERR_NOUSER="Impossible de configurer la connexion sociale pour un utilisateur inexistant."

PLG_SYSTEM_SOCIALLOGIN_HEADER="Connexion sociale"
PLG_SYSTEM_SOCIALLOGIN_FIELD_LABEL="Configuration de la connexion sociale"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DESC="Configurez la connexion sociale pour vous connecter plus facilement à notre site. ATTENTION ! La modification de vos paramètres de connexion sociale entraînera la perte de toutes les autres modifications apportées aux paramètres de votre compte utilisateur."

PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_LABEL="Ne plus me rappeler d'associer mes profils de réseaux sociaux"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_DESC="Définissez ce champ sur Oui pour ne plus recevoir de notifications concernant l'association de vos profils de réseaux sociaux à votre compte sur ce site."
