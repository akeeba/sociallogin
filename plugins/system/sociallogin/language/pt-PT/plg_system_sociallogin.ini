PLG_SYSTEM_SOCIALLOGIN="Sistema - Akeeba Social Login"
PLG_SYSTEM_SOCIALLOGIN_DESCRIPTION="Iniciar sessão ou criar utilizadores utilizando inícios de sessão em redes sociais. Este plugin indica ao Joomla! quais os botões a apresentar."

PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI="URI de Retorno"
PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI_DESC="Este é o URI de Retorno que precisa de ser colado no campo de configuração do serviço correspondente, de acordo com as instruções da documentação."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_SUCCESS="O URI de Retorno foi copiado para a área de transferência."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_FAIL="Não foi possível copiar o URI de Retorno para a área de transferência. Clique três vezes no URI de Retorno, depois clique com o botão direito (ou pressione por alguns segundos, em dispositivos tácteis) e selecione Copiar."
PLG_SYSTEM_SOCIALLOGIN_COPY_DESC="Copia o URI de Retorno para a área de transferência, permitindo colá-lo no campo de configuração do serviço correspondente, de acordo com as instruções da documentação."
PLG_SYSTEM_SOCIALLOGIN_COPY="Copiar para a Área de Transferência"

PLG_SYSTEM_SOCIALLOGIN_FIELD_DOCUMENTATION="Documentação"

PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_LABEL="Adicionar botões à página da conta de utilizador"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_DESC="Quando ativado, o plugin adicionará automaticamente uma secção de redes sociais na página Editar Conta de Utilizador do com_users do Joomla!. Isto permite aos utilizadores vincular ou desvincular a sua conta da sua presença nas redes sociais."

PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_LABEL="Mostrar o campo 'não recordar' na página da conta de utilizador"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_DESC="Quando esta e a opção anterior estiverem ativadas, o plugin adicionará um campo \"Não me recordar de vincular os meus perfis de redes sociais\" no perfil do utilizador. Se o utilizador definir isto como Sim, o plugin NÃO atribuirá este utilizador a nenhum grupo de utilizadores, independentemente das suas definições abaixo."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_TITLE="Grupo de Utilizadores quando a conta de rede social está vinculada"
PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_DESC="Adicionar o utilizador a este Grupo de Utilizadores do Joomla! <em>dinamicamente</em> quando tiver vinculado o seu perfil de utilizador do Joomla! com uma conta de rede social. A atribuição do grupo de utilizadores só é válida durante a sessão de início de sessão e NÃO é armazenada na base de dados."

PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_TITLE="Grupo de Utilizadores quando a conta de rede social NÃO está vinculada"
PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_DESC="Adicionar o utilizador a este Grupo de Utilizadores do Joomla! <em>dinamicamente</em> quando NÃO tiver vinculado o seu perfil de utilizador do Joomla! com uma conta de rede social. A atribuição do grupo de utilizadores só é válida durante a sessão de início de sessão e NÃO é armazenada na base de dados."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_NOGROUP="-- Não atribuir um Grupo de Utilizadores --"

PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDACTION="Ação de início de sessão social inválida"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDSLUG="Slug de início de sessão social inválido"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDUSER="ID de utilizador inválido"

PLG_SYSTEM_SOCIALLOGIN_ERR_NOUSER="Não é possível configurar o início de sessão social para um utilizador inexistente."

PLG_SYSTEM_SOCIALLOGIN_HEADER="Início de Sessão Social"
PLG_SYSTEM_SOCIALLOGIN_FIELD_LABEL="Configuração do início de sessão social"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DESC="Configure o início de sessão social para iniciar sessão no nosso site mais facilmente. AVISO! Modificar as suas definições de início de sessão social fará perder quaisquer outras alterações efetuadas nas definições da sua conta de utilizador."

PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_LABEL="Não me recordar de vincular os meus perfis de redes sociais"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_DESC="Defina isto como Sim para evitar receber notificações sobre a vinculação dos seus perfis de redes sociais à sua conta neste site."
