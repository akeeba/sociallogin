PLG_SYSTEM_SOCIALLOGIN="System - Akeeba Social Login"
PLG_SYSTEM_SOCIALLOGIN_DESCRIPTION="Anmeldung oder Erstellung von Benutzern über Anmeldedaten sozialer Netzwerke. Dieses Plugin teilt Joomla mit, welche Schaltflächen angezeigt werden sollen."

PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI="Callback-URI"
PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI_DESC="Dies ist die Callback-URI, die gemäß den Dokumentationsanweisungen in das entsprechende Konfigurationsfeld des jeweiligen Dienstes eingefügt werden muss."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_SUCCESS="Die Callback-URI wurde in die Zwischenablage kopiert."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_FAIL="Die Callback-URI konnte nicht in die Zwischenablage kopiert werden. Klicken Sie dreimal auf die Callback-URI, dann klicken Sie mit der rechten Maustaste (oder halten Sie auf Touch-Geräten gedrückt) und wählen Sie Kopieren."
PLG_SYSTEM_SOCIALLOGIN_COPY_DESC="Kopiert die Callback-URI in die Zwischenablage, sodass Sie diese gemäß den Dokumentationsanweisungen in das entsprechende Konfigurationsfeld des jeweiligen Dienstes einfügen können."
PLG_SYSTEM_SOCIALLOGIN_COPY="In Zwischenablage kopieren"

PLG_SYSTEM_SOCIALLOGIN_FIELD_DOCUMENTATION="Dokumentation"

PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_LABEL="Schaltflächen zur Benutzerkontogeseite hinzufügen"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_DESC="Wenn aktiviert, fügt das Plugin automatisch einen Bereich für soziale Medien in der Seite „Benutzerkonto bearbeiten" von Joomlas com_users ein. Dadurch können Benutzer ihr Konto mit ihren Profilen in sozialen Netzwerken verknüpfen oder die Verknüpfung aufheben."

PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_LABEL="Das Feld „Nicht erinnern" auf der Benutzerkontogeseite anzeigen"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_DESC="Wenn sowohl diese als auch die vorherige Option aktiviert sind, fügt das Plugin das Feld „Nicht mehr daran erinnern, meine Social-Media-Profile zu verknüpfen" in das Benutzerprofil ein. Wenn der Benutzer dies auf Ja setzt, weist das Plugin diesen Benutzer trotz Ihrer nachfolgenden Einstellungen keiner Benutzergruppe zu."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_TITLE="Benutzergruppe bei verknüpftem Social-Media-Konto"
PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_DESC="Fügt den Benutzer dieser Joomla-Benutzergruppe <em>dynamisch</em> hinzu, wenn er sein Joomla-Benutzerprofil mit einem Konto in einem sozialen Netzwerk verknüpft hat. Die Benutzergruppenzuweisung gilt nur für die aktuelle Anmeldesitzung und wird NICHT in der Datenbank gespeichert."

PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_TITLE="Benutzergruppe bei NICHT verknüpftem Social-Media-Konto"
PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_DESC="Fügt den Benutzer dieser Joomla-Benutzergruppe <em>dynamisch</em> hinzu, wenn er sein Joomla-Benutzerprofil NICHT mit einem Konto in einem sozialen Netzwerk verknüpft hat. Die Benutzergruppenzuweisung gilt nur für die aktuelle Anmeldesitzung und wird NICHT in der Datenbank gespeichert."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_NOGROUP="-- Keine Benutzergruppe zuweisen --"

PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDACTION="Ungültige Social-Login-Aktion"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDSLUG="Ungültiger Social-Login-Slug"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDUSER="Ungültige Benutzer-ID"

PLG_SYSTEM_SOCIALLOGIN_ERR_NOUSER="Social-Login kann nicht für einen nicht vorhandenen Benutzer konfiguriert werden."

PLG_SYSTEM_SOCIALLOGIN_HEADER="Social Login"
PLG_SYSTEM_SOCIALLOGIN_FIELD_LABEL="Social-Login-Einrichtung"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DESC="Richten Sie Social Login ein, um sich einfacher auf unserer Website anzumelden. ACHTUNG! Wenn Sie Ihre Social-Login-Einstellungen ändern, gehen alle anderen Änderungen an Ihren Benutzerkontoeinstellungen verloren."

PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_LABEL="Nicht mehr daran erinnern, meine Social-Media-Profile zu verknüpfen"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_DESC="Setzen Sie dies auf Ja, um keine Benachrichtigungen mehr über die Verknüpfung Ihrer Social-Media-Profile mit Ihrem Konto auf dieser Website zu erhalten."
