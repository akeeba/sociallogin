PLG_SYSTEM_SOCIALLOGIN="Sistema - Akeeba Social Login"
PLG_SYSTEM_SOCIALLOGIN_DESCRIPTION="Accedi o crea utenti tramite i social network. Questo plugin indica a Joomla! quali pulsanti visualizzare."

PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI="URI di callback"
PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI_DESC="Questo è l'URI di callback che deve essere incollato nel campo di configurazione del servizio corrispondente, come indicato nelle istruzioni della documentazione."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_SUCCESS="L'URI di callback è stato copiato negli appunti."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_FAIL="Impossibile copiare l'URI di callback negli appunti. Fai triplo clic sull'URI di callback, quindi fai clic con il tasto destro (o tieni premuto, sui dispositivi touch) e seleziona Copia."
PLG_SYSTEM_SOCIALLOGIN_COPY_DESC="Copia l'URI di callback negli appunti, consentendoti di incollarlo nel campo di configurazione del servizio corrispondente, come indicato nelle istruzioni della documentazione."
PLG_SYSTEM_SOCIALLOGIN_COPY="Copia negli Appunti"

PLG_SYSTEM_SOCIALLOGIN_FIELD_DOCUMENTATION="Documentazione"

PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_LABEL="Aggiungi pulsanti alla pagina account utente"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_DESC="Se abilitato, il plugin aggiunge automaticamente una sezione social media nella pagina Modifica account utente di com_users di Joomla!. Questo consente agli utenti di collegare o scollegare il proprio account al loro profilo sui social media."

PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_LABEL="Mostra il campo 'non ricordarmelo' nella pagina account utente"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_DESC="Quando sia questa opzione che la precedente sono abilitate, il plugin aggiunge un campo "Non ricordarmi di collegare i miei profili social" nel profilo utente. Se l'utente lo imposta su Sì, il plugin NON assegnerà questo utente a nessun gruppo utenti, indipendentemente dalle impostazioni sottostanti."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_TITLE="Gruppo utenti quando l'account social è collegato"
PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_DESC="Aggiunge l'utente a questo gruppo utenti Joomla! <em>dinamicamente</em> quando ha collegato il proprio profilo utente Joomla! a un account social. L'assegnazione al gruppo utenti è valida solo per la sessione di accesso e NON viene salvata nel database."

PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_TITLE="Gruppo utenti quando l'account social NON è collegato"
PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_DESC="Aggiunge l'utente a questo gruppo utenti Joomla! <em>dinamicamente</em> quando NON ha collegato il proprio profilo utente Joomla! a un account social. L'assegnazione al gruppo utenti è valida solo per la sessione di accesso e NON viene salvata nel database."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_NOGROUP="-- Non assegnare un gruppo utenti --"

PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDACTION="Azione di Social Login non valida"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDSLUG="Slug di Social Login non valido"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDUSER="ID utente non valido"

PLG_SYSTEM_SOCIALLOGIN_ERR_NOUSER="Impossibile configurare l'accesso social per un utente inesistente."

PLG_SYSTEM_SOCIALLOGIN_HEADER="Social Login"
PLG_SYSTEM_SOCIALLOGIN_FIELD_LABEL="Configurazione Social Login"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DESC="Configura l'accesso social per accedere al sito più facilmente. ATTENZIONE! La modifica delle impostazioni dell'accesso social comporterà la perdita di eventuali altre modifiche apportate nelle impostazioni dell'account utente."

PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_LABEL="Non ricordarmi di collegare i miei profili social"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_DESC="Imposta su Sì per evitare di ricevere notifiche sul collegamento dei tuoi profili social al tuo account su questo sito."
