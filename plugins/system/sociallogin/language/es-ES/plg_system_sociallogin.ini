PLG_SYSTEM_SOCIALLOGIN="Sistema - Akeeba Social Login"
PLG_SYSTEM_SOCIALLOGIN_DESCRIPTION="Inicia sesión o crea usuarios utilizando inicios de sesión de redes sociales. Este plugin indica a Joomla qué botones mostrar."

PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI="URI de devolución de llamada"
PLG_SYSTEM_SOCIALLOGIN_FIELD_CALLBACKURI_DESC="Esta es la URI de devolución de llamada que debe pegarse en el campo de configuración del servicio correspondiente, según las instrucciones de la documentación."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_SUCCESS="La URI de devolución de llamada se ha copiado al portapapeles."
PLG_SYSTEM_SOCIALLOGIN_TOKEN_COPY_FAIL="No se pudo copiar la URI de devolución de llamada al portapapeles. Haga triple clic en la URI de devolución de llamada, luego haga clic derecho (o mantenga pulsado, en dispositivos táctiles) y seleccione Copiar."
PLG_SYSTEM_SOCIALLOGIN_COPY_DESC="Copia la URI de devolución de llamada al portapapeles, lo que le permite pegarla en el campo de configuración del servicio correspondiente, según las instrucciones de la documentación."
PLG_SYSTEM_SOCIALLOGIN_COPY="Copiar al portapapeles"

PLG_SYSTEM_SOCIALLOGIN_FIELD_DOCUMENTATION="Documentación"

PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_LABEL="Añadir botones a la página de cuenta de usuario"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_LINKUNLINKBUTTONS_DESC="Cuando está habilitado, el plugin añadirá automáticamente una sección de redes sociales en la página Editar cuenta de usuario de com_users de Joomla. Esto permite a los usuarios vincular o desvincular su cuenta de sus perfiles en redes sociales."

PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_LABEL="Mostrar el campo «no recordar» en la página de cuenta de usuario"
PLG_SYSTEM_SOCIALLOGIN_CONFIG_SHOW_DONTREMIND_DESC="Cuando tanto esta opción como la anterior están habilitadas, el plugin añadirá un campo «No recordarme vincular mis perfiles de redes sociales» en el perfil de usuario. Si el usuario lo establece en Sí, el plugin NO asignará a este usuario a ningún grupo de usuarios, independientemente de su configuración."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_TITLE="Grupo de usuarios cuando la cuenta de red social está vinculada"
PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_DESC="Añade al usuario a este grupo de usuarios de Joomla <em>dinámicamente</em> cuando haya vinculado su perfil de usuario de Joomla con una cuenta de red social. La asignación de grupo de usuarios solo es válida durante la sesión de inicio de sesión y NO se almacena en la base de datos."

PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_TITLE="Grupo de usuarios cuando la cuenta de red social NO está vinculada"
PLG_SYSTEM_SOCIALLOGIN_NOLINKEDACCOUNTUSERGROUP_DESC="Añade al usuario a este grupo de usuarios de Joomla <em>dinámicamente</em> cuando NO haya vinculado su perfil de usuario de Joomla con una cuenta de red social. La asignación de grupo de usuarios solo es válida durante la sesión de inicio de sesión y NO se almacena en la base de datos."

PLG_SYSTEM_SOCIALLOGIN_LINKEDACCOUNTUSERGROUP_NOGROUP="-- No asignar un grupo de usuarios --"

PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDACTION="Acción de Social Login no válida"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDSLUG="Slug de Social Login no válido"
PLG_SYSTEM_SOCIALLOGIN_ERR_AJAX_INVALIDUSER="ID de usuario no válido"

PLG_SYSTEM_SOCIALLOGIN_ERR_NOUSER="No se puede configurar el inicio de sesión social para un usuario inexistente."

PLG_SYSTEM_SOCIALLOGIN_HEADER="Inicio de sesión social"
PLG_SYSTEM_SOCIALLOGIN_FIELD_LABEL="Configuración del inicio de sesión social"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DESC="Configure el inicio de sesión social para acceder a nuestro sitio más fácilmente. ¡ATENCIÓN! Modificar la configuración de inicio de sesión social descartará cualquier otro cambio que haya realizado en la configuración de su cuenta de usuario."

PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_LABEL="No recordarme vincular mis perfiles de redes sociales"
PLG_SYSTEM_SOCIALLOGIN_FIELD_DONTREMIND_DESC="Establezca esto en Sí para evitar recibir notificaciones sobre la vinculación de sus perfiles de redes sociales a su cuenta en este sitio."
