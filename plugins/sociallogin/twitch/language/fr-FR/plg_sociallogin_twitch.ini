PLG_SOCIALLOGIN_TWITCH = "Akeeba Social Login - Intégration Twitch"
PLG_SOCIALLOGIN_TWITCH_DESCRIPTION = "Permet la connexion sociale avec des comptes Twitch."
PLG_SOCIALLOGIN_TWITCH_LOGIN_LABEL = "Se connecter avec Twitch"
PLG_SOCIALLOGIN_TWITCH_LOGIN_DESC = "Connectez-vous avec votre compte Twitch. Un nouveau compte sera créé si aucun compte correspondant n'existe sur notre site."
PLG_SOCIALLOGIN_TWITCH_LINK_LABEL = "Associer Twitch"
PLG_SOCIALLOGIN_TWITCH_LINK_DESC = "Associe votre utilisateur sur ce site à votre compte Twitch. Vous pourrez ensuite utiliser votre compte Twitch pour vous connecter à ce site."
PLG_SOCIALLOGIN_TWITCH_UNLINK_LABEL = "Dissocier Twitch"
PLG_SOCIALLOGIN_TWITCH_UNLINK_DESC = "Dissocie votre utilisateur sur ce site de votre compte Twitch."
PLG_SOCIALLOGIN_TWITCH_FIELD_APPID_LABEL = "Twitch Client ID"
PLG_SOCIALLOGIN_TWITCH_FIELD_APPID_DESC = "Saisissez ici le Client ID de votre application Twitch OAuth2. Cette information est requise pour activer la connexion sociale avec Twitch. Vous pouvez créer une application Twitch OAuth2 gratuitement sur <a href='https://dev.twitch.tv'>le portail des développeurs Twitch</a>."
PLG_SOCIALLOGIN_TWITCH_FIELD_APPSECRET_LABEL = "Twitch Client Secret"
PLG_SOCIALLOGIN_TWITCH_FIELD_APPSECRET_DESC = "Saisissez ici le Client Secret de votre application Twitch OAuth2. Cette information est requise pour activer la connexion sociale avec Twitch. Vous pouvez créer une application Twitch OAuth2 gratuitement sur <a href='https://dev.twitch.tv'>le portail des développeurs Twitch</a>."
PLG_SOCIALLOGIN_TWITCH_FIELD_LOGINUNLINKED_LABEL = "Autoriser la connexion sociale aux comptes non associés"
PLG_SOCIALLOGIN_TWITCH_FIELD_LOGINUNLINKED_DESC = "Lorsque cette option est activée, elle permet aux utilisateurs de se connecter même s'ils n'ont pas associé leur compte Twitch à leur compte utilisateur sur le site. L'adresse e-mail de leur compte Twitch doit être identique à l'adresse e-mail utilisée sur votre site et doit être visible publiquement."
PLG_SOCIALLOGIN_TWITCH_FIELD_CREATENEW_LABEL = "Créer de nouveaux comptes utilisateurs"
PLG_SOCIALLOGIN_TWITCH_FIELD_CREATENEW_DESC = "Crée un nouvel utilisateur Joomla! lorsqu'un utilisateur tente de se connecter via Twitch mais qu'il n'existe aucun compte utilisateur Joomla! associé à cet e-mail ou à cet identifiant utilisateur Twitch. Si l'inscription des utilisateurs est désactivée, aucun compte ne sera créé et une erreur sera générée. Le compte Twitch de l'utilisateur doit avoir une adresse e-mail visible publiquement. Le nouvel utilisateur Joomla! aura un nom d'utilisateur dérivé de son identifiant Twitch, la même adresse e-mail que le compte Twitch et un mot de passe long et aléatoire (que l'utilisateur peut modifier une fois connecté). Définissez cette option sur Non pour empêcher la création de comptes utilisateurs via la connexion Twitch."
PLG_SOCIALLOGIN_TWITCH_FIELD_FORCENEW_LABEL = "Ignorer le paramètre Joomla! pour la création de comptes utilisateurs"
PLG_SOCIALLOGIN_TWITCH_FIELD_FORCENEW_DESC = "Lorsque cette option et l'option «&nbsp;Créer de nouveaux comptes utilisateurs&nbsp;» ci-dessus sont toutes deux activées, un nouvel utilisateur sera toujours créé, même si vous avez désactivé l'inscription des utilisateurs dans les options de la page Utilisateurs de Joomla!. Ceci est utile pour empêcher quiconque de s'inscrire sur votre site <em>à moins</em> de disposer d'un compte Twitch."
PLG_SOCIALLOGIN_TWITCH_FIELD_BYPASSVALIDATION_LABEL = "Contourner la validation utilisateur pour les utilisateurs Twitch"
PLG_SOCIALLOGIN_TWITCH_FIELD_BYPASSVALIDATION_DESC = "S'applique uniquement lors de la création de nouveaux comptes utilisateurs. Lorsque cette option est activée, le nouvel utilisateur Joomla! sera créé actif, sans passer par la validation du compte utilisateur Joomla!. Cela signifie qu'aucun e-mail d'activation de compte ne sera envoyé à l'utilisateur ni aux administrateurs du site Joomla!. Ceci est sans danger car Twitch n'autorise que les utilisateurs disposant d'une adresse e-mail vérifiée à utiliser leur compte Twitch pour se connecter à des sites externes."
PLG_SOCIALLOGIN_TWITCH_FIELD_CUSTOMCSS_LABEL = "Style des boutons"
PLG_SOCIALLOGIN_TWITCH_FIELD_CUSTOMCSS_DESC = "Lorsque cette option est activée, un CSS personnalisé pour le style des boutons de connexion, d'association et de dissociation sera ajouté dans l'en-tête de la page. Désactivez cette option si vous souhaitez utiliser votre propre CSS pour styliser les boutons."
PLG_SOCIALLOGIN_TWITCH_FIELD_FGCOLOR_LABEL = "Couleur de premier plan du bouton"
PLG_SOCIALLOGIN_TWITCH_FIELD_FGCOLOR_DESC = "La couleur de premier plan (texte) pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#FFFFFF</code>"
PLG_SOCIALLOGIN_TWITCH_FIELD_BGCOLOR_LABEL = "Couleur d'arrière-plan du bouton"
PLG_SOCIALLOGIN_TWITCH_FIELD_BGCOLOR_DESC = "La couleur d'arrière-plan pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#000000</code>"
PLG_SOCIALLOGIN_TWITCH_ERROR_NOT_LOGGED_IN_FB = "Vous n'êtes pas connecté à Twitch ou vous n'avez pas accordé les autorisations permettant à ce site de vous connecter via Twitch."
PLG_SOCIALLOGIN_TWITCH_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED = "Votre compte sur ce site est désactivé ou non activé."
PLG_SOCIALLOGIN_TWITCH_ERROR_LOCAL_NOT_FOUND = "Vous n'avez pas de compte sur ce site correspondant à ce compte Twitch ; ou vous avez choisi de ne pas partager votre adresse e-mail dans votre profil Twitch public (ce qui nous empêche de vous identifier)."
PLG_SOCIALLOGIN_TWITCH_ERROR_LOCAL_USERNAME_CONFLICT = "Un compte avec le même nom d'utilisateur ou la même adresse e-mail que votre compte Twitch existe déjà sur ce site ; ou vous avez choisi de ne pas partager votre adresse e-mail dans votre profil Twitch public (ce qui nous empêche de vous identifier). Veuillez vous connecter à votre compte sur ce site, puis associer votre compte Twitch à celui-ci. Si vous ne vous souvenez pas avoir un compte utilisateur, veuillez d'abord en créer un nouveau."
PLG_SOCIALLOGIN_TWITCH_ERROR_CANNOT_CREATE = "Impossible de créer un nouvel utilisateur sur notre site : %s"
PLG_SOCIALLOGIN_TWITCH_NOTICE_USERACTIVATE = "Votre adresse e-mail doit être vérifiée avant de vous connecter à ce site. Un e-mail vous a été envoyé avec des instructions. Après avoir suivi ces instructions, revenez ici et réessayez de vous connecter à ce site en utilisant Twitch."
PLG_SOCIALLOGIN_TWITCH_NOTICE_ADMINACTIVATE = "Votre compte doit être examiné par un administrateur. Lorsque le processus d'examen sera terminé, vous recevrez un e-mail de confirmation. Après réception de cet e-mail, revenez ici et réessayez de vous connecter à ce site en utilisant Twitch."

PLG_SOCIALLOGIN_TWITCH_FIELD_ENABLEDAPPLICATIONS_LABEL="Les boutons de connexion peuvent être affichés dans"
PLG_SOCIALLOGIN_TWITCH_FIELD_ENABLEDAPPLICATIONS_DESC="Dans quelle(s) partie(s) de votre site souhaitez-vous autoriser l'affichage des boutons de connexion sociale ? <br/> <strong>DANGER !</strong> Si la connexion sociale est la seule méthode de connexion d'un utilisateur, choisir une option autre que Les deux l'empêchera effectivement d'accéder à l'autre partie de votre site."
