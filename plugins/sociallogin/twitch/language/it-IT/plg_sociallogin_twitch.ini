PLG_SOCIALLOGIN_TWITCH_FIELD_APPID_LABEL = "Twitch Client ID"
PLG_SOCIALLOGIN_TWITCH_FIELD_APPID_DESC = "Inserisci qui il Client ID della tua applicazione Twitch OAuth2. Questo è necessario per abilitare l'accesso social con Twitch. Puoi creare gratuitamente un'app Twitch OAuth2 sul <a href='https://dev.twitch.tv'>portale per sviluppatori Twitch</a>."
PLG_SOCIALLOGIN_TWITCH_FIELD_APPSECRET_LABEL = "Twitch Client Secret"
PLG_SOCIALLOGIN_TWITCH_FIELD_APPSECRET_DESC = "Inserisci qui il Client Secret della tua applicazione Twitch OAuth2. Questo è necessario per abilitare l'accesso social con Twitch. Puoi creare gratuitamente un'app Twitch OAuth2 sul <a href='https://dev.twitch.tv'>portale per sviluppatori Twitch</a>."
PLG_SOCIALLOGIN_TWITCH_FIELD_LOGINUNLINKED_LABEL = "Consenti accesso social ad account non collegati"
PLG_SOCIALLOGIN_TWITCH_FIELD_LOGINUNLINKED_DESC = "Se abilitato, consente agli utenti di accedere anche senza aver collegato il proprio account Twitch all'account utente del sito. L'indirizzo email dell'account Twitch deve essere lo stesso dell'account email utilizzato sul tuo sito e deve essere visibile pubblicamente."
PLG_SOCIALLOGIN_TWITCH_FIELD_CREATENEW_LABEL = "Crea nuovi account utente"
PLG_SOCIALLOGIN_TWITCH_FIELD_CREATENEW_DESC = "Crea un nuovo utente Joomla! quando un utente tenta di accedere tramite Twitch ma non esiste un account utente Joomla! associato a quell'email o ID utente Twitch. Se la registrazione utenti è disabilitata, non verrà creato nessun account e verrà generato un errore. L'account Twitch dell'utente deve avere un indirizzo email visibile pubblicamente. Il nuovo utente Joomla! avrà un nome utente derivato dall'accesso Twitch, lo stesso indirizzo email dell'account Twitch e una password lunga e casuale (che l'utente può modificare dopo aver effettuato l'accesso). Imposta su No per impedire la creazione di account utente tramite l'accesso Twitch."
PLG_SOCIALLOGIN_TWITCH_FIELD_FORCENEW_LABEL = "Ignora l'impostazione di Joomla! per la creazione di account utente"
PLG_SOCIALLOGIN_TWITCH_FIELD_FORCENEW_DESC = "Quando sia questa opzione che l'opzione 'Crea nuovi account utente' qui sopra sono abilitate, verrà sempre creato un nuovo utente, anche se hai disabilitato la registrazione utenti nelle opzioni della pagina Utenti di Joomla!. Questo è utile per impedire a chiunque di registrarsi al tuo sito <em>a meno che</em> non disponga di un account Twitch."
PLG_SOCIALLOGIN_TWITCH_FIELD_BYPASSVALIDATION_LABEL = "Salta la validazione utente per gli utenti Twitch"
PLG_SOCIALLOGIN_TWITCH_FIELD_BYPASSVALIDATION_DESC = "Si applica solo alla creazione di nuovi account utente. Quando questa opzione è abilitata, il nuovo utente Joomla! verrà creato come attivo, senza passare per la validazione dell'account utente Joomla!. Ciò significa che non verrà inviata nessuna email di attivazione dell'account all'utente o agli amministratori del sito Joomla!. Questo è sicuro perché Twitch consente solo agli utenti con un indirizzo email verificato di usare il proprio account Twitch per accedere a siti esterni."
PLG_SOCIALLOGIN_TWITCH_FIELD_CUSTOMCSS_LABEL = "Stile dei pulsanti"
PLG_SOCIALLOGIN_TWITCH_FIELD_CUSTOMCSS_DESC = "Se abilitato, verrà inserito nell'intestazione della pagina il CSS personalizzato per lo stile dei pulsanti di accesso, collegamento e scollegamento. Disabilita questa opzione se intendi usare il tuo CSS per personalizzare i pulsanti."
PLG_SOCIALLOGIN_TWITCH_FIELD_FGCOLOR_LABEL = "Colore primo piano del pulsante"
