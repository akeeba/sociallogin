PLG_SOCIALLOGIN_TWITCH_ERROR_LOCAL_NOT_FOUND = "Non hai un account su questo sito corrispondente a questo account Twitch; oppure hai scelto di non condividere il tuo indirizzo email nel tuo profilo Twitch pubblico (questo ci impedisce di identificarti)."
PLG_SOCIALLOGIN_TWITCH_ERROR_LOCAL_USERNAME_CONFLICT = "Esiste già un account con lo stesso nome utente o indirizzo email del tuo account Twitch su questo sito; oppure hai scelto di non condividere il tuo indirizzo email nel tuo profilo Twitch pubblico (questo ci impedisce di identificarti). Accedi al tuo account su questo sito e poi collega il tuo account Twitch. Se non ricordi di avere un account utente, creane prima uno nuovo."
PLG_SOCIALLOGIN_TWITCH_ERROR_CANNOT_CREATE = "Impossibile creare un nuovo utente sul nostro sito: %s"
PLG_SOCIALLOGIN_TWITCH_NOTICE_USERACTIVATE = "Il tuo indirizzo email deve essere verificato prima di accedere a questo sito. Ti è stata inviata un'email con le istruzioni. Dopo aver seguito queste istruzioni, torna qui e riprova ad accedere a questo sito tramite Twitch."
PLG_SOCIALLOGIN_TWITCH_NOTICE_ADMINACTIVATE = "Il tuo account deve essere esaminato da un amministratore. Al termine del processo di revisione riceverai un'email di conferma. Dopo aver ricevuto quell'email, torna qui e riprova ad accedere a questo sito tramite Twitch."

