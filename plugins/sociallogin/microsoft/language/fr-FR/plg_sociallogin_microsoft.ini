PLG_SOCIALLOGIN_MICROSOFT="Akeeba Social Login - Intégration Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_DESCRIPTION="Permet la connexion sociale avec des comptes Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_LOGIN_LABEL="Se connecter avec Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_LOGIN_DESC="Connectez-vous avec votre Microsoft Account. Un nouveau compte sera créé si aucun compte correspondant n'existe sur notre site."

PLG_SOCIALLOGIN_MICROSOFT_LINK_LABEL="Associer Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_LINK_DESC="Associe votre utilisateur sur ce site à votre Microsoft Account. Vous pourrez ensuite utiliser votre Microsoft Account pour vous connecter à ce site."

PLG_SOCIALLOGIN_MICROSOFT_UNLINK_LABEL="Dissocier Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_UNLINK_DESC="Dissocie votre utilisateur sur ce site de votre Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_LABEL="Paramètre URL secret de l'administrateur"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_DESC="Si vous utilisez une extension de sécurité qui protège votre page d'administration à l'aide d'un paramètre URL, comme Admin Tools, saisissez-le ici pour activer les connexions SocialLogin dans l'interface d'administration de votre site."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LABEL="Type d'application"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_DESC="Sélectionnez le type de votre application Microsoft. Live SDK si vous avez utilisé le portail d'inscription des applications Microsoft, Azure AD si vous avez créé une inscription d'application via le portail Azure. Veuillez consulter la documentation."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LIVE="Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_AZURE="Microsoft Entra (anciennement : Azure AD)"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_LABEL="Application (Client) ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_DESC="L'Application (client) ID dans l'enregistrement d'application Azure, onglet Vue d'ensemble."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_LABEL="Valeur du secret client"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_DESC="La valeur du secret client dans Azure, Inscriptions d'applications, votre application, Certificats &amp; secrets. Veuillez consulter la documentation."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_LABEL="Type de locataire Entra ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_DESC="Choisissez quels comptes peuvent utiliser Se connecter avec Microsoft. Si vous avez une organisation, vous souhaitez probablement l'option Identifiant de locataire spécifique qui vous permet de saisir votre identifiant de locataire Azure."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_COMMON="Comptes Microsoft, et comptes professionnels ou scolaires"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_ORGANIZATIONS="Comptes professionnels ou scolaires uniquement"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_CONSUMERS="Comptes Microsoft uniquement"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_TENANTID="Identifiant de locataire spécifique"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_LABEL="Identifiant de locataire Azure"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_DESC="Votre identifiant de locataire Azure, tel que l'ID de locataire ou le nom de domaine."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_LABEL="Client ID de l'application Microsoft Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_DESC="Saisissez ici le Client ID de votre application Microsoft Live SDK. Cette information est requise pour activer la connexion sociale avec Microsoft Account. Vous pouvez créer une application Microsoft Live SDK via le portail d'inscription des applications Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_LABEL="Client Secret de l'application Microsoft Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_DESC="Saisissez ici le secret de l'application Microsoft Live SDK pour votre application Microsoft Live SDK. Cette information est requise pour activer la connexion sociale avec Microsoft Account. Vous pouvez créer une application Microsoft Live SDK via le portail d'inscription des applications Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_LABEL="Autoriser la connexion sociale aux comptes non associés"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_DESC="Lorsque cette option est activée, elle permet aux utilisateurs de se connecter même s'ils n'ont pas associé leur Microsoft Account à leur compte utilisateur sur le site. L'adresse e-mail de leur Microsoft Account doit être identique à l'adresse e-mail utilisée sur votre site."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_LABEL="Créer de nouveaux comptes utilisateurs"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_DESC="Crée un nouvel utilisateur Joomla! lorsqu'un utilisateur tente de se connecter via Microsoft Account mais qu'il n'existe aucun compte utilisateur Joomla! associé à cet e-mail ou à cet identifiant utilisateur Microsoft Account. Si l'inscription des utilisateurs est désactivée, aucun compte ne sera créé et une erreur sera générée. Le nouvel utilisateur Joomla! aura un nom d'utilisateur dérivé de son identifiant Microsoft Account, la même adresse e-mail que le Microsoft Account et un mot de passe long et aléatoire (que l'utilisateur peut modifier une fois connecté). Définissez cette option sur Non pour empêcher la création de comptes utilisateurs via la connexion Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_LABEL="Ignorer le paramètre Joomla! pour la création de comptes utilisateurs"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_DESC="Lorsque cette option et l'option «&nbsp;Créer de nouveaux comptes utilisateurs&nbsp;» ci-dessus sont toutes deux activées, un nouvel utilisateur sera toujours créé, même si vous avez désactivé l'inscription des utilisateurs dans les options de la page Utilisateurs de Joomla!. Ceci est utile pour empêcher quiconque de s'inscrire sur votre site <em>à moins</em> de disposer d'un Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_LABEL="Contourner la validation utilisateur pour les utilisateurs Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_DESC="S'applique uniquement lors de la création de nouveaux comptes utilisateurs. Lorsque cette option est activée, le nouvel utilisateur Joomla! sera créé actif, sans passer par la validation du compte utilisateur Joomla!. Cela signifie qu'aucun e-mail d'activation de compte ne sera envoyé à l'utilisateur ni aux administrateurs du site Joomla!. Ceci est sans danger car Microsoft Account n'autorise que les utilisateurs disposant d'une adresse e-mail vérifiée à posséder un Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_LABEL="Style des boutons"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_DESC="Lorsque cette option est activée, un CSS personnalisé pour le style des boutons de connexion, d'association et de dissociation sera ajouté dans l'en-tête de la page. Désactivez cette option si vous souhaitez utiliser votre propre CSS pour styliser les boutons."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_LABEL="Couleur de premier plan du bouton"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_DESC="La couleur de premier plan (texte) pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_LABEL="Couleur d'arrière-plan du bouton"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_DESC="La couleur d'arrière-plan pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_MICROSOFT_ERROR_NOT_LOGGED_IN_FB="Vous n'êtes pas connecté à Microsoft Account ou vous n'avez pas accordé les autorisations permettant à ce site de vous connecter via Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Votre compte sur ce site est désactivé ou non activé."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_NOT_FOUND="Vous n'avez pas de compte sur ce site correspondant à ce Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_USERNAME_CONFLICT="Un compte avec le même nom d'utilisateur ou la même adresse e-mail que votre Microsoft Account existe déjà sur ce site. Veuillez vous connecter à votre compte sur ce site, puis associer votre Microsoft Account à celui-ci. Si vous ne vous souvenez pas avoir un compte utilisateur, veuillez d'abord en créer un nouveau."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_CANNOT_CREATE="Impossible de créer un nouvel utilisateur sur notre site : %s"

PLG_SOCIALLOGIN_MICROSOFT_NOTICE_USERACTIVATE="Votre adresse e-mail doit être vérifiée avant de vous connecter à ce site. Un e-mail vous a été envoyé avec des instructions. Après avoir suivi ces instructions, revenez ici et réessayez de vous connecter à ce site en utilisant Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_NOTICE_ADMINACTIVATE="Votre compte doit être examiné par un administrateur. Lorsque le processus d'examen sera terminé, vous recevrez un e-mail de confirmation. Après réception de cet e-mail, revenez ici et réessayez de vous connecter à ce site en utilisant Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_LABEL="Les boutons de connexion peuvent être affichés dans"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_DESC="Dans quelle(s) partie(s) de votre site souhaitez-vous autoriser l'affichage des boutons de connexion sociale ? <br/> <strong>DANGER !</strong> Si la connexion sociale est la seule méthode de connexion d'un utilisateur, choisir une option autre que Les deux l'empêchera effectivement d'accéder à l'autre partie de votre site."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_SITE="Interface publique"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_ADMIN="Interface d'administration"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_BOTH="Les deux"
