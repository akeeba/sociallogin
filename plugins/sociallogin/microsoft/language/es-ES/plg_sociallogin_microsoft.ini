PLG_SOCIALLOGIN_MICROSOFT="Akeeba Social Login - integración con Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_DESCRIPTION="Permite el inicio de sesión social con cuentas de Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_LOGIN_LABEL="Iniciar sesión con Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_LOGIN_DESC="Inicie sesión con su Microsoft Account. Se creará una nueva cuenta si no existe ninguna cuenta coincidente en nuestro sitio."

PLG_SOCIALLOGIN_MICROSOFT_LINK_LABEL="Vincular Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_LINK_DESC="Vincula su usuario en este sitio con su Microsoft Account. Luego podrá usar su Microsoft Account para iniciar sesión en este sitio."

PLG_SOCIALLOGIN_MICROSOFT_UNLINK_LABEL="Desvincular Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_UNLINK_DESC="Desvincula su usuario en este sitio de su Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_LABEL="Parámetro URL secreto del administrador"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_DESC="Si usa un plugin de seguridad que protege su página de administrador con un parámetro URL, como Admin Tools, introdúzcalo aquí para habilitar los inicios de sesión de SocialLogin en el backend de su sitio."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LABEL="Tipo de aplicación"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_DESC="Seleccione el tipo de aplicación de Microsoft. Live SDK si usó el Portal de registro de aplicaciones de Microsoft, Azure AD si creó un registro de aplicación a través del Portal de Azure. Consulte la documentación."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LIVE="Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_AZURE="Microsoft Entra (anteriormente: Azure AD)"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_LABEL="Application (Client) ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_DESC="El Application (client) ID en el registro de aplicaciones de Azure, pestaña Información general."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_LABEL="Valor del Client Secret"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_DESC="El valor del Client Secret en Azure, Registros de aplicaciones, su aplicación, Certificados y secretos. Consulte la documentación."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_LABEL="Tipo de inquilino de Entra ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_DESC="Elija qué cuentas pueden usar Iniciar sesión con Microsoft. Si tiene una organización, probablemente quiera la opción ID de inquilino específico, que le permite introducir su ID de inquilino de Azure."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_COMMON="Cuentas Microsoft y cuentas profesionales o educativas"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_ORGANIZATIONS="Solo cuentas profesionales o educativas"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_CONSUMERS="Solo cuentas Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_TENANTID="ID de inquilino específico"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_LABEL="ID de inquilino de Azure"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_DESC="El identificador de inquilino de Azure, como el ID de inquilino o el nombre de dominio."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_LABEL="Client ID de la aplicación Microsoft Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_DESC="Introduzca aquí el Client ID de su aplicación Microsoft Live SDK. Esto es necesario para habilitar el inicio de sesión social con Microsoft Account. Puede crear una aplicación Microsoft Live SDK a través del Portal de registro de aplicaciones de Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_LABEL="Client Secret de la aplicación Microsoft Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_DESC="Introduzca aquí el Application Secret de Microsoft Live SDK para su aplicación Microsoft Live SDK. Esto es necesario para habilitar el inicio de sesión social con Microsoft Account. Puede crear una aplicación Microsoft Live SDK a través del Portal de registro de aplicaciones de Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_LABEL="Permitir el inicio de sesión social en cuentas no vinculadas"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_DESC="Cuando está habilitado, permite a los usuarios iniciar sesión aunque no hayan vinculado su Microsoft Account a su cuenta de usuario del sitio. La dirección de correo electrónico de su Microsoft Account debe ser la misma que la cuenta de correo que usan en su sitio."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_LABEL="Crear nuevas cuentas de usuario"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_DESC="Crea un nuevo usuario de Joomla! cuando un usuario intenta iniciar sesión a través de Microsoft Account pero no existe ninguna cuenta de usuario de Joomla! asociada con ese correo electrónico o ID de usuario de Microsoft Account. Si el registro de usuarios está deshabilitado, no se creará ninguna cuenta y se mostrará un error. El nuevo usuario de Joomla! tendrá un nombre de usuario derivado del inicio de sesión de Microsoft Account, la misma dirección de correo electrónico que el Microsoft Account y una contraseña larga y aleatoria (que el usuario puede cambiar una vez que haya iniciado sesión). Establezca esto en No para evitar la creación de cuentas de usuario a través del inicio de sesión de Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_LABEL="Ignorar la configuración de Joomla! para crear cuentas de usuario"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_DESC="Cuando tanto esta opción como la opción «Crear nuevas cuentas de usuario» anterior están habilitadas, siempre se creará un nuevo usuario, incluso si ha deshabilitado el registro de usuarios en las opciones de la página Usuarios de Joomla. Esto es útil para evitar que alguien se registre en su sitio <em>a menos que</em> tenga un Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_LABEL="Omitir la validación de usuario para usuarios de Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_DESC="Solo se aplica al crear nuevas cuentas de usuario. Cuando esta opción está habilitada, el nuevo usuario de Joomla! se creará activo, sin pasar por la validación de cuenta de usuario de Joomla!. Esto significa que no se enviará ningún correo electrónico de activación de cuenta al usuario ni a los administradores del sitio Joomla!. Esto es seguro porque Microsoft Account solo permite a los usuarios con una dirección de correo electrónico verificada tener un Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_LABEL="Estilo del botón"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_DESC="Cuando está habilitado, se generará CSS personalizado para el estilo de los botones de inicio de sesión, vinculación y desvinculación en el encabezado de la página. Deshabilite esta opción si pretende usar su propio CSS para dar estilo a los botones."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_LABEL="Color de primer plano del botón"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_DESC="El color de primer plano (texto) para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_LABEL="Color de fondo del botón"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_DESC="El color de fondo para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_MICROSOFT_ERROR_NOT_LOGGED_IN_FB="No ha iniciado sesión en Microsoft Account o no ha concedido permisos para que este sitio le autentique a través de Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Su cuenta en este sitio está deshabilitada o no está activada."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_NOT_FOUND="No tiene una cuenta en este sitio que corresponda a este Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_USERNAME_CONFLICT="Ya existe una cuenta en este sitio con el mismo nombre de usuario o dirección de correo electrónico que su Microsoft Account. Por favor, inicie sesión en su cuenta en este sitio y luego vincule su Microsoft Account. Si no recuerda tener una cuenta de usuario, cree primero una nueva."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_CANNOT_CREATE="No se pudo crear un nuevo usuario en nuestro sitio: %s"

PLG_SOCIALLOGIN_MICROSOFT_NOTICE_USERACTIVATE="Su dirección de correo electrónico debe verificarse antes de iniciar sesión en este sitio. Se le ha enviado un correo electrónico con instrucciones. Tras seguir estas instrucciones, vuelva aquí e intente iniciar sesión en este sitio usando Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_NOTICE_ADMINACTIVATE="Un administrador debe revisar su cuenta. Cuando el proceso de revisión se complete, recibirá un correo electrónico de confirmación. Tras recibir ese correo electrónico, vuelva aquí e intente iniciar sesión en este sitio usando Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_LABEL="Los botones de inicio de sesión se pueden mostrar en"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_DESC="¿En qué parte(s) de su sitio desea permitir mostrar los botones de Social Login? <br/> <strong>¡PELIGRO!</strong> Si el único método de inicio de sesión de un usuario es SocialLogin, elegir cualquier opción que no sea Ambos resultará en que quede efectivamente bloqueado de la otra parte de su sitio."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
