PLG_SOCIALLOGIN_MICROSOFT="Akeeba Social Login - Ενσωμάτωση Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_DESCRIPTION="Επιτρέπει την κοινωνική σύνδεση με λογαριασμούς Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_LOGIN_LABEL="Σύνδεση με Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_LOGIN_DESC="Συνδεθείτε με τον λογαριασμό σας Microsoft. Θα δημιουργηθεί νέος λογαριασμός εάν δεν υπάρχει αντίστοιχος λογαριασμός στον ιστότοπό μας."

PLG_SOCIALLOGIN_MICROSOFT_LINK_LABEL="Σύνδεση Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_LINK_DESC="Συνδέει τον χρήστη σας σε αυτόν τον ιστότοπο με τον λογαριασμό σας Microsoft. Μπορείτε έπειτα να χρησιμοποιείτε τον λογαριασμό σας Microsoft για να συνδέεστε σε αυτόν τον ιστότοπο."

PLG_SOCIALLOGIN_MICROSOFT_UNLINK_LABEL="Αποσύνδεση Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_UNLINK_DESC="Αποσυνδέει τον χρήστη σας σε αυτόν τον ιστότοπο από τον λογαριασμό σας Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_LABEL="Μυστική παράμετρος URL διαχειριστή"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_DESC="Εάν χρησιμοποιείτε πρόσθετο ασφαλείας που προστατεύει τη σελίδα διαχειριστή σας χρησιμοποιώντας παράμετρο URL, όπως το Admin Tools, εισαγάγετέ την εδώ για να ενεργοποιήσετε τις συνδέσεις SocialLogin στο διαχειριστικό τμήμα του ιστότοπού σας."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LABEL="Τύπος εφαρμογής"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_DESC="Επιλέξτε τον τύπο της εφαρμογής Microsoft σας. Live SDK εάν χρησιμοποιήσατε την Πύλη Εγγραφής Εφαρμογών Microsoft, Azure AD εάν δημιουργήσατε εγγραφή εφαρμογής μέσω της Πύλης Azure. Συμβουλευτείτε την τεκμηρίωση."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LIVE="Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_AZURE="Microsoft Entra (πρώην: Azure AD)"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_LABEL="Application (Client) ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_DESC="Το Application (client) ID στην εγγραφή εφαρμογής Azure, καρτέλα Overview."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_LABEL="Client Secret Value"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_DESC="Η τιμή Client Secret στο Azure, App registrations, την εφαρμογή σας, Certificates &amp; secrets. Συμβουλευτείτε την τεκμηρίωση."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_LABEL="Τύπος Tenant Entra ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_DESC="Επιλέξτε ποιοι λογαριασμοί μπορούν να χρησιμοποιούν τη Σύνδεση με Microsoft. Εάν έχετε οργανισμό, πιθανώς θέλετε την επιλογή Συγκεκριμένο Tenant ID που σας επιτρέπει να εισαγάγετε το Azure Tenant ID σας."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_COMMON="Λογαριασμοί Microsoft και λογαριασμοί εργασίας ή σχολείου"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_ORGANIZATIONS="Μόνο λογαριασμοί εργασίας ή σχολείου"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_CONSUMERS="Μόνο λογαριασμοί Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_TENANTID="Συγκεκριμένο Tenant ID"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_LABEL="Azure Tenant ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_DESC="Το αναγνωριστικό tenant του Azure σας, όπως το tenant ID ή το όνομα domain."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_LABEL="Microsoft Live SDK App Client ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_DESC="Εισαγάγετε εδώ το Client ID για την εφαρμογή σας Microsoft Live SDK. Αυτό απαιτείται για την ενεργοποίηση της κοινωνικής σύνδεσης με Microsoft Account. Μπορείτε να δημιουργήσετε εφαρμογή Microsoft Live SDK μέσω της Πύλης Εγγραφής Εφαρμογών Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_LABEL="Microsoft Live SDK App Client Secret"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_DESC="Εισαγάγετε εδώ το Application Secret του Microsoft Live SDK για την εφαρμογή σας Microsoft Live SDK. Αυτό απαιτείται για την ενεργοποίηση της κοινωνικής σύνδεσης με Microsoft Account. Μπορείτε να δημιουργήσετε εφαρμογή Microsoft Live SDK μέσω της Πύλης Εγγραφής Εφαρμογών Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_LABEL="Να επιτρέπεται κοινωνική σύνδεση σε μη συνδεδεμένους λογαριασμούς"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_DESC="Όταν είναι ενεργοποιημένο, επιτρέπει στους χρήστες να συνδέονται παρά το γεγονός ότι δεν έχουν συνδέσει τον λογαριασμό τους Microsoft με τον λογαριασμό χρήστη τους στον ιστότοπο. Η διεύθυνση email του λογαριασμού Microsoft πρέπει να είναι ίδια με τη διεύθυνση email που χρησιμοποιούν στον ιστότοπό σας."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_LABEL="Δημιουργία νέων λογαριασμών χρηστών"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_DESC="Δημιουργεί νέο χρήστη Joomla! όταν κάποιος χρήστης προσπαθεί να συνδεθεί μέσω Microsoft Account αλλά δεν υπάρχει λογαριασμός χρήστη Joomla! που να σχετίζεται με αυτό το email ή αναγνωριστικό χρήστη Microsoft Account. Εάν η εγγραφή χρηστών είναι απενεργοποιημένη, δεν θα δημιουργηθεί λογαριασμός και θα εμφανιστεί σφάλμα. Ο νέος χρήστης Joomla! θα έχει όνομα χρήστη που θα προέρχεται από τη σύνδεση Microsoft Account, την ίδια διεύθυνση email με τον λογαριασμό Microsoft Account και έναν μακρύ, τυχαίο κωδικό πρόσβασης (τον οποίο ο χρήστης μπορεί να αλλάξει μόλις συνδεθεί). Ορίστε αυτό σε Όχι για να αποτρέψετε τη δημιουργία λογαριασμών χρηστών μέσω σύνδεσης Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_LABEL="Παράβλεψη ρύθμισης Joomla! για δημιουργία λογαριασμών χρηστών"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_DESC="Όταν τόσο αυτή η επιλογή όσο και η επιλογή «Δημιουργία νέων λογαριασμών χρηστών» παραπάνω είναι ενεργοποιημένες, θα δημιουργείται πάντα νέος χρήστης, ακόμη και αν έχετε απενεργοποιήσει την εγγραφή χρηστών στις επιλογές της σελίδας Χρηστών του Joomla. Αυτό είναι χρήσιμο για να αποτρέψετε οποιονδήποτε από το να εγγραφεί στον ιστότοπό σας <em>εκτός εάν</em> έχει λογαριασμό Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_LABEL="Παράκαμψη επικύρωσης χρήστη για χρήστες Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_DESC="Ισχύει μόνο κατά τη δημιουργία νέων λογαριασμών χρηστών. Όταν αυτή η επιλογή είναι ενεργοποιημένη, ο νέος χρήστης Joomla! θα δημιουργείται ενεργός, χωρίς να περνά από την επικύρωση λογαριασμού χρήστη του Joomla!. Αυτό σημαίνει ότι δεν θα αποστέλλεται email ενεργοποίησης λογαριασμού στον χρήστη ή στους διαχειριστές του ιστότοπου Joomla!. Αυτό είναι ασφαλές επειδή το Microsoft Account επιτρέπει μόνο σε χρήστες με επαληθευμένη διεύθυνση email να κατέχουν λογαριασμό Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_LABEL="Στυλιζάρισμα κουμπιών"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_DESC="Όταν είναι ενεργοποιημένο, προσαρμοσμένο CSS για το στυλιζάρισμα κουμπιών σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης θα εξάγεται στην κεφαλίδα της σελίδας. Απενεργοποιήστε αυτή την επιλογή εάν σκοπεύετε να χρησιμοποιήσετε το δικό σας CSS για τα κουμπιά."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_LABEL="Χρώμα προσκηνίου κουμπιού"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_DESC="Το χρώμα προσκηνίου (κειμένου) για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_LABEL="Χρώμα φόντου κουμπιού"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_DESC="Το χρώμα φόντου για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_MICROSOFT_ERROR_NOT_LOGGED_IN_FB="Δεν είστε συνδεδεμένοι στο Microsoft Account ή δεν παραχωρήσατε άδειες για να συνδεθείτε σε αυτόν τον ιστότοπο μέσω Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ο λογαριασμός σας σε αυτόν τον ιστότοπο είναι απενεργοποιημένος ή δεν έχει ενεργοποιηθεί."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_NOT_FOUND="Δεν έχετε λογαριασμό σε αυτόν τον ιστότοπο που να αντιστοιχεί σε αυτό το Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_USERNAME_CONFLICT="Υπάρχει ήδη λογαριασμός με το ίδιο όνομα χρήστη ή διεύθυνση email με τον λογαριασμό σας Microsoft Account σε αυτόν τον ιστότοπο. Παρακαλώ συνδεθείτε στον λογαριασμό σας σε αυτόν τον ιστότοπο και στη συνέχεια συνδέστε τον λογαριασμό σας Microsoft Account με αυτόν. Εάν δεν θυμάστε να έχετε λογαριασμό χρήστη, παρακαλώ δημιουργήστε πρώτα έναν νέο."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_CANNOT_CREATE="Δεν ήταν δυνατή η δημιουργία νέου χρήστη στον ιστότοπό μας: %s"

PLG_SOCIALLOGIN_MICROSOFT_NOTICE_USERACTIVATE="Η διεύθυνση email σας πρέπει να επαληθευτεί πριν από τη σύνδεση σε αυτόν τον ιστότοπο. Σας έχει αποσταλεί email με οδηγίες. Αφού ακολουθήσετε αυτές τις οδηγίες, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_NOTICE_ADMINACTIVATE="Ο λογαριασμός σας πρέπει να ελεγχθεί από έναν διαχειριστή. Όταν ολοκληρωθεί η διαδικασία ελέγχου, θα λάβετε email επιβεβαίωσης. Αφού λάβετε αυτό το email, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_LABEL="Τα κουμπιά σύνδεσης μπορούν να εμφανιστούν σε"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_DESC="Σε ποιο τμήμα (τμήματα) του ιστότοπού σας θέλετε να επιτρέπεται η εμφάνιση των κουμπιών κοινωνικής σύνδεσης; <br/> <strong>ΚΙΝΔΥΝΟΣ!</strong> Εάν η μόνη μέθοδος σύνδεσης ενός χρήστη είναι το SocialLogin, η επιλογή οποιασδήποτε επιλογής εκτός από Και τα δύο θα έχει ως αποτέλεσμα να αποκλειστεί ουσιαστικά από το άλλο τμήμα του ιστότοπού σας."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_SITE="Εμπρόσθιο τμήμα"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_ADMIN="Διαχειριστικό τμήμα"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_BOTH="Και τα δύο"
