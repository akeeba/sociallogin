PLG_SOCIALLOGIN_MICROSOFT="Akeeba Social Login - Microsoft Account Integration"
PLG_SOCIALLOGIN_MICROSOFT_DESCRIPTION="Ermöglicht die Anmeldung mit Microsoft Account-Konten."

PLG_SOCIALLOGIN_MICROSOFT_LOGIN_LABEL="Mit Microsoft anmelden"
PLG_SOCIALLOGIN_MICROSOFT_LOGIN_DESC="Melden Sie sich mit Ihrem Microsoft Account an. Ein neues Konto wird erstellt, wenn kein übereinstimmendes Konto auf unserer Website vorhanden ist."

PLG_SOCIALLOGIN_MICROSOFT_LINK_LABEL="Microsoft Account verknüpfen"
PLG_SOCIALLOGIN_MICROSOFT_LINK_DESC="Verknüpft Ihren Benutzer auf dieser Website mit Ihrem Microsoft Account. Sie können sich dann mit Ihrem Microsoft Account auf dieser Website anmelden."

PLG_SOCIALLOGIN_MICROSOFT_UNLINK_LABEL="Microsoft Account-Verknüpfung aufheben"
PLG_SOCIALLOGIN_MICROSOFT_UNLINK_DESC="Hebt die Verknüpfung Ihres Benutzers auf dieser Website mit Ihrem Microsoft Account auf."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_LABEL="Administrator-Geheim-URL-Parameter"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_DESC="Wenn Sie ein Sicherheits-Plugin verwenden, das Ihre Administrator-Seite mit einem URL-Parameter schützt (z. B. Admin Tools), geben Sie diesen hier ein, um SocialLogin-Anmeldungen im Backend Ihrer Website zu ermöglichen."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LABEL="Anwendungstyp"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_DESC="Wählen Sie Ihren Microsoft-Anwendungstyp. Live SDK, wenn Sie das Microsoft Application Registration Portal verwendet haben, Azure AD, wenn Sie eine App-Registrierung über das Azure-Portal erstellt haben. Bitte konsultieren Sie die Dokumentation."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LIVE="Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_AZURE="Microsoft Entra (ehemals: Azure AD)"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_LABEL="Application (Client) ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_DESC="Die Application (Client) ID in der Azure App-Registrierung, Registerkarte Übersicht."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_LABEL="Client Secret-Wert"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_DESC="Der Client Secret-Wert in Azure, App-Registrierungen, Ihre Anwendung, Zertifikate &amp; Geheimnisse. Bitte konsultieren Sie die Dokumentation."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_LABEL="Entra ID Mandantentyp"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_DESC="Wählen Sie aus, welche Konten die Microsoft-Anmeldung verwenden können. Wenn Sie eine Organisation haben, möchten Sie wahrscheinlich die Option „Spezifische Mandanten-ID" wählen, mit der Sie Ihre Azure-Mandanten-ID eingeben können."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_COMMON="Microsoft-Konten sowie Geschäfts- oder Schulkonten"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_ORGANIZATIONS="Nur Geschäfts- oder Schulkonten"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_CONSUMERS="Nur Microsoft-Konten"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_TENANTID="Spezifische Mandanten-ID"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_LABEL="Azure Mandanten-ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_DESC="Ihr Azure-Mandanten-Bezeichner, z. B. die Mandanten-ID oder der Domänenname."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_LABEL="Microsoft Live SDK App Client ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_DESC="Geben Sie hier die Client ID für Ihre Microsoft Live SDK-Anwendung ein. Dies ist erforderlich, um die Anmeldung mit Microsoft Account zu aktivieren. Sie können eine Microsoft Live SDK-App über das Microsoft Application Registration Portal erstellen."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_LABEL="Microsoft Live SDK App Client Secret"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_DESC="Geben Sie hier das Microsoft Live SDK Application Secret für Ihre Microsoft Live SDK-Anwendung ein. Dies ist erforderlich, um die Anmeldung mit Microsoft Account zu aktivieren. Sie können eine Microsoft Live SDK-App über das Microsoft Application Registration Portal erstellen."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_LABEL="Social-Login für nicht verknüpfte Konten erlauben"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_DESC="Wenn aktiviert, können sich Benutzer anmelden, auch wenn ihr Microsoft Account nicht mit ihrem Website-Benutzerkonto verknüpft ist. Die E-Mail-Adresse des Microsoft Accounts muss mit der E-Mail-Adresse übereinstimmen, die auf Ihrer Website verwendet wird."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_LABEL="Neue Benutzerkonten erstellen"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_DESC="Erstellt einen neuen Joomla!-Benutzer, wenn sich ein Benutzer über Microsoft Account anmelden möchte, aber kein Joomla!-Benutzerkonto mit dieser E-Mail-Adresse oder Microsoft Account-Benutzer-ID verknüpft ist. Wenn die Benutzerregistrierung deaktiviert ist, wird kein Konto erstellt und ein Fehler ausgegeben. Der neue Joomla!-Benutzer erhält einen aus dem Microsoft Account-Login abgeleiteten Benutzernamen, dieselbe E-Mail-Adresse wie der Microsoft Account und ein langes, zufälliges Passwort (das der Benutzer nach der Anmeldung ändern kann). Setzen Sie dies auf Nein, um die Erstellung von Benutzerkonten über die Microsoft Account-Anmeldung zu verhindern."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_LABEL="Joomla!-Einstellung zur Benutzerkontenerstellung ignorieren"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_DESC="Wenn sowohl diese Option als auch die obige Option „Neue Benutzerkonten erstellen" aktiviert sind, wird immer ein neuer Benutzer erstellt, auch wenn Sie die Benutzerregistrierung in den Optionen der Joomla!-Benutzerseite deaktiviert haben. Dies ist nützlich, um zu verhindern, dass sich jemand auf Ihrer Website registriert, <em>es sei denn</em>, er hat einen Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_LABEL="Benutzervalidierung für Microsoft-Benutzer überspringen"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_DESC="Gilt nur beim Erstellen neuer Benutzerkonten. Wenn diese Option aktiviert ist, wird der neue Joomla!-Benutzer ohne die Joomla!-Benutzerkonto-Validierung aktiv erstellt. Das bedeutet, dass keine Konto-Aktivierungs-E-Mail an den Benutzer oder die Administratoren der Joomla!-Website gesendet wird. Dies ist sicher, da Microsoft Account nur Benutzern mit einer verifizierten E-Mail-Adresse erlaubt, einen Microsoft Account zu besitzen."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_LABEL="Schaltflächenstil"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_DESC="Wenn aktiviert, wird benutzerdefiniertes CSS für die Gestaltung der Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen in den Seitenkopf ausgegeben. Deaktivieren Sie diese Option, wenn Sie Ihr eigenes CSS zur Gestaltung der Schaltflächen verwenden möchten."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_LABEL="Vordergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_DESC="Die Vordergrundfarbe (Text) für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_LABEL="Hintergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_DESC="Die Hintergrundfarbe für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_MICROSOFT_ERROR_NOT_LOGGED_IN_FB="Sie sind nicht bei Microsoft Account angemeldet oder haben dieser Website keine Berechtigungen erteilt, Sie über Microsoft Account anzumelden."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ihr Konto auf dieser Website ist deaktiviert oder noch nicht aktiviert."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_NOT_FOUND="Sie haben kein Konto auf dieser Website, das diesem Microsoft Account entspricht."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_USERNAME_CONFLICT="Auf dieser Website existiert bereits ein Konto mit demselben Benutzernamen oder derselben E-Mail-Adresse wie Ihr Microsoft Account. Bitte melden Sie sich bei Ihrem Konto auf dieser Website an und verknüpfen Sie dann Ihren Microsoft Account damit. Wenn Sie sich nicht erinnern, bereits ein Benutzerkonto zu haben, erstellen Sie bitte zuerst ein neues."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_CANNOT_CREATE="Es konnte kein neuer Benutzer auf unserer Website erstellt werden: %s"

PLG_SOCIALLOGIN_MICROSOFT_NOTICE_USERACTIVATE="Ihre E-Mail-Adresse muss verifiziert werden, bevor Sie sich auf dieser Website anmelden können. Eine E-Mail mit Anweisungen wurde an Sie gesendet. Nachdem Sie diesen Anweisungen gefolgt sind, kehren Sie bitte hierher zurück und versuchen Sie erneut, sich mit Microsoft Account auf dieser Website anzumelden."
PLG_SOCIALLOGIN_MICROSOFT_NOTICE_ADMINACTIVATE="Ihr Konto muss von einem Administrator überprüft werden. Wenn der Überprüfungsprozess abgeschlossen ist, erhalten Sie eine Bestätigungs-E-Mail. Kehren Sie nach Erhalt dieser E-Mail hierher zurück und versuchen Sie erneut, sich mit Microsoft Account auf dieser Website anzumelden."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_LABEL="Anmelde-Schaltflächen können angezeigt werden in"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_DESC="In welchem Teil/welchen Teilen Ihrer Website möchten Sie das Anzeigen der Social-Login-Schaltflächen erlauben? <br/> <strong>ACHTUNG!</strong> Wenn die einzige Anmeldemethode eines Benutzers SocialLogin ist, führt die Auswahl einer anderen Option als „Beide" dazu, dass der Benutzer im anderen Teil Ihrer Website praktisch ausgesperrt ist."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_BOTH="Beide"
