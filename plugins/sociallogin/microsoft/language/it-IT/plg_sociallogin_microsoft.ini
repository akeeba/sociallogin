PLG_SOCIALLOGIN_MICROSOFT="Akeeba Social Login - integrazione Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_DESCRIPTION="Consente l'accesso social con account Microsoft."

PLG_SOCIALLOGIN_MICROSOFT_LOGIN_LABEL="Accedi con Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_LOGIN_DESC="Accedi con il tuo Microsoft Account. Se non esiste un account corrispondente sul nostro sito, ne verrà creato uno nuovo."

PLG_SOCIALLOGIN_MICROSOFT_LINK_LABEL="Collega Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_LINK_DESC="Collega il tuo utente su questo sito al tuo Microsoft Account. Potrai quindi usare il tuo Microsoft Account per accedere a questo sito."

PLG_SOCIALLOGIN_MICROSOFT_UNLINK_LABEL="Scollega Microsoft Account"
PLG_SOCIALLOGIN_MICROSOFT_UNLINK_DESC="Scollega il tuo utente su questo sito dal tuo Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_LABEL="Parametro URL segreto amministratore"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ADMINKEY_DESC="Se stai usando un plugin di sicurezza che protegge la pagina di amministrazione tramite un parametro URL, come Admin Tools, inseriscilo qui per abilitare gli accessi SocialLogin nel backend del tuo sito."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LABEL="Tipo di applicazione"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_DESC="Seleziona il tipo di applicazione Microsoft. Live SDK se hai usato il Microsoft Application Registration Portal, Azure AD se hai creato una registrazione dell'app tramite il portale Azure. Consulta la documentazione."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_LIVE="Live SDK"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPTYPE_AZURE="Microsoft Entra (precedentemente: Azure AD)"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_LABEL="Application (Client) ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPID_DESC="L'Application (client) ID nella registrazione dell'app Azure, scheda Panoramica."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_LABEL="Valore del segreto client"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZAPPSECRET_DESC="Il valore del segreto client in Azure, Registrazioni app, la tua applicazione, Certificati e segreti. Consulta la documentazione."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_LABEL="Tipo di tenant Entra ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_DESC="Scegli quali account possono usare Accedi con Microsoft. Se hai un'organizzazione probabilmente vorrai l'opzione ID tenant specifico che ti consente di inserire il tuo Azure Tenant ID."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_COMMON="Account Microsoft e account aziendali o scolastici"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_ORGANIZATIONS="Solo account aziendali o scolastici"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_CONSUMERS="Solo account Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_TYPE_OPT_TENANTID="ID tenant specifico"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_LABEL="Azure Tenant ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_AZURE_TENANT_DESC="Il tuo identificatore tenant Azure, ad esempio l'ID tenant o il nome di dominio."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_LABEL="Microsoft Live SDK App Client ID"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPID_DESC="Inserisci qui il Client ID della tua applicazione Microsoft Live SDK. Questo è necessario per abilitare l'accesso social con Microsoft Account. Puoi creare un'app Microsoft Live SDK tramite il Microsoft Application Registration Portal."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_LABEL="Microsoft Live SDK App Client Secret"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_APPSECRET_DESC="Inserisci qui il segreto dell'applicazione Microsoft Live SDK per la tua applicazione Microsoft Live SDK. Questo è necessario per abilitare l'accesso social con Microsoft Account. Puoi creare un'app Microsoft Live SDK tramite il Microsoft Application Registration Portal."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_LABEL="Consenti accesso social ad account non collegati"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_LOGINUNLINKED_DESC="Se abilitato, consente agli utenti di accedere anche senza aver collegato il proprio Microsoft Account all'account utente del sito. L'indirizzo email del Microsoft Account deve essere lo stesso dell'account email utilizzato sul tuo sito."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_LABEL="Crea nuovi account utente"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CREATENEW_DESC="Crea un nuovo utente Joomla! quando un utente tenta di accedere tramite Microsoft Account ma non esiste un account utente Joomla! associato a quell'email o ID utente Microsoft Account. Se la registrazione utenti è disabilitata, non verrà creato nessun account e verrà generato un errore. Il nuovo utente Joomla! avrà un nome utente derivato dall'accesso Microsoft Account, lo stesso indirizzo email del Microsoft Account e una password lunga e casuale (che l'utente può modificare dopo aver effettuato l'accesso). Imposta su No per impedire la creazione di account utente tramite l'accesso Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_LABEL="Ignora l'impostazione di Joomla! per la creazione di account utente"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FORCENEW_DESC="Quando sia questa opzione che l'opzione 'Crea nuovi account utente' qui sopra sono abilitate, verrà sempre creato un nuovo utente, anche se hai disabilitato la registrazione utenti nelle opzioni della pagina Utenti di Joomla!. Questo è utile per impedire a chiunque di registrarsi al tuo sito <em>a meno che</em> non disponga di un Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_LABEL="Salta la validazione utente per gli utenti Microsoft"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BYPASSVALIDATION_DESC="Si applica solo alla creazione di nuovi account utente. Quando questa opzione è abilitata, il nuovo utente Joomla! verrà creato come attivo, senza passare per la validazione dell'account utente Joomla!. Ciò significa che non verrà inviata nessuna email di attivazione dell'account all'utente o agli amministratori del sito Joomla!. Questo è sicuro perché Microsoft Account consente solo agli utenti con un indirizzo email verificato di possedere un Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_LABEL="Stile dei pulsanti"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_CUSTOMCSS_DESC="Se abilitato, verrà inserito nell'intestazione della pagina il CSS personalizzato per lo stile dei pulsanti di accesso, collegamento e scollegamento. Disabilita questa opzione se intendi usare il tuo CSS per personalizzare i pulsanti."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_LABEL="Colore primo piano del pulsante"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_FGCOLOR_DESC="Il colore del primo piano (testo) per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_LABEL="Colore di sfondo del pulsante"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_BGCOLOR_DESC="Il colore di sfondo per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_MICROSOFT_ERROR_NOT_LOGGED_IN_FB="Non hai effettuato l'accesso a Microsoft Account o non hai concesso le autorizzazioni necessarie affinché questo sito ti autentichi tramite Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Il tuo account su questo sito è disabilitato o non attivato."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_NOT_FOUND="Non hai un account su questo sito corrispondente a questo Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_LOCAL_USERNAME_CONFLICT="Esiste già un account con lo stesso nome utente o indirizzo email del tuo Microsoft Account su questo sito. Accedi al tuo account su questo sito e poi collega il tuo Microsoft Account. Se non ricordi di avere un account utente, creane prima uno nuovo."
PLG_SOCIALLOGIN_MICROSOFT_ERROR_CANNOT_CREATE="Impossibile creare un nuovo utente sul nostro sito: %s"

PLG_SOCIALLOGIN_MICROSOFT_NOTICE_USERACTIVATE="Il tuo indirizzo email deve essere verificato prima di accedere a questo sito. Ti è stata inviata un'email con le istruzioni. Dopo aver seguito queste istruzioni, torna qui e riprova ad accedere a questo sito tramite Microsoft Account."
PLG_SOCIALLOGIN_MICROSOFT_NOTICE_ADMINACTIVATE="Il tuo account deve essere esaminato da un amministratore. Al termine del processo di revisione riceverai un'email di conferma. Dopo aver ricevuto quell'email, torna qui e riprova ad accedere a questo sito tramite Microsoft Account."

PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_LABEL="I pulsanti di accesso possono essere visualizzati in"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_DESC="In quale/i parte/i del tuo sito vuoi consentire la visualizzazione dei pulsanti Social Login? <br/> <strong>ATTENZIONE!</strong> Se l'unico metodo di accesso di un utente è SocialLogin, scegliere un'opzione diversa da Entrambi comporterà l'impossibilità di accedere all'altra parte del sito."
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_MICROSOFT_FIELD_ENABLEDAPPLICATIONS_BOTH="Entrambi"
