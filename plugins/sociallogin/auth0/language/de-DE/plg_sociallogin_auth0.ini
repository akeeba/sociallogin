PLG_SOCIALLOGIN_AUTH0="Akeeba Social Login - Auth0 SSO Integration"
PLG_SOCIALLOGIN_AUTH0_DESCRIPTION="Ermöglicht die Anmeldung auf Ihrer Website über den Single Sign-On (SSO) Dienst von Auth0 NAS-Geräten und virtuellen Auth0 DSM-Instanzen."

PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_LABEL="Domain-URL"
PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_DESC="Diese finden Sie in Ihrer Auth0-Anwendungsdomäne. Fügen Sie 'https://' hinzu."

PLG_SOCIALLOGIN_AUTH0_LOGIN_LABEL="Mit Auth0 SSO anmelden"
PLG_SOCIALLOGIN_AUTH0_LOGIN_DESC="Melden Sie sich mit Ihrem Auth0 Single Sign-On-Konto an. Ein neues Konto wird erstellt, wenn kein übereinstimmendes Konto auf unserer Website vorhanden ist."

PLG_SOCIALLOGIN_AUTH0_LINK_LABEL="Auth0 SSO verknüpfen"
PLG_SOCIALLOGIN_AUTH0_LINK_DESC="Verknüpft Ihren Benutzer auf dieser Website mit Auth0 SSO. Sie können sich dann mit Auth0 SSO auf dieser Website anmelden."

PLG_SOCIALLOGIN_AUTH0_UNLINK_LABEL="Auth0 SSO-Verknüpfung aufheben"
PLG_SOCIALLOGIN_AUTH0_UNLINK_DESC="Hebt die Verknüpfung Ihres Benutzerkontos auf dieser Website mit Ihrem Auth0 SSO-Konto auf."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_LABEL="Application ID"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_DESC="Geben Sie die Application ID ein. Sie können eine neue Anwendung erstellen und diese Informationen erhalten, indem Sie sich bei Auth0 DSM anmelden und zu SSO-Server, Anwendung navigieren."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_LABEL="Application Secret"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_DESC="Geben Sie das Application Secret ein. Sie können eine neue Anwendung erstellen und diese Informationen erhalten, indem Sie sich bei Auth0 DSM anmelden und zu SSO-Server, Anwendung navigieren."

PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_LABEL="Social-Login für nicht verknüpfte Konten erlauben"
PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_DESC="Wenn aktiviert, können sich Benutzer anmelden, auch wenn ihr Auth0 SSO-Konto nicht mit ihrem Website-Benutzerkonto verknüpft ist. Die E-Mail-Adresse des Auth0 SSO-Kontos muss mit der E-Mail-Adresse übereinstimmen, die auf Ihrer Website verwendet wird."

PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_LABEL="Neue Benutzerkonten erstellen"
PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_DESC="Erstellt einen neuen Joomla!-Benutzer, wenn sich ein Benutzer über Auth0 SSO anmelden möchte, aber kein Joomla!-Benutzerkonto mit dieser E-Mail-Adresse oder diesem Auth0 SSO-Benutzernamen verknüpft ist. Wenn die Benutzerregistrierung deaktiviert ist, wird kein Konto erstellt und ein Fehler ausgegeben. Der neue Joomla!-Benutzer erhält denselben Benutzernamen wie das Auth0 SSO-Konto, dieselbe E-Mail-Adresse wie das Auth0 SSO-Konto, einen Namen in der Form „Auth0 SSO User some_username" und ein langes, zufälliges Passwort (das der Benutzer nach der Anmeldung ändern kann). Setzen Sie dies auf Nein, um die Erstellung von Benutzerkonten über Auth0 SSO zu verhindern."

PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_LABEL="Joomla!-Einstellung zur Benutzerkontenerstellung ignorieren"
PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_DESC="Wenn sowohl diese Option als auch die obige Option „Neue Benutzerkonten erstellen" aktiviert sind, wird immer ein neuer Benutzer erstellt, auch wenn Sie die Benutzerregistrierung in den Optionen der Joomla!-Benutzerseite deaktiviert haben. Dies ist nützlich, um zu verhindern, dass sich jemand auf Ihrer Website registriert, <em>es sei denn</em>, er hat ein Auth0 SSO-Konto."

PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_LABEL="Benutzervalidierung für Auth0 SSO-Benutzer überspringen"
PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_DESC="Gilt nur beim Erstellen neuer Benutzerkonten. Wenn diese Option aktiviert ist, wird der neue Joomla!-Benutzer ohne die Joomla!-Benutzerkonto-Validierung aktiv erstellt. Das bedeutet, dass keine Konto-Aktivierungs-E-Mail an den Benutzer oder die Administratoren der Joomla!-Website gesendet wird. Dies ist sicher, da Auth0 SSO-Konten manuell von den Administratoren der verwendeten Auth0 DSM-Instanz validiert werden."

PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_LABEL="Schaltflächenstil"
PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_DESC="Wenn aktiviert, wird benutzerdefiniertes CSS für die Gestaltung der Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen in den Seitenkopf ausgegeben. Deaktivieren Sie diese Option, wenn Sie Ihr eigenes CSS zur Gestaltung der Schaltflächen verwenden möchten."

PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_LABEL="Vordergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_DESC="Die Vordergrundfarbe (Text) für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_LABEL="Hintergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_DESC="Die Hintergrundfarbe für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_AUTH0_ERROR_NOT_LOGGED_IN_FB="Sie sind nicht bei Ihrem Auth0 SSO-Konto angemeldet."
PLG_SOCIALLOGIN_AUTH0_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ihr Konto auf dieser Website ist deaktiviert oder noch nicht aktiviert."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_NOT_FOUND="Sie haben kein Konto auf dieser Website, das diesem Auth0 SSO-Konto entspricht."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_USERNAME_CONFLICT="Auf dieser Website existiert bereits ein Konto mit demselben Benutzernamen oder derselben E-Mail-Adresse wie Ihr Auth0 SSO. Bitte melden Sie sich bei Ihrem Konto auf dieser Website an und verknüpfen Sie dann Ihr Auth0 SSO-Konto damit. Wenn Sie sich nicht erinnern, bereits ein Benutzerkonto zu haben, erstellen Sie bitte zuerst ein neues."
PLG_SOCIALLOGIN_AUTH0_ERROR_CANNOT_CREATE="Es konnte kein neuer Benutzer auf unserer Website erstellt werden: %s"

PLG_SOCIALLOGIN_AUTH0_NOTICE_USERACTIVATE="Ihre E-Mail-Adresse muss verifiziert werden, bevor Sie sich auf dieser Website anmelden können. Eine E-Mail mit Anweisungen wurde an Sie gesendet. Nachdem Sie diesen Anweisungen gefolgt sind, kehren Sie bitte hierher zurück und versuchen Sie erneut, sich mit Auth0 SSO auf dieser Website anzumelden."
PLG_SOCIALLOGIN_AUTH0_NOTICE_ADMINACTIVATE="Ihr Konto muss von einem Administrator überprüft werden. Wenn der Überprüfungsprozess abgeschlossen ist, erhalten Sie eine Bestätigungs-E-Mail. Kehren Sie nach Erhalt dieser E-Mail hierher zurück und versuchen Sie erneut, sich mit Auth0 SSO auf dieser Website anzumelden."

PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_LABEL="Anmelde-Schaltflächen können angezeigt werden in"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_DESC="In welchem Teil/welchen Teilen Ihrer Website möchten Sie das Anzeigen der Social-Login-Schaltflächen erlauben? <br/> <strong>ACHTUNG!</strong> Wenn die einzige Anmeldemethode eines Benutzers SocialLogin ist, führt die Auswahl einer anderen Option als „Beide" dazu, dass der Benutzer im anderen Teil Ihrer Website praktisch ausgesperrt ist."
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_BOTH="Beide"
