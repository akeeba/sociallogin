PLG_SOCIALLOGIN_AUTH0="Akeeba Social Login - Intégration Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_DESCRIPTION="Permet la connexion à votre site en utilisant le service d'authentification unique (SSO) fourni par les périphériques NAS Auth0 et les instances de machine virtuelle Auth0 DSM."

PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_LABEL="URL du domaine"
PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_DESC="Vous pouvez trouver cette information dans votre domaine d'application Auth0. Ajoutez «&nbsp;https://&nbsp;»."

PLG_SOCIALLOGIN_AUTH0_LOGIN_LABEL="Se connecter avec Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LOGIN_DESC="Connectez-vous avec votre compte Auth0 Single Sign-On. Un nouveau compte sera créé si aucun compte correspondant n'existe sur notre site."

PLG_SOCIALLOGIN_AUTH0_LINK_LABEL="Associer Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LINK_DESC="Associe votre utilisateur sur ce site à Auth0 SSO. Vous pourrez ensuite vous connecter à ce site en utilisant Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_UNLINK_LABEL="Dissocier Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_UNLINK_DESC="Dissocie votre compte utilisateur sur ce site de votre compte Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_LABEL="Application ID"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_DESC="Saisissez l'Application ID. Vous pouvez créer une nouvelle application et obtenir cette information en vous connectant à Auth0 DSM et en accédant à Serveur SSO, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_LABEL="Application Secret"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_DESC="Saisissez l'Application Secret. Vous pouvez créer une nouvelle application et obtenir cette information en vous connectant à Auth0 DSM et en accédant à Serveur SSO, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_LABEL="Autoriser la connexion sociale aux comptes non associés"
PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_DESC="Lorsque cette option est activée, elle permet aux utilisateurs de se connecter même s'ils n'ont pas associé leur compte Auth0 SSO à leur compte utilisateur sur le site. L'adresse e-mail de leur compte Auth0 SSO doit être identique à l'adresse e-mail utilisée sur votre site."

PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_LABEL="Créer de nouveaux comptes utilisateurs"
PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_DESC="Crée un nouvel utilisateur Joomla! lorsqu'un utilisateur tente de se connecter via Auth0 SSO mais qu'il n'existe aucun compte utilisateur Joomla! associé à cet e-mail ou à ce nom d'utilisateur Auth0 SSO. Si l'inscription des utilisateurs est désactivée, aucun compte ne sera créé et une erreur sera générée. Le nouvel utilisateur Joomla! aura le même nom d'utilisateur que le compte Auth0 SSO, la même adresse e-mail que le compte Auth0 SSO, un nom de la forme «&nbsp;Auth0 SSO User some_username&nbsp;», et un mot de passe long et aléatoire (que l'utilisateur peut modifier une fois connecté). Définissez cette option sur Non pour empêcher la création de comptes utilisateurs via la connexion Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_LABEL="Ignorer le paramètre Joomla! pour la création de comptes utilisateurs"
PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_DESC="Lorsque cette option et l'option «&nbsp;Créer de nouveaux comptes utilisateurs&nbsp;» ci-dessus sont toutes deux activées, un nouvel utilisateur sera toujours créé, même si vous avez désactivé l'inscription des utilisateurs dans les options de la page Utilisateurs de Joomla!. Ceci est utile pour empêcher quiconque de s'inscrire sur votre site <em>à moins</em> de disposer d'un compte Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_LABEL="Contourner la validation utilisateur pour les utilisateurs Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_DESC="S'applique uniquement lors de la création de nouveaux comptes utilisateurs. Lorsque cette option est activée, le nouvel utilisateur Joomla! sera créé actif, sans passer par la validation du compte utilisateur Joomla!. Cela signifie qu'aucun e-mail d'activation de compte ne sera envoyé à l'utilisateur ni aux administrateurs du site Joomla!. Ceci est sans danger car les comptes Auth0 SSO sont validés manuellement par les administrateurs de l'instance Auth0 DSM que vous utilisez."

PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_LABEL="Style des boutons"
PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_DESC="Lorsque cette option est activée, un CSS personnalisé pour le style des boutons de connexion, d'association et de dissociation sera ajouté dans l'en-tête de la page. Désactivez cette option si vous souhaitez utiliser votre propre CSS pour styliser les boutons."

PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_LABEL="Couleur de premier plan du bouton"
PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_DESC="La couleur de premier plan (texte) pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_LABEL="Couleur d'arrière-plan du bouton"
PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_DESC="La couleur d'arrière-plan pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_AUTH0_ERROR_NOT_LOGGED_IN_FB="Vous n'êtes pas connecté à votre compte Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Votre compte sur ce site est désactivé ou non activé."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_NOT_FOUND="Vous n'avez pas de compte sur ce site correspondant à ce compte Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_USERNAME_CONFLICT="Un compte avec le même nom d'utilisateur ou la même adresse e-mail que votre Auth0 SSO existe déjà sur ce site. Veuillez vous connecter à votre compte sur ce site, puis associer votre compte Auth0 SSO à celui-ci. Si vous ne vous souvenez pas avoir un compte utilisateur, veuillez d'abord en créer un nouveau."
PLG_SOCIALLOGIN_AUTH0_ERROR_CANNOT_CREATE="Impossible de créer un nouvel utilisateur sur notre site : %s"

PLG_SOCIALLOGIN_AUTH0_NOTICE_USERACTIVATE="Votre adresse e-mail doit être vérifiée avant de vous connecter à ce site. Un e-mail vous a été envoyé avec des instructions. Après avoir suivi ces instructions, revenez ici et réessayez de vous connecter à ce site en utilisant Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_NOTICE_ADMINACTIVATE="Votre compte doit être examiné par un administrateur. Lorsque le processus d'examen sera terminé, vous recevrez un e-mail de confirmation. Après réception de cet e-mail, revenez ici et réessayez de vous connecter à ce site en utilisant Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_LABEL="Les boutons de connexion peuvent être affichés dans"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_DESC="Dans quelle(s) partie(s) de votre site souhaitez-vous autoriser l'affichage des boutons de connexion sociale ? <br/> <strong>DANGER !</strong> Si la connexion sociale est la seule méthode de connexion d'un utilisateur, choisir une option autre que Les deux l'empêchera effectivement d'accéder à l'autre partie de votre site."
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_SITE="Interface publique"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_ADMIN="Interface d'administration"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_BOTH="Les deux"
