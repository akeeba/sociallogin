PLG_SOCIALLOGIN_AUTH0="Akeeba Social Login - integração com Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_DESCRIPTION="Permite iniciar sessão no seu site utilizando o serviço de Início de Sessão Único (SSO) fornecido por dispositivos Auth0 NAS e instâncias de máquinas virtuais Auth0 DSM."

PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_LABEL="URL de Domínio"
PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_DESC="Pode encontrar isto no Domínio da sua Aplicação Auth0. Adicione 'https://'."

PLG_SOCIALLOGIN_AUTH0_LOGIN_LABEL="Iniciar sessão com Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LOGIN_DESC="Inicie sessão com a sua conta de Início de Sessão Único Auth0. Será criada uma nova conta se não existir nenhuma conta correspondente no nosso site."

PLG_SOCIALLOGIN_AUTH0_LINK_LABEL="Vincular Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LINK_DESC="Vincula o seu utilizador neste site ao Auth0 SSO. Poderá então iniciar sessão neste site utilizando Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_UNLINK_LABEL="Desvincular Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_UNLINK_DESC="Desvincula a sua conta de utilizador neste site da sua conta Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_LABEL="Application ID"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_DESC="Introduza o Application ID. Pode criar uma nova aplicação e obter esta informação iniciando sessão no Auth0 DSM e acedendo a SSO Server, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_LABEL="Application Secret"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_DESC="Introduza o Application Secret. Pode criar uma nova aplicação e obter esta informação iniciando sessão no Auth0 DSM e acedendo a SSO Server, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_LABEL="Permitir início de sessão social em contas não vinculadas"
PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_DESC="Quando ativado, permite que os utilizadores iniciem sessão sem terem vinculado a sua conta Auth0 SSO à sua conta de utilizador no site. O endereço de correio eletrónico da conta Auth0 SSO deve ser o mesmo que utilizam no seu site."

PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_LABEL="Criar novas contas de utilizador"
PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_DESC="Cria um novo utilizador no Joomla! quando um utilizador tenta iniciar sessão via Auth0 SSO mas não existe nenhuma conta de utilizador do Joomla! associada a esse endereço de correio eletrónico ou nome de utilizador Auth0 SSO. Se o registo de utilizadores estiver desativado, nenhuma conta será criada e será gerado um erro. O novo utilizador do Joomla! terá o mesmo nome de utilizador que a conta Auth0 SSO, o mesmo endereço de correio eletrónico que a conta Auth0 SSO, um nome no formato \"Auth0 SSO User some_username\", e uma palavra-passe longa e aleatória (que o utilizador pode alterar após iniciar sessão). Defina como Não para impedir a criação de contas de utilizador através do início de sessão Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_LABEL="Ignorar definição do Joomla! para criação de contas de utilizador"
PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_DESC="Quando esta opção e a opção 'Criar novas contas de utilizador' acima estiverem ativadas, será sempre criado um novo utilizador, mesmo que tenha desativado o registo de utilizadores nas opções da página de Utilizadores do Joomla!. Isto é útil para impedir que qualquer pessoa se registe no seu site <em>exceto</em> se tiver uma conta Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_LABEL="Ignorar validação de utilizador para utilizadores Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_DESC="Aplica-se apenas ao criar novas contas de utilizador. Quando esta opção está ativada, o novo utilizador do Joomla! será criado como ativo, sem passar pelo processo de validação de conta de utilizador do Joomla!. Isto significa que não será enviado nenhum e-mail de ativação de conta ao utilizador ou aos administradores do site Joomla!. Isto é seguro porque as contas Auth0 SSO são validadas manualmente pelos administradores da instância Auth0 DSM que está a utilizar."

PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_LABEL="Estilo dos botões"
PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_DESC="Quando ativado, o CSS personalizado para o estilo dos botões de início de sessão, vinculação e desvinculação será incluído no cabeçalho da página. Desative esta opção se pretender utilizar o seu próprio CSS para estilizar os botões."

PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_LABEL="Cor de primeiro plano do botão"
PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_DESC="A cor de primeiro plano (texto) para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_LABEL="Cor de fundo do botão"
PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_DESC="A cor de fundo para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_AUTH0_ERROR_NOT_LOGGED_IN_FB="Não tem sessão iniciada na sua conta Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="A sua conta neste site está desativada ou não foi ativada."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_NOT_FOUND="Não tem uma conta neste site que corresponda a esta conta Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_USERNAME_CONFLICT="Já existe uma conta neste site com o mesmo nome de utilizador ou endereço de correio eletrónico que o seu Auth0 SSO. Por favor inicie sessão na sua conta neste site e depois vincule a sua conta Auth0 SSO. Se não se lembrar de ter uma conta de utilizador, por favor crie uma nova primeiro."
PLG_SOCIALLOGIN_AUTH0_ERROR_CANNOT_CREATE="Não foi possível criar um novo utilizador no nosso site: %s"

PLG_SOCIALLOGIN_AUTH0_NOTICE_USERACTIVATE="O seu endereço de correio eletrónico precisa de ser verificado antes de iniciar sessão neste site. Foi-lhe enviado um e-mail com instruções. Após seguir essas instruções, volte aqui e tente novamente iniciar sessão neste site utilizando Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_NOTICE_ADMINACTIVATE="A sua conta precisa de ser revista por um administrador. Quando o processo de revisão estiver concluído, receberá um e-mail de confirmação. Após receber esse e-mail, volte aqui e tente novamente iniciar sessão neste site utilizando Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_LABEL="Os botões de início de sessão podem ser mostrados em"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_DESC="Em que parte(s) do seu site pretende permitir a apresentação dos botões de Início de Sessão Social? <br/> <strong>ATENÇÃO!</strong> Se o único método de início de sessão de um utilizador for o SocialLogin, escolher qualquer opção que não seja Ambos resultará no bloqueio efetivo do acesso à outra parte do seu site."
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
