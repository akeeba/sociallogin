PLG_SOCIALLOGIN_AUTH0="Akeeba Social Login - integración con Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_DESCRIPTION="Permite iniciar sesión en su sitio usando el servicio de inicio de sesión único (SSO) proporcionado por dispositivos Auth0 NAS e instancias de máquina virtual Auth0 DSM."

PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_LABEL="URL de dominio"
PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_DESC="Puede encontrar esto en el dominio de su aplicación Auth0. Añada «https://»."

PLG_SOCIALLOGIN_AUTH0_LOGIN_LABEL="Iniciar sesión con Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LOGIN_DESC="Inicie sesión con su cuenta de inicio de sesión único Auth0. Se creará una nueva cuenta si no existe ninguna cuenta coincidente en nuestro sitio."

PLG_SOCIALLOGIN_AUTH0_LINK_LABEL="Vincular Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LINK_DESC="Vincula su usuario en este sitio con Auth0 SSO. Luego podrá iniciar sesión en este sitio usando Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_UNLINK_LABEL="Desvincular Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_UNLINK_DESC="Desvincula su cuenta de usuario en este sitio de su cuenta Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_LABEL="Application ID"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_DESC="Introduzca el Application ID. Puede crear una nueva aplicación y obtener esta información iniciando sesión en Auth0 DSM y accediendo a SSO Server, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_LABEL="Application Secret"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_DESC="Introduzca el Application Secret. Puede crear una nueva aplicación y obtener esta información iniciando sesión en Auth0 DSM y accediendo a SSO Server, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_LABEL="Permitir el inicio de sesión social en cuentas no vinculadas"
PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_DESC="Cuando está habilitado, permite a los usuarios iniciar sesión aunque no hayan vinculado su cuenta Auth0 SSO a su cuenta de usuario del sitio. La dirección de correo electrónico de su cuenta Auth0 SSO debe ser la misma que la cuenta de correo que usan en su sitio."

PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_LABEL="Crear nuevas cuentas de usuario"
PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_DESC="Crea un nuevo usuario de Joomla! cuando un usuario intenta iniciar sesión a través de Auth0 SSO pero no existe ninguna cuenta de usuario de Joomla! asociada con ese correo electrónico o nombre de usuario de Auth0 SSO. Si el registro de usuarios está deshabilitado, no se creará ninguna cuenta y se mostrará un error. El nuevo usuario de Joomla! tendrá el mismo nombre de usuario que la cuenta Auth0 SSO, la misma dirección de correo electrónico que la cuenta Auth0 SSO, un nombre con el formato «Auth0 SSO User some_username» y una contraseña larga y aleatoria (que el usuario puede cambiar una vez que haya iniciado sesión). Establezca esto en No para evitar la creación de cuentas de usuario a través del inicio de sesión de Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_LABEL="Ignorar la configuración de Joomla! para crear cuentas de usuario"
PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_DESC="Cuando tanto esta opción como la opción «Crear nuevas cuentas de usuario» anterior están habilitadas, siempre se creará un nuevo usuario, incluso si ha deshabilitado el registro de usuarios en las opciones de la página Usuarios de Joomla. Esto es útil para evitar que alguien se registre en su sitio <em>a menos que</em> tenga una cuenta Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_LABEL="Omitir la validación de usuario para usuarios de Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_DESC="Solo se aplica al crear nuevas cuentas de usuario. Cuando esta opción está habilitada, el nuevo usuario de Joomla! se creará activo, sin pasar por la validación de cuenta de usuario de Joomla!. Esto significa que no se enviará ningún correo electrónico de activación de cuenta al usuario ni a los administradores del sitio Joomla!. Esto es seguro porque las cuentas Auth0 SSO son validadas manualmente por los administradores de la instancia Auth0 DSM que está utilizando."

PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_LABEL="Estilo del botón"
PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_DESC="Cuando está habilitado, se generará CSS personalizado para el estilo de los botones de inicio de sesión, vinculación y desvinculación en el encabezado de la página. Deshabilite esta opción si pretende usar su propio CSS para dar estilo a los botones."

PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_LABEL="Color de primer plano del botón"
PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_DESC="El color de primer plano (texto) para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_LABEL="Color de fondo del botón"
PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_DESC="El color de fondo para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_AUTH0_ERROR_NOT_LOGGED_IN_FB="No ha iniciado sesión en su cuenta Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Su cuenta en este sitio está deshabilitada o no está activada."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_NOT_FOUND="No tiene una cuenta en este sitio que corresponda a esta cuenta Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_USERNAME_CONFLICT="Ya existe una cuenta en este sitio con el mismo nombre de usuario o dirección de correo electrónico que su Auth0 SSO. Por favor, inicie sesión en su cuenta en este sitio y luego vincule su cuenta Auth0 SSO. Si no recuerda tener una cuenta de usuario, cree primero una nueva."
PLG_SOCIALLOGIN_AUTH0_ERROR_CANNOT_CREATE="No se pudo crear un nuevo usuario en nuestro sitio: %s"

PLG_SOCIALLOGIN_AUTH0_NOTICE_USERACTIVATE="Su dirección de correo electrónico debe verificarse antes de iniciar sesión en este sitio. Se le ha enviado un correo electrónico con instrucciones. Tras seguir estas instrucciones, vuelva aquí e intente iniciar sesión en este sitio usando Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_NOTICE_ADMINACTIVATE="Un administrador debe revisar su cuenta. Cuando el proceso de revisión se complete, recibirá un correo electrónico de confirmación. Tras recibir ese correo electrónico, vuelva aquí e intente iniciar sesión en este sitio usando Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_LABEL="Los botones de inicio de sesión se pueden mostrar en"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_DESC="¿En qué parte(s) de su sitio desea permitir mostrar los botones de Social Login? <br/> <strong>¡PELIGRO!</strong> Si el único método de inicio de sesión de un usuario es SocialLogin, elegir cualquier opción que no sea Ambos resultará en que quede efectivamente bloqueado de la otra parte de su sitio."
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
