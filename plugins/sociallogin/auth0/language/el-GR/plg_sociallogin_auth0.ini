PLG_SOCIALLOGIN_AUTH0="Akeeba Social Login - Ενσωμάτωση Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_DESCRIPTION="Επιτρέπει τη σύνδεση στον ιστότοπό σας χρησιμοποιώντας την υπηρεσία Single Sign-On (SSO) που παρέχεται από συσκευές Auth0 NAS και εικονικές μηχανές Auth0 DSM."

PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_LABEL="URL Domain"
PLG_SOCIALLOGIN_AUTH0_FIELD_DOMAINN_DESC="Μπορείτε να το βρείτε στο Domain της Εφαρμογής Auth0. Προσθέστε 'https://'."

PLG_SOCIALLOGIN_AUTH0_LOGIN_LABEL="Σύνδεση με Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LOGIN_DESC="Συνδεθείτε με τον λογαριασμό Single Sign-On του Auth0 σας. Θα δημιουργηθεί νέος λογαριασμός εάν δεν υπάρχει αντίστοιχος λογαριασμός στον ιστότοπό μας."

PLG_SOCIALLOGIN_AUTH0_LINK_LABEL="Σύνδεση Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_LINK_DESC="Συνδέει τον χρήστη σας σε αυτόν τον ιστότοπο με το Auth0 SSO. Μπορείτε έπειτα να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_UNLINK_LABEL="Αποσύνδεση Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_UNLINK_DESC="Αποσυνδέει τον λογαριασμό χρήστη σας σε αυτόν τον ιστότοπο από τον λογαριασμό σας Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_LABEL="Application ID"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPID_DESC="Εισαγάγετε το Application ID. Μπορείτε να δημιουργήσετε νέα εφαρμογή και να λάβετε αυτές τις πληροφορίες συνδεόμενοι στο Auth0 DSM και μεταβαίνοντας στο SSO Server, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_LABEL="Application Secret"
PLG_SOCIALLOGIN_AUTH0_FIELD_APPSECRET_DESC="Εισαγάγετε το Application Secret. Μπορείτε να δημιουργήσετε νέα εφαρμογή και να λάβετε αυτές τις πληροφορίες συνδεόμενοι στο Auth0 DSM και μεταβαίνοντας στο SSO Server, Application."

PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_LABEL="Να επιτρέπεται κοινωνική σύνδεση σε μη συνδεδεμένους λογαριασμούς"
PLG_SOCIALLOGIN_AUTH0_FIELD_LOGINUNLINKED_DESC="Όταν είναι ενεργοποιημένο, επιτρέπει στους χρήστες να συνδέονται παρά το γεγονός ότι δεν έχουν συνδέσει τον λογαριασμό τους Auth0 SSO με τον λογαριασμό χρήστη τους στον ιστότοπο. Η διεύθυνση email του λογαριασμού Auth0 SSO πρέπει να είναι ίδια με τη διεύθυνση email που χρησιμοποιούν στον ιστότοπό σας."

PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_LABEL="Δημιουργία νέων λογαριασμών χρηστών"
PLG_SOCIALLOGIN_AUTH0_FIELD_CREATENEW_DESC="Δημιουργεί νέο χρήστη Joomla! όταν κάποιος χρήστης προσπαθεί να συνδεθεί μέσω Auth0 SSO αλλά δεν υπάρχει λογαριασμός χρήστη Joomla! που να σχετίζεται με αυτό το email ή όνομα χρήστη Auth0 SSO. Εάν η εγγραφή χρηστών είναι απενεργοποιημένη, δεν θα δημιουργηθεί λογαριασμός και θα εμφανιστεί σφάλμα. Ο νέος χρήστης Joomla! θα έχει το ίδιο όνομα χρήστη με τον λογαριασμό Auth0 SSO, την ίδια διεύθυνση email με τον λογαριασμό Auth0 SSO, ένα όνομα με τη μορφή «Auth0 SSO User some_username» και έναν μακρύ, τυχαίο κωδικό πρόσβασης (τον οποίο ο χρήστης μπορεί να αλλάξει μόλις συνδεθεί). Ορίστε αυτό σε Όχι για να αποτρέψετε τη δημιουργία λογαριασμών χρηστών μέσω σύνδεσης Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_LABEL="Παράβλεψη ρύθμισης Joomla! για δημιουργία λογαριασμών χρηστών"
PLG_SOCIALLOGIN_AUTH0_FIELD_FORCENEW_DESC="Όταν τόσο αυτή η επιλογή όσο και η επιλογή «Δημιουργία νέων λογαριασμών χρηστών» παραπάνω είναι ενεργοποιημένες, θα δημιουργείται πάντα νέος χρήστης, ακόμη και αν έχετε απενεργοποιήσει την εγγραφή χρηστών στις επιλογές της σελίδας Χρηστών του Joomla. Αυτό είναι χρήσιμο για να αποτρέψετε οποιονδήποτε από το να εγγραφεί στον ιστότοπό σας <em>εκτός εάν</em> έχει λογαριασμό Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_LABEL="Παράκαμψη επικύρωσης χρήστη για χρήστες Auth0 SSO"
PLG_SOCIALLOGIN_AUTH0_FIELD_BYPASSVALIDATION_DESC="Ισχύει μόνο κατά τη δημιουργία νέων λογαριασμών χρηστών. Όταν αυτή η επιλογή είναι ενεργοποιημένη, ο νέος χρήστης Joomla! θα δημιουργείται ενεργός, χωρίς να περνά από την επικύρωση λογαριασμού χρήστη του Joomla!. Αυτό σημαίνει ότι δεν θα αποστέλλεται email ενεργοποίησης λογαριασμού στον χρήστη ή στους διαχειριστές του ιστότοπου Joomla!. Αυτό είναι ασφαλές επειδή οι λογαριασμοί Auth0 SSO επικυρώνονται χειροκίνητα από τους διαχειριστές της παρουσίας Auth0 DSM που χρησιμοποιείτε."

PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_LABEL="Στυλιζάρισμα κουμπιών"
PLG_SOCIALLOGIN_AUTH0_FIELD_CUSTOMCSS_DESC="Όταν είναι ενεργοποιημένο, προσαρμοσμένο CSS για το στυλιζάρισμα κουμπιών σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης θα εξάγεται στην κεφαλίδα της σελίδας. Απενεργοποιήστε αυτή την επιλογή εάν σκοπεύετε να χρησιμοποιήσετε το δικό σας CSS για τα κουμπιά."

PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_LABEL="Χρώμα προσκηνίου κουμπιού"
PLG_SOCIALLOGIN_AUTH0_FIELD_FGCOLOR_DESC="Το χρώμα προσκηνίου (κειμένου) για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_LABEL="Χρώμα φόντου κουμπιού"
PLG_SOCIALLOGIN_AUTH0_FIELD_BGCOLOR_DESC="Το χρώμα φόντου για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_AUTH0_ERROR_NOT_LOGGED_IN_FB="Δεν είστε συνδεδεμένοι στον λογαριασμό σας Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ο λογαριασμός σας σε αυτόν τον ιστότοπο είναι απενεργοποιημένος ή δεν έχει ενεργοποιηθεί."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_NOT_FOUND="Δεν έχετε λογαριασμό σε αυτόν τον ιστότοπο που να αντιστοιχεί σε αυτόν τον λογαριασμό Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_ERROR_LOCAL_USERNAME_CONFLICT="Υπάρχει ήδη λογαριασμός με το ίδιο όνομα χρήστη ή διεύθυνση email με τον λογαριασμό σας Auth0 SSO σε αυτόν τον ιστότοπο. Παρακαλώ συνδεθείτε στον λογαριασμό σας σε αυτόν τον ιστότοπο και στη συνέχεια συνδέστε τον λογαριασμό σας Auth0 SSO με αυτόν. Εάν δεν θυμάστε να έχετε λογαριασμό χρήστη, παρακαλώ δημιουργήστε πρώτα έναν νέο."
PLG_SOCIALLOGIN_AUTH0_ERROR_CANNOT_CREATE="Δεν ήταν δυνατή η δημιουργία νέου χρήστη στον ιστότοπό μας: %s"

PLG_SOCIALLOGIN_AUTH0_NOTICE_USERACTIVATE="Η διεύθυνση email σας πρέπει να επαληθευτεί πριν από τη σύνδεση σε αυτόν τον ιστότοπο. Σας έχει αποσταλεί email με οδηγίες. Αφού ακολουθήσετε αυτές τις οδηγίες, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Auth0 SSO."
PLG_SOCIALLOGIN_AUTH0_NOTICE_ADMINACTIVATE="Ο λογαριασμός σας πρέπει να ελεγχθεί από έναν διαχειριστή. Όταν ολοκληρωθεί η διαδικασία ελέγχου, θα λάβετε email επιβεβαίωσης. Αφού λάβετε αυτό το email, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Auth0 SSO."

PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_LABEL="Τα κουμπιά σύνδεσης μπορούν να εμφανιστούν σε"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_DESC="Σε ποιο τμήμα (τμήματα) του ιστότοπού σας θέλετε να επιτρέπεται η εμφάνιση των κουμπιών κοινωνικής σύνδεσης; <br/> <strong>ΚΙΝΔΥΝΟΣ!</strong> Εάν η μόνη μέθοδος σύνδεσης ενός χρήστη είναι το SocialLogin, η επιλογή οποιασδήποτε επιλογής εκτός από Και τα δύο θα έχει ως αποτέλεσμα να αποκλειστεί ουσιαστικά από το άλλο τμήμα του ιστότοπού σας."
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_SITE="Εμπρόσθιο τμήμα"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_ADMIN="Διαχειριστικό τμήμα"
PLG_SOCIALLOGIN_AUTH0_FIELD_ENABLEDAPPLICATIONS_BOTH="Και τα δύο"
