PLG_SOCIALLOGIN_APPLE_LOGIN_LABEL="Σύνδεση με Apple"
PLG_SOCIALLOGIN_APPLE_LOGIN_DESC="Συνδεθείτε με το Apple ID σας. Θα δημιουργηθεί νέος λογαριασμός εάν δεν υπάρχει αντίστοιχος λογαριασμός στον ιστότοπό μας."

PLG_SOCIALLOGIN_APPLE_LINK_LABEL="Σύνδεση Apple"
PLG_SOCIALLOGIN_APPLE_LINK_DESC="Συνδέει τον χρήστη σας σε αυτόν τον ιστότοπο με το Apple ID σας. Μπορείτε έπειτα να χρησιμοποιείτε το Apple ID σας για να συνδέεστε σε αυτόν τον ιστότοπο."

PLG_SOCIALLOGIN_APPLE_UNLINK_LABEL="Αποσύνδεση Apple"
PLG_SOCIALLOGIN_APPLE_UNLINK_DESC="Αποσυνδέει τον χρήστη σας σε αυτόν τον ιστότοπο από το Apple ID σας."

PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_LABEL="Client ID (Services ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_DESC="Εισαγάγετε το Services ID που δημιουργήσατε στον λογαριασμό Apple Developer σας."

PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_LABEL="Team ID"
PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_DESC="Εισαγάγετε το Team ID για τον λογαριασμό Apple Developer σας."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_LABEL="Key ID"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_DESC="Εισαγάγετε το Key ID που δημιουργήσατε για το Services ID που εισαγάγατε παρακάτω στον λογαριασμό Apple Developer σας."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_LABEL="Μυστικό Κλειδί"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_DESC="Εισαγάγετε τα περιεχόμενα του αρχείου Μυστικού Κλειδιού που αντιστοιχεί στο Key ID παραπάνω. Όταν δημιουργήσατε ένα Μυστικό Κλειδί στον ιστότοπο Apple Developer, κατεβάσατε ένα αρχείο με όνομα παρόμοιο με <code>AuthKey_ABCDEF01234.p8</code>. Αυτό είναι αρχείο κειμένου. Ανοίξτε το με ένα πρόγραμμα επεξεργασίας κειμένου όπως το TextEdit, αντιγράψτε τα περιεχόμενά του και επικολλήστε τα εδώ."

PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_LABEL="Να επιτρέπεται κοινωνική σύνδεση σε μη συνδεδεμένους λογαριασμούς"
PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_DESC="Όταν είναι ενεργοποιημένο, επιτρέπει στους χρήστες να συνδέονται παρά το γεγονός ότι δεν έχουν συνδέσει το Apple ID τους με τον λογαριασμό χρήστη τους στον ιστότοπο. Πρέπει να επιλέξουν να κοινοποιήσουν την πραγματική διεύθυνση email τους κατά τη σύνδεση με Apple και η διεύθυνση email του λογαριασμού τους πρέπει να είναι ίδια με τη διεύθυνση email που κοινοποίησαν στον ιστότοπό σας κατά τη σύνδεση με Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_LABEL="Δημιουργία νέων λογαριασμών χρηστών"
PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_DESC="Δημιουργεί νέο χρήστη Joomla! όταν κάποιος χρήστης προσπαθεί να συνδεθεί μέσω Apple ID αλλά δεν υπάρχει λογαριασμός χρήστη Joomla! που να σχετίζεται με αυτό το Apple ID. Εάν η εγγραφή χρηστών είναι απενεργοποιημένη, δεν θα δημιουργηθεί λογαριασμός και θα εμφανιστεί σφάλμα. Ο νέος χρήστης Joomla! θα έχει τυχαίο όνομα χρήστη, την ίδια διεύθυνση email με αυτή που επέστρεψε το Apple (μπορεί να είναι διεύθυνση proxy) και έναν μακρύ, τυχαίο κωδικό πρόσβασης (τον οποίο ο χρήστης μπορεί να αλλάξει μόλις συνδεθεί). Ορίστε αυτό σε Όχι για να αποτρέψετε τη δημιουργία λογαριασμών χρηστών μέσω σύνδεσης Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_LABEL="Παράβλεψη ρύθμισης Joomla! για δημιουργία λογαριασμών χρηστών"
PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_DESC="Όταν τόσο αυτή η επιλογή όσο και η επιλογή «Δημιουργία νέων λογαριασμών χρηστών» παραπάνω είναι ενεργοποιημένες, θα δημιουργείται πάντα νέος χρήστης, ακόμη και αν έχετε απενεργοποιήσει την εγγραφή χρηστών στις επιλογές της σελίδας Χρηστών του Joomla. Αυτό είναι χρήσιμο για να αποτρέψετε οποιονδήποτε από το να εγγραφεί στον ιστότοπό σας <em>εκτός εάν</em> έχει λογαριασμό Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_LABEL="Παράκαμψη επικύρωσης χρήστη για χρήστες Apple"
PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_DESC="Ισχύει μόνο κατά τη δημιουργία νέων λογαριασμών χρηστών. Εάν το Apple δηλώσει ότι ο χρήστης που προσπαθεί να συνδεθεί είναι πιθανότατα πραγματικός άνθρωπος (βάσει των δικών τους, αδιαφανών ευρετικών κανόνων), ο νέος χρήστης θα δημιουργηθεί ενεργός, χωρίς να περνά από την επικύρωση λογαριασμού χρήστη του Joomla!. Αυτό σημαίνει ότι δεν θα αποστέλλεται email ενεργοποίησης λογαριασμού στον χρήστη ή στους διαχειριστές του ιστότοπου Joomla!."

PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_LABEL="Στυλιζάρισμα κουμπιών"
PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_DESC="Όταν είναι ενεργοποιημένο, προσαρμοσμένο CSS για το στυλιζάρισμα κουμπιών σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης θα εξάγεται στην κεφαλίδα της σελίδας. Απενεργοποιήστε αυτή την επιλογή εάν σκοπεύετε να χρησιμοποιήσετε το δικό σας CSS για τα κουμπιά."

PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_LABEL="Χρώμα προσκηνίου κουμπιού"
PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_DESC="Το χρώμα προσκηνίου (κειμένου) για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_LABEL="Χρώμα φόντου κουμπιού"
PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_DESC="Το χρώμα φόντου για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#000000</code>"

PLG_SOCIALLOGIN_APPLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ο λογαριασμός σας σε αυτόν τον ιστότοπο είναι απενεργοποιημένος ή δεν έχει ενεργοποιηθεί."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_NOT_FOUND="Δεν έχετε λογαριασμό σε αυτόν τον ιστότοπο που να αντιστοιχεί σε αυτό το Apple ID."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_USERNAME_CONFLICT="Υπάρχει ήδη λογαριασμός με το ίδιο όνομα χρήστη ή διεύθυνση email με τον λογαριασμό Apple ID σας σε αυτόν τον ιστότοπο. Παρακαλώ συνδεθείτε στον λογαριασμό σας σε αυτόν τον ιστότοπο και στη συνέχεια συνδέστε το Apple ID σας με αυτόν. Εάν δεν θυμάστε να έχετε λογαριασμό χρήστη, παρακαλώ δημιουργήστε πρώτα έναν νέο."
PLG_SOCIALLOGIN_APPLE_ERROR_CANNOT_CREATE="Δεν ήταν δυνατή η δημιουργία νέου χρήστη στον ιστότοπό μας: %s"

PLG_SOCIALLOGIN_APPLE_NOTICE_USERACTIVATE="Η διεύθυνση email σας πρέπει να επαληθευτεί πριν από τη σύνδεση σε αυτόν τον ιστότοπο. Σας έχει αποσταλεί email με οδηγίες. Αφού ακολουθήσετε αυτές τις οδηγίες, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Apple."
PLG_SOCIALLOGIN_APPLE_NOTICE_ADMINACTIVATE="Ο λογαριασμός σας πρέπει να ελεγχθεί από έναν διαχειριστή. Όταν ολοκληρωθεί η διαδικασία ελέγχου, θα λάβετε email επιβεβαίωσης. Αφού λάβετε αυτό το email, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_LABEL="Τα κουμπιά σύνδεσης μπορούν να εμφανιστούν σε"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_DESC="Σε ποιο τμήμα (τμήματα) του ιστότοπού σας θέλετε να επιτρέπεται η εμφάνιση των κουμπιών κοινωνικής σύνδεσης; <br/> <strong>ΚΙΝΔΥΝΟΣ!</strong> Εάν η μόνη μέθοδος σύνδεσης ενός χρήστη είναι το SocialLogin, η επιλογή οποιασδήποτε επιλογής εκτός από Και τα δύο θα έχει ως αποτέλεσμα να αποκλειστεί ουσιαστικά από το άλλο τμήμα του ιστότοπού σας."
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_SITE="Εμπρόσθιο τμήμα"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Διαχειριστικό τμήμα"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Και τα δύο"
