PLG_SOCIALLOGIN_APPLE_LOGIN_LABEL="Mit Apple anmelden"
PLG_SOCIALLOGIN_APPLE_LOGIN_DESC="Melden Sie sich mit Ihrer Apple-ID an. Ein neues Konto wird erstellt, wenn kein übereinstimmendes Konto auf unserer Website vorhanden ist."

PLG_SOCIALLOGIN_APPLE_LINK_LABEL="Apple verknüpfen"
PLG_SOCIALLOGIN_APPLE_LINK_DESC="Verknüpft Ihren Benutzer auf dieser Website mit Ihrer Apple-ID. Sie können sich dann mit Ihrer Apple-ID auf dieser Website anmelden."

PLG_SOCIALLOGIN_APPLE_UNLINK_LABEL="Apple-Verknüpfung aufheben"
PLG_SOCIALLOGIN_APPLE_UNLINK_DESC="Hebt die Verknüpfung Ihres Benutzers auf dieser Website mit Ihrer Apple-ID auf."

PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_LABEL="Client ID (Services ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_DESC="Geben Sie die Services ID ein, die Sie in Ihrem Apple Developer-Konto erstellt haben."

PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_LABEL="Team ID"
PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_DESC="Geben Sie die Team ID für Ihr Apple Developer-Konto ein."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_LABEL="Key ID"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_DESC="Geben Sie die Key ID ein, die Sie für die unten eingegebene Services ID in Ihrem Apple Developer-Konto erstellt haben."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_LABEL="Geheimer Schlüssel"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_DESC="Geben Sie den Inhalt der Datei mit dem geheimen Schlüssel ein, der der obigen Key ID entspricht. Als Sie einen geheimen Schlüssel auf der Apple Developer-Konto-Website erstellt haben, haben Sie eine Datei mit einem ähnlichen Namen wie <code>AuthKey_ABCDEF01234.p8</code> heruntergeladen. Dies ist eine Textdatei. Öffnen Sie sie mit einem Texteditor wie TextEdit, kopieren Sie den Inhalt und fügen Sie ihn hier ein."

PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_LABEL="Social-Login für nicht verknüpfte Konten erlauben"
PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_DESC="Wenn aktiviert, können sich Benutzer anmelden, auch wenn ihre Apple-ID nicht mit ihrem Website-Benutzerkonto verknüpft ist. Sie müssen beim Anmelden mit Apple wählen, ihre echte E-Mail-Adresse zu teilen, und die E-Mail-Adresse des Kontos muss mit der E-Mail-Adresse übereinstimmen, die sie Ihrer Website beim Anmelden mit Apple mitgeteilt haben."

PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_LABEL="Neue Benutzerkonten erstellen"
PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_DESC="Erstellt einen neuen Joomla!-Benutzer, wenn sich ein Benutzer über eine Apple-ID anmelden möchte, aber kein Joomla!-Benutzerkonto mit dieser Apple-ID verknüpft ist. Wenn die Benutzerregistrierung deaktiviert ist, wird kein Konto erstellt und ein Fehler ausgegeben. Der neue Joomla!-Benutzer erhält einen zufälligen Benutzernamen, dieselbe E-Mail-Adresse wie die von Apple zurückgegebene (möglicherweise eine Proxy-E-Mail-Adresse) und ein langes, zufälliges Passwort (das der Benutzer nach der Anmeldung ändern kann). Setzen Sie dies auf Nein, um die Erstellung von Benutzerkonten über die Apple-Anmeldung zu verhindern."

PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_LABEL="Joomla!-Einstellung zur Benutzerkontenerstellung ignorieren"
PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_DESC="Wenn sowohl diese Option als auch die obige Option „Neue Benutzerkonten erstellen" aktiviert sind, wird immer ein neuer Benutzer erstellt, auch wenn Sie die Benutzerregistrierung in den Optionen der Joomla!-Benutzerseite deaktiviert haben. Dies ist nützlich, um zu verhindern, dass sich jemand auf Ihrer Website registriert, <em>es sei denn</em>, er hat ein Apple-Konto."

PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_LABEL="Benutzervalidierung für Apple-Benutzer überspringen"
PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_DESC="Gilt nur beim Erstellen neuer Benutzerkonten. Wenn Apple bestätigt, dass der anmeldende Benutzer höchstwahrscheinlich ein echter Mensch ist (basierend auf ihren eigenen, internen Heuristiken), wird der neue Benutzer ohne die Joomla!-Benutzerkonto-Validierung aktiv erstellt. Das bedeutet, dass keine Konto-Aktivierungs-E-Mail an den Benutzer oder die Administratoren der Joomla!-Website gesendet wird."

PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_LABEL="Schaltflächenstil"
PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_DESC="Wenn aktiviert, wird benutzerdefiniertes CSS für die Gestaltung der Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen in den Seitenkopf ausgegeben. Deaktivieren Sie diese Option, wenn Sie Ihr eigenes CSS zur Gestaltung der Schaltflächen verwenden möchten."

PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_LABEL="Vordergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_DESC="Die Vordergrundfarbe (Text) für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_LABEL="Hintergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_DESC="Die Hintergrundfarbe für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#000000</code>"

PLG_SOCIALLOGIN_APPLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ihr Konto auf dieser Website ist deaktiviert oder noch nicht aktiviert."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_NOT_FOUND="Sie haben kein Konto auf dieser Website, das dieser Apple-ID entspricht."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_USERNAME_CONFLICT="Auf dieser Website existiert bereits ein Konto mit demselben Benutzernamen oder derselben E-Mail-Adresse wie Ihr Apple-ID-Konto. Bitte melden Sie sich bei Ihrem Konto auf dieser Website an und verknüpfen Sie dann Ihre Apple-ID damit. Wenn Sie sich nicht erinnern, bereits ein Benutzerkonto zu haben, erstellen Sie bitte zuerst ein neues."
PLG_SOCIALLOGIN_APPLE_ERROR_CANNOT_CREATE="Es konnte kein neuer Benutzer auf unserer Website erstellt werden: %s"

PLG_SOCIALLOGIN_APPLE_NOTICE_USERACTIVATE="Ihre E-Mail-Adresse muss verifiziert werden, bevor Sie sich auf dieser Website anmelden können. Eine E-Mail mit Anweisungen wurde an Sie gesendet. Nachdem Sie diesen Anweisungen gefolgt sind, kehren Sie bitte hierher zurück und versuchen Sie erneut, sich mit Apple auf dieser Website anzumelden."
PLG_SOCIALLOGIN_APPLE_NOTICE_ADMINACTIVATE="Ihr Konto muss von einem Administrator überprüft werden. Wenn der Überprüfungsprozess abgeschlossen ist, erhalten Sie eine Bestätigungs-E-Mail. Kehren Sie nach Erhalt dieser E-Mail hierher zurück und versuchen Sie erneut, sich mit Apple auf dieser Website anzumelden."

PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_LABEL="Anmelde-Schaltflächen können angezeigt werden in"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_DESC="In welchem Teil/welchen Teilen Ihrer Website möchten Sie das Anzeigen der Social-Login-Schaltflächen erlauben? <br/> <strong>ACHTUNG!</strong> Wenn die einzige Anmeldemethode eines Benutzers SocialLogin ist, führt die Auswahl einer anderen Option als „Beide" dazu, dass der Benutzer im anderen Teil Ihrer Website praktisch ausgesperrt ist."
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Beide"
