PLG_SOCIALLOGIN_APPLE_LOGIN_LABEL="Accedi con Apple"
PLG_SOCIALLOGIN_APPLE_LOGIN_DESC="Accedi con il tuo Apple ID. Se non esiste un account corrispondente sul nostro sito, ne verrà creato uno nuovo."

PLG_SOCIALLOGIN_APPLE_LINK_LABEL="Collega Apple"
PLG_SOCIALLOGIN_APPLE_LINK_DESC="Collega il tuo utente su questo sito al tuo Apple ID. Potrai quindi usare il tuo Apple ID per accedere a questo sito."

PLG_SOCIALLOGIN_APPLE_UNLINK_LABEL="Scollega Apple"
PLG_SOCIALLOGIN_APPLE_UNLINK_DESC="Scollega il tuo utente su questo sito dal tuo Apple ID."

PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_LABEL="Client ID (Services ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_DESC="Inserisci il Services ID che hai creato nel tuo account Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_LABEL="Team ID"
PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_DESC="Inserisci il Team ID del tuo account Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_LABEL="Key ID"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_DESC="Inserisci il Key ID che hai creato per il Services ID indicato di seguito nel tuo account Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_LABEL="Chiave segreta"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_DESC="Inserisci il contenuto del file della chiave segreta corrispondente al Key ID indicato sopra. Quando hai creato una chiave segreta sul sito Apple Developer, hai scaricato un file con un nome simile a <code>AuthKey_ABCDEF01234.p8</code>. Si tratta di un file di testo. Aprilo con un editor di testo come TextEdit, copia il suo contenuto e incollalo qui."

PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_LABEL="Consenti accesso social ad account non collegati"
PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_DESC="Se abilitato, consente agli utenti di accedere anche senza aver collegato il proprio Apple ID all'account utente del sito. L'utente deve scegliere di condividere il proprio indirizzo email reale durante l'accesso con Apple e l'indirizzo email dell'account deve essere lo stesso condiviso con il tuo sito durante l'accesso con Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_LABEL="Crea nuovi account utente"
PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_DESC="Crea un nuovo utente Joomla! quando un utente tenta di accedere tramite Apple ID ma non esiste un account utente Joomla! associato a quell'Apple ID. Se la registrazione utenti è disabilitata, non verrà creato nessun account e verrà generato un errore. Il nuovo utente Joomla! avrà un nome utente casuale, lo stesso indirizzo email restituito da Apple (potrebbe essere un indirizzo email proxy) e una password lunga e casuale (che l'utente può modificare dopo aver effettuato l'accesso). Imposta su No per impedire la creazione di account utente tramite l'accesso Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_LABEL="Ignora l'impostazione di Joomla! per la creazione di account utente"
PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_DESC="Quando sia questa opzione che l'opzione 'Crea nuovi account utente' qui sopra sono abilitate, verrà sempre creato un nuovo utente, anche se hai disabilitato la registrazione utenti nelle opzioni della pagina Utenti di Joomla!. Questo è utile per impedire a chiunque di registrarsi al tuo sito <em>a meno che</em> non disponga di un account Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_LABEL="Salta la validazione utente per gli utenti Apple"
PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_DESC="Si applica solo alla creazione di nuovi account utente. Se Apple indica che l'utente che tenta l'accesso è molto probabilmente un essere umano reale (sulla base di propri criteri opachi), il nuovo utente verrà creato come attivo, senza passare per la validazione dell'account utente Joomla!. Ciò significa che non verrà inviata nessuna email di attivazione dell'account all'utente o agli amministratori del sito Joomla!."

PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_LABEL="Stile dei pulsanti"
PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_DESC="Se abilitato, verrà inserito nell'intestazione della pagina il CSS personalizzato per lo stile dei pulsanti di accesso, collegamento e scollegamento. Disabilita questa opzione se intendi usare il tuo CSS per personalizzare i pulsanti."

PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_LABEL="Colore primo piano del pulsante"
PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_DESC="Il colore del primo piano (testo) per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_LABEL="Colore di sfondo del pulsante"
PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_DESC="Il colore di sfondo per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#000000</code>"

PLG_SOCIALLOGIN_APPLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Il tuo account su questo sito è disabilitato o non attivato."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_NOT_FOUND="Non hai un account su questo sito corrispondente a questo Apple ID."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_USERNAME_CONFLICT="Esiste già un account con lo stesso nome utente o indirizzo email del tuo account Apple ID su questo sito. Accedi al tuo account su questo sito e poi collega il tuo Apple ID. Se non ricordi di avere un account utente, creane prima uno nuovo."
PLG_SOCIALLOGIN_APPLE_ERROR_CANNOT_CREATE="Impossibile creare un nuovo utente sul nostro sito: %s"

PLG_SOCIALLOGIN_APPLE_NOTICE_USERACTIVATE="Il tuo indirizzo email deve essere verificato prima di accedere a questo sito. Ti è stata inviata un'email con le istruzioni. Dopo aver seguito queste istruzioni, torna qui e riprova ad accedere a questo sito tramite Apple."
PLG_SOCIALLOGIN_APPLE_NOTICE_ADMINACTIVATE="Il tuo account deve essere esaminato da un amministratore. Al termine del processo di revisione riceverai un'email di conferma. Dopo aver ricevuto quell'email, torna qui e riprova ad accedere a questo sito tramite Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_LABEL="I pulsanti di accesso possono essere visualizzati in"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_DESC="In quale/i parte/i del tuo sito vuoi consentire la visualizzazione dei pulsanti Social Login? <br/> <strong>ATTENZIONE!</strong> Se l'unico metodo di accesso di un utente è SocialLogin, scegliere un'opzione diversa da Entrambi comporterà l'impossibilità di accedere all'altra parte del sito."
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Entrambi"
