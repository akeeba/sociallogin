PLG_SOCIALLOGIN_APPLE_LOGIN_LABEL="Iniciar sessão com Apple"
PLG_SOCIALLOGIN_APPLE_LOGIN_DESC="Inicie sessão com o seu Apple ID. Será criada uma nova conta se não existir nenhuma conta correspondente no nosso site."

PLG_SOCIALLOGIN_APPLE_LINK_LABEL="Vincular Apple"
PLG_SOCIALLOGIN_APPLE_LINK_DESC="Vincula o seu utilizador neste site ao seu Apple ID. Poderá então utilizar o seu Apple ID para iniciar sessão neste site."

PLG_SOCIALLOGIN_APPLE_UNLINK_LABEL="Desvincular Apple"
PLG_SOCIALLOGIN_APPLE_UNLINK_DESC="Desvincula o seu utilizador neste site do seu Apple ID."

PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_LABEL="Client ID (Services ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_DESC="Introduza o Services ID que criou na sua conta Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_LABEL="Team ID"
PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_DESC="Introduza o Team ID da sua conta Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_LABEL="Key ID"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_DESC="Introduza o Key ID que criou para o Services ID indicado abaixo na sua conta Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_LABEL="Chave Secreta"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_DESC="Introduza o conteúdo do ficheiro de Chave Secreta correspondente ao Key ID acima. Quando criou uma Chave Secreta no site da conta Apple Developer, transferiu um ficheiro com um nome semelhante a <code>AuthKey_ABCDEF01234.p8</code>. Este é um ficheiro de texto. Abra-o com um editor de texto como o TextEdit, copie o seu conteúdo e cole-o aqui."

PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_LABEL="Permitir início de sessão social em contas não vinculadas"
PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_DESC="Quando ativado, permite que os utilizadores iniciem sessão sem terem vinculado o seu Apple ID à sua conta de utilizador no site. Devem escolher partilhar o seu endereço de correio eletrónico real ao iniciar sessão com Apple e o endereço de correio eletrónico da conta deve ser o mesmo que partilharam com o seu site ao iniciar sessão com Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_LABEL="Criar novas contas de utilizador"
PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_DESC="Cria um novo utilizador no Joomla! quando um utilizador tenta iniciar sessão via Apple ID mas não existe nenhuma conta de utilizador do Joomla! associada a esse Apple ID. Se o registo de utilizadores estiver desativado, nenhuma conta será criada e será gerado um erro. O novo utilizador do Joomla! terá um nome de utilizador aleatório, o mesmo endereço de correio eletrónico que o devolvido pela Apple (pode ser um endereço de correio eletrónico proxy) e uma palavra-passe longa e aleatória (que o utilizador pode alterar após iniciar sessão). Defina como Não para impedir a criação de contas de utilizador através do início de sessão Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_LABEL="Ignorar definição do Joomla! para criação de contas de utilizador"
PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_DESC="Quando esta opção e a opção 'Criar novas contas de utilizador' acima estiverem ativadas, será sempre criado um novo utilizador, mesmo que tenha desativado o registo de utilizadores nas opções da página de Utilizadores do Joomla!. Isto é útil para impedir que qualquer pessoa se registe no seu site <em>exceto</em> se tiver uma conta Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_LABEL="Ignorar validação de utilizador para utilizadores Apple"
PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_DESC="Aplica-se apenas ao criar novas contas de utilizador. Se a Apple indicar que o utilizador que está a tentar iniciar sessão é muito provavelmente um ser humano real (com base nas suas próprias heurísticas opacas), o novo utilizador será criado como ativo, sem passar pelo processo de validação de conta de utilizador do Joomla!. Isto significa que não será enviado nenhum e-mail de ativação de conta ao utilizador ou aos administradores do site Joomla!."

PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_LABEL="Estilo dos botões"
PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_DESC="Quando ativado, o CSS personalizado para o estilo dos botões de início de sessão, vinculação e desvinculação será incluído no cabeçalho da página. Desative esta opção se pretender utilizar o seu próprio CSS para estilizar os botões."

PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_LABEL="Cor de primeiro plano do botão"
PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_DESC="A cor de primeiro plano (texto) para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_LABEL="Cor de fundo do botão"
PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_DESC="A cor de fundo para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#000000</code>"

PLG_SOCIALLOGIN_APPLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="A sua conta neste site está desativada ou não foi ativada."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_NOT_FOUND="Não tem uma conta neste site que corresponda a este Apple ID."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_USERNAME_CONFLICT="Já existe uma conta neste site com o mesmo nome de utilizador ou endereço de correio eletrónico que a sua conta Apple ID. Por favor inicie sessão na sua conta neste site e depois vincule o seu Apple ID. Se não se lembrar de ter uma conta de utilizador, por favor crie uma nova primeiro."
PLG_SOCIALLOGIN_APPLE_ERROR_CANNOT_CREATE="Não foi possível criar um novo utilizador no nosso site: %s"

PLG_SOCIALLOGIN_APPLE_NOTICE_USERACTIVATE="O seu endereço de correio eletrónico precisa de ser verificado antes de iniciar sessão neste site. Foi-lhe enviado um e-mail com instruções. Após seguir essas instruções, volte aqui e tente novamente iniciar sessão neste site utilizando Apple."
PLG_SOCIALLOGIN_APPLE_NOTICE_ADMINACTIVATE="A sua conta precisa de ser revista por um administrador. Quando o processo de revisão estiver concluído, receberá um e-mail de confirmação. Após receber esse e-mail, volte aqui e tente novamente iniciar sessão neste site utilizando Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_LABEL="Os botões de início de sessão podem ser mostrados em"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_DESC="Em que parte(s) do seu site pretende permitir a apresentação dos botões de Início de Sessão Social? <br/> <strong>ATENÇÃO!</strong> Se o único método de início de sessão de um utilizador for o SocialLogin, escolher qualquer opção que não seja Ambos resultará no bloqueio efetivo do acesso à outra parte do seu site."
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
