PLG_SOCIALLOGIN_APPLE_LOGIN_LABEL="Iniciar sesión con Apple"
PLG_SOCIALLOGIN_APPLE_LOGIN_DESC="Inicie sesión con su Apple ID. Se creará una nueva cuenta si no existe ninguna cuenta coincidente en nuestro sitio."

PLG_SOCIALLOGIN_APPLE_LINK_LABEL="Vincular Apple"
PLG_SOCIALLOGIN_APPLE_LINK_DESC="Vincula su usuario en este sitio con su Apple ID. Luego podrá usar su Apple ID para iniciar sesión en este sitio."

PLG_SOCIALLOGIN_APPLE_UNLINK_LABEL="Desvincular Apple"
PLG_SOCIALLOGIN_APPLE_UNLINK_DESC="Desvincula su usuario en este sitio de su Apple ID."

PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_LABEL="Client ID (Services ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_DESC="Introduzca el Services ID que creó en su cuenta de Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_LABEL="Team ID"
PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_DESC="Introduzca el Team ID de su cuenta de Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_LABEL="Key ID"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_DESC="Introduzca el Key ID que creó para el Services ID indicado a continuación en su cuenta de Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_LABEL="Clave secreta"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_DESC="Introduzca el contenido del archivo de clave secreta que corresponde al Key ID anterior. Al crear una clave secreta en el sitio de la cuenta de Apple Developer, descargó un archivo con un nombre similar a <code>AuthKey_ABCDEF01234.p8</code>. Este es un archivo de texto. Ábralo con un editor de texto como TextEdit, copie su contenido y péguelo aquí."

PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_LABEL="Permitir el inicio de sesión social en cuentas no vinculadas"
PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_DESC="Cuando está habilitado, permite a los usuarios iniciar sesión aunque no hayan vinculado su Apple ID a su cuenta de usuario del sitio. Deben elegir compartir su dirección de correo electrónico real al iniciar sesión con Apple y la dirección de correo electrónico de su cuenta debe ser la misma que la que compartieron con su sitio al iniciar sesión con Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_LABEL="Crear nuevas cuentas de usuario"
PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_DESC="Crea un nuevo usuario de Joomla! cuando un usuario intenta iniciar sesión a través de Apple ID pero no existe ninguna cuenta de usuario de Joomla! asociada con ese Apple ID. Si el registro de usuarios está deshabilitado, no se creará ninguna cuenta y se mostrará un error. El nuevo usuario de Joomla! tendrá un nombre de usuario aleatorio, la misma dirección de correo electrónico que la devuelta por Apple (puede ser una dirección de correo proxy) y una contraseña larga y aleatoria (que el usuario puede cambiar una vez que haya iniciado sesión). Establezca esto en No para evitar la creación de cuentas de usuario a través del inicio de sesión de Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_LABEL="Ignorar la configuración de Joomla! para crear cuentas de usuario"
PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_DESC="Cuando tanto esta opción como la opción «Crear nuevas cuentas de usuario» anterior están habilitadas, siempre se creará un nuevo usuario, incluso si ha deshabilitado el registro de usuarios en las opciones de la página Usuarios de Joomla. Esto es útil para evitar que alguien se registre en su sitio <em>a menos que</em> tenga una cuenta de Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_LABEL="Omitir la validación de usuario para usuarios de Apple"
PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_DESC="Solo se aplica al crear nuevas cuentas de usuario. Si Apple indica que el usuario que intenta iniciar sesión es probablemente una persona real (según sus propias heurísticas opacas), el nuevo usuario se creará activo, sin pasar por la validación de cuenta de usuario de Joomla!. Esto significa que no se enviará ningún correo electrónico de activación de cuenta al usuario ni a los administradores del sitio Joomla!."

PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_LABEL="Estilo del botón"
PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_DESC="Cuando está habilitado, se generará CSS personalizado para el estilo de los botones de inicio de sesión, vinculación y desvinculación en el encabezado de la página. Deshabilite esta opción si pretende usar su propio CSS para dar estilo a los botones."

PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_LABEL="Color de primer plano del botón"
PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_DESC="El color de primer plano (texto) para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_LABEL="Color de fondo del botón"
PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_DESC="El color de fondo para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#000000</code>"

PLG_SOCIALLOGIN_APPLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Su cuenta en este sitio está deshabilitada o no está activada."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_NOT_FOUND="No tiene una cuenta en este sitio que corresponda a este Apple ID."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_USERNAME_CONFLICT="Ya existe una cuenta en este sitio con el mismo nombre de usuario o dirección de correo electrónico que su Apple ID. Por favor, inicie sesión en su cuenta en este sitio y luego vincule su Apple ID. Si no recuerda tener una cuenta de usuario, cree primero una nueva."
PLG_SOCIALLOGIN_APPLE_ERROR_CANNOT_CREATE="No se pudo crear un nuevo usuario en nuestro sitio: %s"

PLG_SOCIALLOGIN_APPLE_NOTICE_USERACTIVATE="Su dirección de correo electrónico debe verificarse antes de iniciar sesión en este sitio. Se le ha enviado un correo electrónico con instrucciones. Tras seguir estas instrucciones, vuelva aquí e intente iniciar sesión en este sitio usando Apple."
PLG_SOCIALLOGIN_APPLE_NOTICE_ADMINACTIVATE="Un administrador debe revisar su cuenta. Cuando el proceso de revisión se complete, recibirá un correo electrónico de confirmación. Tras recibir ese correo electrónico, vuelva aquí e intente iniciar sesión en este sitio usando Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_LABEL="Los botones de inicio de sesión se pueden mostrar en"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_DESC="¿En qué parte(s) de su sitio desea permitir mostrar los botones de Social Login? <br/> <strong>¡PELIGRO!</strong> Si el único método de inicio de sesión de un usuario es SocialLogin, elegir cualquier opción que no sea Ambos resultará en que quede efectivamente bloqueado de la otra parte de su sitio."
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
