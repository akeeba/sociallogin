PLG_SOCIALLOGIN_APPLE_LOGIN_LABEL="Se connecter avec Apple"
PLG_SOCIALLOGIN_APPLE_LOGIN_DESC="Connectez-vous avec votre Apple ID. Un nouveau compte sera créé si aucun compte correspondant n'existe sur notre site."

PLG_SOCIALLOGIN_APPLE_LINK_LABEL="Associer Apple"
PLG_SOCIALLOGIN_APPLE_LINK_DESC="Associe votre utilisateur sur ce site à votre Apple ID. Vous pourrez ensuite utiliser votre Apple ID pour vous connecter à ce site."

PLG_SOCIALLOGIN_APPLE_UNLINK_LABEL="Dissocier Apple"
PLG_SOCIALLOGIN_APPLE_UNLINK_DESC="Dissocie votre utilisateur sur ce site de votre Apple ID."

PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_LABEL="Client ID (Services ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_CLIENTID_DESC="Saisissez le Services ID que vous avez créé dans votre compte Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_LABEL="Identifiant d'équipe (Team ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_TEAMID_DESC="Saisissez l'identifiant d'équipe (Team ID) de votre compte Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_LABEL="Identifiant de clé (Key ID)"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYID_DESC="Saisissez le Key ID que vous avez créé pour le Services ID indiqué ci-dessous dans votre compte Apple Developer."

PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_LABEL="Clé secrète"
PLG_SOCIALLOGIN_APPLE_FIELD_KEYMATERIAL_DESC="Saisissez le contenu du fichier de clé secrète correspondant au Key ID ci-dessus. Lorsque vous avez créé une clé secrète sur le site du compte Apple Developer, vous avez téléchargé un fichier portant un nom similaire à <code>AuthKey_ABCDEF01234.p8</code>. Il s'agit d'un fichier texte. Ouvrez-le avec un éditeur de texte tel que TextEdit, copiez son contenu et collez-le ici."

PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_LABEL="Autoriser la connexion sociale aux comptes non associés"
PLG_SOCIALLOGIN_APPLE_FIELD_LOGINUNLINKED_DESC="Lorsque cette option est activée, elle permet aux utilisateurs de se connecter même s'ils n'ont pas associé leur Apple ID à leur compte utilisateur sur le site. Ils doivent choisir de partager leur véritable adresse e-mail lors de la connexion avec Apple, et l'adresse e-mail de leur compte doit être identique à celle qu'ils ont partagée avec votre site lors de la connexion avec Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_LABEL="Créer de nouveaux comptes utilisateurs"
PLG_SOCIALLOGIN_APPLE_FIELD_CREATENEW_DESC="Crée un nouvel utilisateur Joomla! lorsqu'un utilisateur tente de se connecter via Apple ID mais qu'il n'existe aucun compte utilisateur Joomla! associé à cet Apple ID. Si l'inscription des utilisateurs est désactivée, aucun compte ne sera créé et une erreur sera générée. Le nouvel utilisateur Joomla! aura un nom d'utilisateur aléatoire, la même adresse e-mail que celle renvoyée par Apple (il peut s'agir d'une adresse e-mail proxy) et un mot de passe long et aléatoire (que l'utilisateur peut modifier une fois connecté). Définissez cette option sur Non pour empêcher la création de comptes utilisateurs via la connexion Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_LABEL="Ignorer le paramètre Joomla! pour la création de comptes utilisateurs"
PLG_SOCIALLOGIN_APPLE_FIELD_FORCENEW_DESC="Lorsque cette option et l'option «&nbsp;Créer de nouveaux comptes utilisateurs&nbsp;» ci-dessus sont toutes deux activées, un nouvel utilisateur sera toujours créé, même si vous avez désactivé l'inscription des utilisateurs dans les options de la page Utilisateurs de Joomla!. Ceci est utile pour empêcher quiconque de s'inscrire sur votre site <em>à moins</em> de disposer d'un compte Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_LABEL="Contourner la validation utilisateur pour les utilisateurs Apple"
PLG_SOCIALLOGIN_APPLE_FIELD_BYPASSVALIDATION_DESC="S'applique uniquement lors de la création de nouveaux comptes utilisateurs. Si Apple indique que l'utilisateur qui tente de se connecter est très probablement un être humain réel (en se basant sur ses propres heuristiques opaques), le nouvel utilisateur sera créé actif, sans passer par la validation du compte utilisateur Joomla!. Cela signifie qu'aucun e-mail d'activation de compte ne sera envoyé à l'utilisateur ni aux administrateurs du site Joomla!."

PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_LABEL="Style des boutons"
PLG_SOCIALLOGIN_APPLE_FIELD_CUSTOMCSS_DESC="Lorsque cette option est activée, un CSS personnalisé pour le style des boutons de connexion, d'association et de dissociation sera ajouté dans l'en-tête de la page. Désactivez cette option si vous souhaitez utiliser votre propre CSS pour styliser les boutons."

PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_LABEL="Couleur de premier plan du bouton"
PLG_SOCIALLOGIN_APPLE_FIELD_FGCOLOR_DESC="La couleur de premier plan (texte) pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_LABEL="Couleur d'arrière-plan du bouton"
PLG_SOCIALLOGIN_APPLE_FIELD_BGCOLOR_DESC="La couleur d'arrière-plan pour les boutons de connexion, d'association et de dissociation créés par cette extension. Par défaut : <code>#000000</code>"

PLG_SOCIALLOGIN_APPLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Votre compte sur ce site est désactivé ou non activé."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_NOT_FOUND="Vous n'avez pas de compte sur ce site correspondant à cet Apple ID."
PLG_SOCIALLOGIN_APPLE_ERROR_LOCAL_USERNAME_CONFLICT="Un compte avec le même nom d'utilisateur ou la même adresse e-mail que votre compte Apple ID existe déjà sur ce site. Veuillez vous connecter à votre compte sur ce site, puis associer votre Apple ID à celui-ci. Si vous ne vous souvenez pas avoir un compte utilisateur, veuillez d'abord en créer un nouveau."
PLG_SOCIALLOGIN_APPLE_ERROR_CANNOT_CREATE="Impossible de créer un nouvel utilisateur sur notre site : %s"

PLG_SOCIALLOGIN_APPLE_NOTICE_USERACTIVATE="Votre adresse e-mail doit être vérifiée avant de vous connecter à ce site. Un e-mail vous a été envoyé avec des instructions. Après avoir suivi ces instructions, revenez ici et réessayez de vous connecter à ce site en utilisant Apple."
PLG_SOCIALLOGIN_APPLE_NOTICE_ADMINACTIVATE="Votre compte doit être examiné par un administrateur. Lorsque le processus d'examen sera terminé, vous recevrez un e-mail de confirmation. Après réception de cet e-mail, revenez ici et réessayez de vous connecter à ce site en utilisant Apple."

PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_LABEL="Les boutons de connexion peuvent être affichés dans"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_DESC="Dans quelle(s) partie(s) de votre site souhaitez-vous autoriser l'affichage des boutons de connexion sociale ? <br/> <strong>DANGER !</strong> Si la connexion sociale est la seule méthode de connexion d'un utilisateur, choisir une option autre que Les deux l'empêchera effectivement d'accéder à l'autre partie de votre site."
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_SITE="Interface publique"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Interface d'administration"
PLG_SOCIALLOGIN_APPLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Les deux"
