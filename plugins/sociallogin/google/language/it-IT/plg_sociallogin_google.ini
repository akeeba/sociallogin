PLG_SOCIALLOGIN_GOOGLE="Akeeba Social Login - integrazione Google"
PLG_SOCIALLOGIN_GOOGLE_DESCRIPTION="Consente l'accesso social con account Google."

PLG_SOCIALLOGIN_GOOGLE_LOGIN_LABEL="Accedi con Google"
PLG_SOCIALLOGIN_GOOGLE_LOGIN_DESC="Accedi con il tuo account Google. Se non esiste un account corrispondente sul nostro sito, ne verrà creato uno nuovo."

PLG_SOCIALLOGIN_GOOGLE_LINK_LABEL="Collega Google"
PLG_SOCIALLOGIN_GOOGLE_LINK_DESC="Collega il tuo utente su questo sito al tuo account Google. Potrai quindi usare il tuo account Google per accedere a questo sito."

PLG_SOCIALLOGIN_GOOGLE_UNLINK_LABEL="Scollega Google"
PLG_SOCIALLOGIN_GOOGLE_UNLINK_DESC="Scollega il tuo utente su questo sito dal tuo account Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_APPID_LABEL="Google Client ID"
PLG_SOCIALLOGIN_GOOGLE_FIELD_APPID_DESC="Inserisci qui il Client ID del tuo progetto Google API. Questo è necessario per abilitare l'accesso social con Google. Puoi creare un progetto Google API su https://console.developers.google.com/apis"

PLG_SOCIALLOGIN_GOOGLE_FIELD_APPSECRET_LABEL="Google Client Secret"
PLG_SOCIALLOGIN_GOOGLE_FIELD_APPSECRET_DESC="Inserisci qui il Client Secret del tuo progetto Google API. Questo è necessario per abilitare l'accesso social con Google. Puoi creare un progetto Google API su https://console.developers.google.com/apis"

PLG_SOCIALLOGIN_GOOGLE_FIELD_LOGINUNLINKED_LABEL="Consenti accesso social ad account non collegati"
PLG_SOCIALLOGIN_GOOGLE_FIELD_LOGINUNLINKED_DESC="Se abilitato, consente agli utenti di accedere anche senza aver collegato il proprio account Google all'account utente del sito. L'indirizzo email dell'account Google deve essere lo stesso dell'account email utilizzato sul tuo sito (da notare che Google ha verificato la validità del loro indirizzo email)."

PLG_SOCIALLOGIN_GOOGLE_FIELD_CREATENEW_LABEL="Crea nuovi account utente"
PLG_SOCIALLOGIN_GOOGLE_FIELD_CREATENEW_DESC="Crea un nuovo utente Joomla! quando un utente tenta di accedere tramite Google ma non esiste un account utente Joomla! associato a quell'email o ID utente Google. Se la registrazione utenti è disabilitata, non verrà creato nessun account e verrà generato un errore. Il nuovo utente Joomla! avrà un nome utente derivato dall'accesso Google, lo stesso indirizzo email dell'account Google e una password lunga e casuale (che l'utente può modificare dopo aver effettuato l'accesso). Imposta su No per impedire la creazione di account utente tramite l'accesso Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_FORCENEW_LABEL="Ignora l'impostazione di Joomla! per la creazione di account utente"
PLG_SOCIALLOGIN_GOOGLE_FIELD_FORCENEW_DESC="Quando sia questa opzione che l'opzione 'Crea nuovi account utente' qui sopra sono abilitate, verrà sempre creato un nuovo utente, anche se hai disabilitato la registrazione utenti nelle opzioni della pagina Utenti di Joomla!. Questo è utile per impedire a chiunque di registrarsi al tuo sito <em>a meno che</em> non disponga di un account Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_BYPASSVALIDATION_LABEL="Salta la validazione utente"
PLG_SOCIALLOGIN_GOOGLE_FIELD_BYPASSVALIDATION_DESC="Si applica solo alla creazione di nuovi account utente. Google ha già verificato che l'indirizzo email collegato all'account Google di questa persona sia sotto il loro controllo. Ciò rende inutile la procedura di validazione dell'account utente Joomla!. Abilitando questa opzione, la verifica dell'account Joomla! verrà quindi saltata. Ciò significa che non verrà inviata nessuna email di attivazione dell'account all'utente o agli amministratori del sito Joomla!."

PLG_SOCIALLOGIN_GOOGLE_FIELD_CUSTOMCSS_LABEL="Stile dei pulsanti"
PLG_SOCIALLOGIN_GOOGLE_FIELD_CUSTOMCSS_DESC="Se abilitato, verrà inserito nell'intestazione della pagina il CSS personalizzato per lo stile dei pulsanti di accesso, collegamento e scollegamento. Disabilita questa opzione se intendi usare il tuo CSS per personalizzare i pulsanti."

PLG_SOCIALLOGIN_GOOGLE_FIELD_FGCOLOR_LABEL="Colore primo piano del pulsante"
PLG_SOCIALLOGIN_GOOGLE_FIELD_FGCOLOR_DESC="Il colore del primo piano (testo) per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_GOOGLE_FIELD_BGCOLOR_LABEL="Colore di sfondo del pulsante"
PLG_SOCIALLOGIN_GOOGLE_FIELD_BGCOLOR_DESC="Il colore di sfondo per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#4285F4</code>"

PLG_SOCIALLOGIN_GOOGLE_ERROR_NOT_LOGGED_IN_GOOGLE="Non hai effettuato l'accesso a Google o non hai concesso le autorizzazioni necessarie affinché questo sito ti autentichi tramite Google."
PLG_SOCIALLOGIN_GOOGLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Il tuo account su questo sito è disabilitato o non attivato."
PLG_SOCIALLOGIN_GOOGLE_ERROR_LOCAL_NOT_FOUND="Non hai un account su questo sito corrispondente a questo account Google."
PLG_SOCIALLOGIN_GOOGLE_ERROR_LOCAL_USERNAME_CONFLICT="Esiste già un account con lo stesso nome utente o indirizzo email del tuo account Google su questo sito. Accedi al tuo account su questo sito e poi collega il tuo account Google. Se non ricordi di avere un account utente, creane prima uno nuovo."
PLG_SOCIALLOGIN_GOOGLE_ERROR_CANNOT_CREATE="Impossibile creare un nuovo utente sul nostro sito: %s"

PLG_SOCIALLOGIN_GOOGLE_NOTICE_USERACTIVATE="Il tuo indirizzo email deve essere verificato prima di accedere a questo sito. Ti è stata inviata un'email con le istruzioni. Dopo aver seguito queste istruzioni, torna qui e riprova ad accedere a questo sito tramite Google."
PLG_SOCIALLOGIN_GOOGLE_NOTICE_ADMINACTIVATE="Il tuo account deve essere esaminato da un amministratore. Al termine del processo di revisione riceverai un'email di conferma. Dopo aver ricevuto quell'email, torna qui e riprova ad accedere a questo sito tramite Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_LABEL="I pulsanti di accesso possono essere visualizzati in"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_DESC="In quale/i parte/i del tuo sito vuoi consentire la visualizzazione dei pulsanti Social Login? <br/> <strong>ATTENZIONE!</strong> Se l'unico metodo di accesso di un utente è SocialLogin, scegliere un'opzione diversa da Entrambi comporterà l'impossibilità di accedere all'altra parte del sito."
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Entrambi"
