PLG_SOCIALLOGIN_GOOGLE="Akeeba Social Login - integración con Google"
PLG_SOCIALLOGIN_GOOGLE_DESCRIPTION="Permite el inicio de sesión social con cuentas de Google."

PLG_SOCIALLOGIN_GOOGLE_LOGIN_LABEL="Iniciar sesión con Google"
PLG_SOCIALLOGIN_GOOGLE_LOGIN_DESC="Inicie sesión con su cuenta de Google. Se creará una nueva cuenta si no existe ninguna cuenta coincidente en nuestro sitio."

PLG_SOCIALLOGIN_GOOGLE_LINK_LABEL="Vincular Google"
PLG_SOCIALLOGIN_GOOGLE_LINK_DESC="Vincula su usuario en este sitio con su cuenta de Google. Luego podrá usar su cuenta de Google para iniciar sesión en este sitio."

PLG_SOCIALLOGIN_GOOGLE_UNLINK_LABEL="Desvincular Google"
PLG_SOCIALLOGIN_GOOGLE_UNLINK_DESC="Desvincula su usuario en este sitio de su cuenta de Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_APPID_LABEL="Client ID de Google"
PLG_SOCIALLOGIN_GOOGLE_FIELD_APPID_DESC="Introduzca aquí el Client ID de su proyecto de API de Google. Esto es necesario para habilitar el inicio de sesión social con Google. Puede crear un proyecto de API de Google en https://console.developers.google.com/apis"

PLG_SOCIALLOGIN_GOOGLE_FIELD_APPSECRET_LABEL="Client Secret de Google"
PLG_SOCIALLOGIN_GOOGLE_FIELD_APPSECRET_DESC="Introduzca aquí el Client Secret de su proyecto de API de Google. Esto es necesario para habilitar el inicio de sesión social con Google. Puede crear un proyecto de API de Google en https://console.developers.google.com/apis"

PLG_SOCIALLOGIN_GOOGLE_FIELD_LOGINUNLINKED_LABEL="Permitir el inicio de sesión social en cuentas no vinculadas"
PLG_SOCIALLOGIN_GOOGLE_FIELD_LOGINUNLINKED_DESC="Cuando está habilitado, permite a los usuarios iniciar sesión aunque no hayan vinculado su cuenta de Google a su cuenta de usuario del sitio. La dirección de correo electrónico de su cuenta de Google debe ser la misma que la cuenta de correo que usan en su sitio (tenga en cuenta que Google ha verificado la validez de su dirección de correo electrónico)."

PLG_SOCIALLOGIN_GOOGLE_FIELD_CREATENEW_LABEL="Crear nuevas cuentas de usuario"
PLG_SOCIALLOGIN_GOOGLE_FIELD_CREATENEW_DESC="Crea un nuevo usuario de Joomla! cuando un usuario intenta iniciar sesión a través de Google pero no existe ninguna cuenta de usuario de Joomla! asociada con ese correo electrónico o ID de usuario de Google. Si el registro de usuarios está deshabilitado, no se creará ninguna cuenta y se mostrará un error. El nuevo usuario de Joomla! tendrá un nombre de usuario derivado del inicio de sesión de Google, la misma dirección de correo electrónico que la cuenta de Google y una contraseña larga y aleatoria (que el usuario puede cambiar una vez que haya iniciado sesión). Establezca esto en No para evitar la creación de cuentas de usuario a través del inicio de sesión de Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_FORCENEW_LABEL="Ignorar la configuración de Joomla! para crear cuentas de usuario"
PLG_SOCIALLOGIN_GOOGLE_FIELD_FORCENEW_DESC="Cuando tanto esta opción como la opción «Crear nuevas cuentas de usuario» anterior están habilitadas, siempre se creará un nuevo usuario, incluso si ha deshabilitado el registro de usuarios en las opciones de la página Usuarios de Joomla. Esto es útil para evitar que alguien se registre en su sitio <em>a menos que</em> tenga una cuenta de Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_BYPASSVALIDATION_LABEL="Omitir la validación de usuario"
PLG_SOCIALLOGIN_GOOGLE_FIELD_BYPASSVALIDATION_DESC="Solo se aplica al crear nuevas cuentas de usuario. Google ya ha verificado que la dirección de correo electrónico vinculada a la cuenta de Google de esta persona está bajo su control. Esto hace innecesario pasar por la validación de cuenta de usuario de Joomla!. Al habilitar esta opción, se omitirá la verificación de cuenta de Joomla!. Esto significa que no se enviará ningún correo electrónico de activación de cuenta al usuario ni a los administradores del sitio Joomla!."

PLG_SOCIALLOGIN_GOOGLE_FIELD_CUSTOMCSS_LABEL="Estilo del botón"
PLG_SOCIALLOGIN_GOOGLE_FIELD_CUSTOMCSS_DESC="Cuando está habilitado, se generará CSS personalizado para el estilo de los botones de inicio de sesión, vinculación y desvinculación en el encabezado de la página. Deshabilite esta opción si pretende usar su propio CSS para dar estilo a los botones."

PLG_SOCIALLOGIN_GOOGLE_FIELD_FGCOLOR_LABEL="Color de primer plano del botón"
PLG_SOCIALLOGIN_GOOGLE_FIELD_FGCOLOR_DESC="El color de primer plano (texto) para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_GOOGLE_FIELD_BGCOLOR_LABEL="Color de fondo del botón"
PLG_SOCIALLOGIN_GOOGLE_FIELD_BGCOLOR_DESC="El color de fondo para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#4285F4</code>"

PLG_SOCIALLOGIN_GOOGLE_ERROR_NOT_LOGGED_IN_GOOGLE="No ha iniciado sesión en Google o no ha concedido permisos para que este sitio le autentique a través de Google."
PLG_SOCIALLOGIN_GOOGLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Su cuenta en este sitio está deshabilitada o no está activada."
PLG_SOCIALLOGIN_GOOGLE_ERROR_LOCAL_NOT_FOUND="No tiene una cuenta en este sitio que corresponda a esta cuenta de Google."
PLG_SOCIALLOGIN_GOOGLE_ERROR_LOCAL_USERNAME_CONFLICT="Ya existe una cuenta en este sitio con el mismo nombre de usuario o dirección de correo electrónico que su cuenta de Google. Por favor, inicie sesión en su cuenta en este sitio y luego vincule su cuenta de Google. Si no recuerda tener una cuenta de usuario, cree primero una nueva."
PLG_SOCIALLOGIN_GOOGLE_ERROR_CANNOT_CREATE="No se pudo crear un nuevo usuario en nuestro sitio: %s"

PLG_SOCIALLOGIN_GOOGLE_NOTICE_USERACTIVATE="Su dirección de correo electrónico debe verificarse antes de iniciar sesión en este sitio. Se le ha enviado un correo electrónico con instrucciones. Tras seguir estas instrucciones, vuelva aquí e intente iniciar sesión en este sitio usando Google."
PLG_SOCIALLOGIN_GOOGLE_NOTICE_ADMINACTIVATE="Un administrador debe revisar su cuenta. Cuando el proceso de revisión se complete, recibirá un correo electrónico de confirmación. Tras recibir ese correo electrónico, vuelva aquí e intente iniciar sesión en este sitio usando Google."

PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_LABEL="Los botones de inicio de sesión se pueden mostrar en"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_DESC="¿En qué parte(s) de su sitio desea permitir mostrar los botones de Social Login? <br/> <strong>¡PELIGRO!</strong> Si el único método de inicio de sesión de un usuario es SocialLogin, elegir cualquier opción que no sea Ambos resultará en que quede efectivamente bloqueado de la otra parte de su sitio."
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
