PLG_SOCIALLOGIN_GOOGLE="Akeeba Social Login - Google Integration"
PLG_SOCIALLOGIN_GOOGLE_DESCRIPTION="Ermöglicht die Anmeldung mit Google-Konten."

PLG_SOCIALLOGIN_GOOGLE_LOGIN_LABEL="Mit Google anmelden"
PLG_SOCIALLOGIN_GOOGLE_LOGIN_DESC="Melden Sie sich mit Ihrem Google-Konto an. Ein neues Konto wird erstellt, wenn kein übereinstimmendes Konto auf unserer Website vorhanden ist."

PLG_SOCIALLOGIN_GOOGLE_LINK_LABEL="Google verknüpfen"
PLG_SOCIALLOGIN_GOOGLE_LINK_DESC="Verknüpft Ihren Benutzer auf dieser Website mit Ihrem Google-Konto. Sie können sich dann mit Ihrem Google-Konto auf dieser Website anmelden."

PLG_SOCIALLOGIN_GOOGLE_UNLINK_LABEL="Google-Verknüpfung aufheben"
PLG_SOCIALLOGIN_GOOGLE_UNLINK_DESC="Hebt die Verknüpfung Ihres Benutzers auf dieser Website mit Ihrem Google-Konto auf."

PLG_SOCIALLOGIN_GOOGLE_FIELD_APPID_LABEL="Google Client ID"
PLG_SOCIALLOGIN_GOOGLE_FIELD_APPID_DESC="Geben Sie hier die Client ID für Ihr Google API-Projekt ein. Dies ist erforderlich, um die Anmeldung mit Google zu aktivieren. Sie können ein Google API-Projekt unter https://console.developers.google.com/apis erstellen."

PLG_SOCIALLOGIN_GOOGLE_FIELD_APPSECRET_LABEL="Google Client Secret"
PLG_SOCIALLOGIN_GOOGLE_FIELD_APPSECRET_DESC="Geben Sie hier das Client Secret für Ihr Google API-Projekt ein. Dies ist erforderlich, um die Anmeldung mit Google zu aktivieren. Sie können ein Google API-Projekt unter https://console.developers.google.com/apis erstellen."

PLG_SOCIALLOGIN_GOOGLE_FIELD_LOGINUNLINKED_LABEL="Social-Login für nicht verknüpfte Konten erlauben"
PLG_SOCIALLOGIN_GOOGLE_FIELD_LOGINUNLINKED_DESC="Wenn aktiviert, können sich Benutzer anmelden, auch wenn ihr Google-Konto nicht mit ihrem Website-Benutzerkonto verknüpft ist. Die E-Mail-Adresse des Google-Kontos muss mit der E-Mail-Adresse übereinstimmen, die auf Ihrer Website verwendet wird (beachten Sie, dass Google die Gültigkeit ihrer E-Mail-Adresse überprüft hat)."

PLG_SOCIALLOGIN_GOOGLE_FIELD_CREATENEW_LABEL="Neue Benutzerkonten erstellen"
PLG_SOCIALLOGIN_GOOGLE_FIELD_CREATENEW_DESC="Erstellt einen neuen Joomla!-Benutzer, wenn sich ein Benutzer über Google anmelden möchte, aber kein Joomla!-Benutzerkonto mit dieser E-Mail-Adresse oder Google-Benutzer-ID verknüpft ist. Wenn die Benutzerregistrierung deaktiviert ist, wird kein Konto erstellt und ein Fehler ausgegeben. Der neue Joomla!-Benutzer erhält einen aus dem Google-Login abgeleiteten Benutzernamen, dieselbe E-Mail-Adresse wie das Google-Konto und ein langes, zufälliges Passwort (das der Benutzer nach der Anmeldung ändern kann). Setzen Sie dies auf Nein, um die Erstellung von Benutzerkonten über die Google-Anmeldung zu verhindern."

PLG_SOCIALLOGIN_GOOGLE_FIELD_FORCENEW_LABEL="Joomla!-Einstellung zur Benutzerkontenerstellung ignorieren"
PLG_SOCIALLOGIN_GOOGLE_FIELD_FORCENEW_DESC="Wenn sowohl diese Option als auch die obige Option „Neue Benutzerkonten erstellen" aktiviert sind, wird immer ein neuer Benutzer erstellt, auch wenn Sie die Benutzerregistrierung in den Optionen der Joomla!-Benutzerseite deaktiviert haben. Dies ist nützlich, um zu verhindern, dass sich jemand auf Ihrer Website registriert, <em>es sei denn</em>, er hat ein Google-Konto."

PLG_SOCIALLOGIN_GOOGLE_FIELD_BYPASSVALIDATION_LABEL="Benutzervalidierung überspringen"
PLG_SOCIALLOGIN_GOOGLE_FIELD_BYPASSVALIDATION_DESC="Gilt nur beim Erstellen neuer Benutzerkonten. Google hat bereits verifiziert, dass die mit dem Google-Konto dieser Person verknüpfte E-Mail-Adresse unter ihrer Kontrolle steht. Dies macht die Joomla!-Benutzerkonto-Validierung überflüssig. Durch Aktivieren dieser Option wird die Joomla!-Konto-Verifizierung daher übersprungen. Das bedeutet, dass keine Konto-Aktivierungs-E-Mail an den Benutzer oder die Administratoren der Joomla!-Website gesendet wird."

PLG_SOCIALLOGIN_GOOGLE_FIELD_CUSTOMCSS_LABEL="Schaltflächenstil"
PLG_SOCIALLOGIN_GOOGLE_FIELD_CUSTOMCSS_DESC="Wenn aktiviert, wird benutzerdefiniertes CSS für die Gestaltung der Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen in den Seitenkopf ausgegeben. Deaktivieren Sie diese Option, wenn Sie Ihr eigenes CSS zur Gestaltung der Schaltflächen verwenden möchten."

PLG_SOCIALLOGIN_GOOGLE_FIELD_FGCOLOR_LABEL="Vordergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_GOOGLE_FIELD_FGCOLOR_DESC="Die Vordergrundfarbe (Text) für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_GOOGLE_FIELD_BGCOLOR_LABEL="Hintergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_GOOGLE_FIELD_BGCOLOR_DESC="Die Hintergrundfarbe für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#4285F4</code>"

PLG_SOCIALLOGIN_GOOGLE_ERROR_NOT_LOGGED_IN_GOOGLE="Sie sind nicht bei Google angemeldet oder haben dieser Website keine Berechtigungen erteilt, Sie über Google anzumelden."
PLG_SOCIALLOGIN_GOOGLE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ihr Konto auf dieser Website ist deaktiviert oder noch nicht aktiviert."
PLG_SOCIALLOGIN_GOOGLE_ERROR_LOCAL_NOT_FOUND="Sie haben kein Konto auf dieser Website, das diesem Google-Konto entspricht."
PLG_SOCIALLOGIN_GOOGLE_ERROR_LOCAL_USERNAME_CONFLICT="Auf dieser Website existiert bereits ein Konto mit demselben Benutzernamen oder derselben E-Mail-Adresse wie Ihr Google-Konto. Bitte melden Sie sich bei Ihrem Konto auf dieser Website an und verknüpfen Sie dann Ihr Google-Konto damit. Wenn Sie sich nicht erinnern, bereits ein Benutzerkonto zu haben, erstellen Sie bitte zuerst ein neues."
PLG_SOCIALLOGIN_GOOGLE_ERROR_CANNOT_CREATE="Es konnte kein neuer Benutzer auf unserer Website erstellt werden: %s"

PLG_SOCIALLOGIN_GOOGLE_NOTICE_USERACTIVATE="Ihre E-Mail-Adresse muss verifiziert werden, bevor Sie sich auf dieser Website anmelden können. Eine E-Mail mit Anweisungen wurde an Sie gesendet. Nachdem Sie diesen Anweisungen gefolgt sind, kehren Sie bitte hierher zurück und versuchen Sie erneut, sich mit Google auf dieser Website anzumelden."
PLG_SOCIALLOGIN_GOOGLE_NOTICE_ADMINACTIVATE="Ihr Konto muss von einem Administrator überprüft werden. Wenn der Überprüfungsprozess abgeschlossen ist, erhalten Sie eine Bestätigungs-E-Mail. Kehren Sie nach Erhalt dieser E-Mail hierher zurück und versuchen Sie erneut, sich mit Google auf dieser Website anzumelden."

PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_LABEL="Anmelde-Schaltflächen können angezeigt werden in"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_DESC="In welchem Teil/welchen Teilen Ihrer Website möchten Sie das Anzeigen der Social-Login-Schaltflächen erlauben? <br/> <strong>ACHTUNG!</strong> Wenn die einzige Anmeldemethode eines Benutzers SocialLogin ist, führt die Auswahl einer anderen Option als „Beide" dazu, dass der Benutzer im anderen Teil Ihrer Website praktisch ausgesperrt ist."
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_GOOGLE_FIELD_ENABLEDAPPLICATIONS_BOTH="Beide"
