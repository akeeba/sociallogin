PLG_SOCIALLOGIN_SYNOLOGY="Akeeba Social Login - integrazione Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_DESCRIPTION="Consente l'accesso al sito tramite il servizio Single Sign-On (SSO) fornito dai dispositivi Synology NAS e dalle istanze della macchina virtuale Synology DSM."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_WELLKNOWN_LABEL="Well-known URL"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_WELLKNOWN_DESC="Puoi trovarlo in Synology DSM, Server SSO, Servizio, OIDC, Well-known URL. Assicurati che "Abilita server OIDC" sia attivato su quella pagina e che il Well-known URL sia accessibile dal tuo browser web e dal server web che gestisce questo sito."

PLG_SOCIALLOGIN_SYNOLOGY_LOGIN_LABEL="Accedi con Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_LOGIN_DESC="Accedi con il tuo account Synology Single Sign-On. Se non esiste un account corrispondente sul nostro sito, ne verrà creato uno nuovo."

PLG_SOCIALLOGIN_SYNOLOGY_LINK_LABEL="Collega Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_LINK_DESC="Collega il tuo utente su questo sito a Synology SSO. Potrai quindi accedere a questo sito tramite Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_UNLINK_LABEL="Scollega Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_UNLINK_DESC="Scollega il tuo account utente su questo sito dal tuo account Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPID_LABEL="Application ID"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPID_DESC="Inserisci l'Application ID. Puoi creare una nuova applicazione e ottenere queste informazioni accedendo a Synology DSM e andando su Server SSO, Applicazione."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPSECRET_LABEL="Application Secret"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPSECRET_DESC="Inserisci l'Application Secret. Puoi creare una nuova applicazione e ottenere queste informazioni accedendo a Synology DSM e andando su Server SSO, Applicazione."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_LOGINUNLINKED_LABEL="Consenti accesso social ad account non collegati"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_LOGINUNLINKED_DESC="Se abilitato, consente agli utenti di accedere anche senza aver collegato il proprio account Synology SSO all'account utente del sito. L'indirizzo email dell'account Synology SSO deve essere lo stesso dell'account email utilizzato sul tuo sito."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CREATENEW_LABEL="Crea nuovi account utente"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CREATENEW_DESC="Crea un nuovo utente Joomla! quando un utente tenta di accedere tramite Synology SSO ma non esiste un account utente Joomla! associato a quell'email o nome utente Synology SSO. Se la registrazione utenti è disabilitata, non verrà creato nessun account e verrà generato un errore. Il nuovo utente Joomla! avrà lo stesso nome utente dell'account Synology SSO, lo stesso indirizzo email dell'account Synology SSO, un nome nella forma "Synology SSO User nome_utente" e una password lunga e casuale (che l'utente può modificare dopo aver effettuato l'accesso). Imposta su No per impedire la creazione di account utente tramite l'accesso Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FORCENEW_LABEL="Ignora l'impostazione di Joomla! per la creazione di account utente"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FORCENEW_DESC="Quando sia questa opzione che l'opzione 'Crea nuovi account utente' qui sopra sono abilitate, verrà sempre creato un nuovo utente, anche se hai disabilitato la registrazione utenti nelle opzioni della pagina Utenti di Joomla!. Questo è utile per impedire a chiunque di registrarsi al tuo sito <em>a meno che</em> non disponga di un account Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BYPASSVALIDATION_LABEL="Salta la validazione utente per gli utenti Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BYPASSVALIDATION_DESC="Si applica solo alla creazione di nuovi account utente. Quando questa opzione è abilitata, il nuovo utente Joomla! verrà creato come attivo, senza passare per la validazione dell'account utente Joomla!. Ciò significa che non verrà inviata nessuna email di attivazione dell'account all'utente o agli amministratori del sito Joomla!. Questo è sicuro perché gli account Synology SSO vengono validati manualmente dagli amministratori dell'istanza Synology DSM in uso."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CUSTOMCSS_LABEL="Stile dei pulsanti"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CUSTOMCSS_DESC="Se abilitato, verrà inserito nell'intestazione della pagina il CSS personalizzato per lo stile dei pulsanti di accesso, collegamento e scollegamento. Disabilita questa opzione se intendi usare il tuo CSS per personalizzare i pulsanti."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FGCOLOR_LABEL="Colore primo piano del pulsante"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FGCOLOR_DESC="Il colore del primo piano (testo) per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BGCOLOR_LABEL="Colore di sfondo del pulsante"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BGCOLOR_DESC="Il colore di sfondo per i pulsanti di accesso, collegamento e scollegamento creati da questo plugin. Predefinito: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_SYNOLOGY_ERROR_NOT_LOGGED_IN_FB="Non hai effettuato l'accesso al tuo account Synology SSO."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Il tuo account su questo sito è disabilitato o non attivato."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_LOCAL_NOT_FOUND="Non hai un account su questo sito corrispondente a questo account Synology SSO."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_LOCAL_USERNAME_CONFLICT="Esiste già un account con lo stesso nome utente o indirizzo email del tuo Synology SSO su questo sito. Accedi al tuo account su questo sito e poi collega il tuo account Synology SSO. Se non ricordi di avere un account utente, creane prima uno nuovo."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_CANNOT_CREATE="Impossibile creare un nuovo utente sul nostro sito: %s"

PLG_SOCIALLOGIN_SYNOLOGY_NOTICE_USERACTIVATE="Il tuo indirizzo email deve essere verificato prima di accedere a questo sito. Ti è stata inviata un'email con le istruzioni. Dopo aver seguito queste istruzioni, torna qui e riprova ad accedere a questo sito tramite Synology SSO."
PLG_SOCIALLOGIN_SYNOLOGY_NOTICE_ADMINACTIVATE="Il tuo account deve essere esaminato da un amministratore. Al termine del processo di revisione riceverai un'email di conferma. Dopo aver ricevuto quell'email, torna qui e riprova ad accedere a questo sito tramite Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_LABEL="I pulsanti di accesso possono essere visualizzati in"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_DESC="In quale/i parte/i del tuo sito vuoi consentire la visualizzazione dei pulsanti Social Login? <br/> <strong>ATTENZIONE!</strong> Se l'unico metodo di accesso di un utente è SocialLogin, scegliere un'opzione diversa da Entrambi comporterà l'impossibilità di accedere all'altra parte del sito."
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_BOTH="Entrambi"
