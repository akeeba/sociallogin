PLG_SOCIALLOGIN_SYNOLOGY="Akeeba Social Login - integración con Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_DESCRIPTION="Permite iniciar sesión en su sitio usando el servicio de inicio de sesión único (SSO) proporcionado por dispositivos Synology NAS e instancias de máquina virtual Synology DSM."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_WELLKNOWN_LABEL="URL well-known"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_WELLKNOWN_DESC="Puede encontrar esto en su Synology DSM, SSO Server, Service, OIDC, Well-known URL. Asegúrese de que «Habilitar servidor OIDC» esté activado en esa página y que la Well-known URL sea accesible desde su navegador web y el servidor web que ejecuta este sitio."

PLG_SOCIALLOGIN_SYNOLOGY_LOGIN_LABEL="Iniciar sesión con Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_LOGIN_DESC="Inicie sesión con su cuenta de inicio de sesión único de Synology. Se creará una nueva cuenta si no existe ninguna cuenta coincidente en nuestro sitio."

PLG_SOCIALLOGIN_SYNOLOGY_LINK_LABEL="Vincular Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_LINK_DESC="Vincula su usuario en este sitio con Synology SSO. Luego podrá iniciar sesión en este sitio usando Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_UNLINK_LABEL="Desvincular Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_UNLINK_DESC="Desvincula su cuenta de usuario en este sitio de su cuenta Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPID_LABEL="Application ID"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPID_DESC="Introduzca el Application ID. Puede crear una nueva aplicación y obtener esta información iniciando sesión en Synology DSM y accediendo a SSO Server, Application."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPSECRET_LABEL="Application Secret"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_APPSECRET_DESC="Introduzca el Application Secret. Puede crear una nueva aplicación y obtener esta información iniciando sesión en Synology DSM y accediendo a SSO Server, Application."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_LOGINUNLINKED_LABEL="Permitir el inicio de sesión social en cuentas no vinculadas"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_LOGINUNLINKED_DESC="Cuando está habilitado, permite a los usuarios iniciar sesión aunque no hayan vinculado su cuenta Synology SSO a su cuenta de usuario del sitio. La dirección de correo electrónico de su cuenta Synology SSO debe ser la misma que la cuenta de correo que usan en su sitio."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CREATENEW_LABEL="Crear nuevas cuentas de usuario"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CREATENEW_DESC="Crea un nuevo usuario de Joomla! cuando un usuario intenta iniciar sesión a través de Synology SSO pero no existe ninguna cuenta de usuario de Joomla! asociada con ese correo electrónico o nombre de usuario de Synology SSO. Si el registro de usuarios está deshabilitado, no se creará ninguna cuenta y se mostrará un error. El nuevo usuario de Joomla! tendrá el mismo nombre de usuario que la cuenta Synology SSO, la misma dirección de correo electrónico que la cuenta Synology SSO, un nombre con el formato «Synology SSO User some_username» y una contraseña larga y aleatoria (que el usuario puede cambiar una vez que haya iniciado sesión). Establezca esto en No para evitar la creación de cuentas de usuario a través del inicio de sesión de Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FORCENEW_LABEL="Ignorar la configuración de Joomla! para crear cuentas de usuario"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FORCENEW_DESC="Cuando tanto esta opción como la opción «Crear nuevas cuentas de usuario» anterior están habilitadas, siempre se creará un nuevo usuario, incluso si ha deshabilitado el registro de usuarios en las opciones de la página Usuarios de Joomla. Esto es útil para evitar que alguien se registre en su sitio <em>a menos que</em> tenga una cuenta Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BYPASSVALIDATION_LABEL="Omitir la validación de usuario para usuarios de Synology SSO"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BYPASSVALIDATION_DESC="Solo se aplica al crear nuevas cuentas de usuario. Cuando esta opción está habilitada, el nuevo usuario de Joomla! se creará activo, sin pasar por la validación de cuenta de usuario de Joomla!. Esto significa que no se enviará ningún correo electrónico de activación de cuenta al usuario ni a los administradores del sitio Joomla!. Esto es seguro porque las cuentas Synology SSO son validadas manualmente por los administradores de la instancia Synology DSM que está utilizando."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CUSTOMCSS_LABEL="Estilo del botón"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_CUSTOMCSS_DESC="Cuando está habilitado, se generará CSS personalizado para el estilo de los botones de inicio de sesión, vinculación y desvinculación en el encabezado de la página. Deshabilite esta opción si pretende usar su propio CSS para dar estilo a los botones."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FGCOLOR_LABEL="Color de primer plano del botón"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_FGCOLOR_DESC="El color de primer plano (texto) para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#2F2F2F</code>"

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BGCOLOR_LABEL="Color de fondo del botón"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_BGCOLOR_DESC="El color de fondo para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_SYNOLOGY_ERROR_NOT_LOGGED_IN_FB="No ha iniciado sesión en su cuenta Synology SSO."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Su cuenta en este sitio está deshabilitada o no está activada."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_LOCAL_NOT_FOUND="No tiene una cuenta en este sitio que corresponda a esta cuenta Synology SSO."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_LOCAL_USERNAME_CONFLICT="Ya existe una cuenta en este sitio con el mismo nombre de usuario o dirección de correo electrónico que su Synology SSO. Por favor, inicie sesión en su cuenta en este sitio y luego vincule su cuenta Synology SSO. Si no recuerda tener una cuenta de usuario, cree primero una nueva."
PLG_SOCIALLOGIN_SYNOLOGY_ERROR_CANNOT_CREATE="No se pudo crear un nuevo usuario en nuestro sitio: %s"

PLG_SOCIALLOGIN_SYNOLOGY_NOTICE_USERACTIVATE="Su dirección de correo electrónico debe verificarse antes de iniciar sesión en este sitio. Se le ha enviado un correo electrónico con instrucciones. Tras seguir estas instrucciones, vuelva aquí e intente iniciar sesión en este sitio usando Synology SSO."
PLG_SOCIALLOGIN_SYNOLOGY_NOTICE_ADMINACTIVATE="Un administrador debe revisar su cuenta. Cuando el proceso de revisión se complete, recibirá un correo electrónico de confirmación. Tras recibir ese correo electrónico, vuelva aquí e intente iniciar sesión en este sitio usando Synology SSO."

PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_LABEL="Los botones de inicio de sesión se pueden mostrar en"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_DESC="¿En qué parte(s) de su sitio desea permitir mostrar los botones de Social Login? <br/> <strong>¡PELIGRO!</strong> Si el único método de inicio de sesión de un usuario es SocialLogin, elegir cualquier opción que no sea Ambos resultará en que quede efectivamente bloqueado de la otra parte de su sitio."
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_SYNOLOGY_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
