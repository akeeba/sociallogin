PLG_SOCIALLOGIN_FIREBASE="Akeeba Social Login - Firebase Authentication"
PLG_SOCIALLOGIN_FIREBASE_DESCRIPTION="Allows logging into your site using Firebase Authentication (supporting Google, Facebook, Apple, GitHub, and Microsoft sign-in)."

PLG_SOCIALLOGIN_FIREBASE_FIELD_PROJECT_ID_LABEL="Firebase Project ID"
PLG_SOCIALLOGIN_FIREBASE_FIELD_PROJECT_ID_DESC="Enter your Firebase Project ID (e.g. <code>my-project-id</code>). Found in Firebase Console Project Settings."

PLG_SOCIALLOGIN_FIREBASE_FIELD_API_KEY_LABEL="Web API Key"
PLG_SOCIALLOGIN_FIREBASE_FIELD_API_KEY_DESC="Enter the Web API Key for your Firebase project. Found in Firebase Console Project Settings."

PLG_SOCIALLOGIN_FIREBASE_FIELD_AUTH_DOMAIN_LABEL="Auth Domain"
PLG_SOCIALLOGIN_FIREBASE_FIELD_AUTH_DOMAIN_DESC="The authDomain for your Firebase app (e.g. <code>my-project-id.firebaseapp.com</code>). Defaults to [project_id].firebaseapp.com if left blank."

PLG_SOCIALLOGIN_FIREBASE_FIELD_PROVIDERS_LABEL="Enabled Sign-in Providers"
PLG_SOCIALLOGIN_FIREBASE_FIELD_PROVIDERS_DESC="Select which provider buttons to render on the login page."

PLG_SOCIALLOGIN_FIREBASE_PROVIDER_GOOGLE="Google"
PLG_SOCIALLOGIN_FIREBASE_PROVIDER_FACEBOOK="Facebook"
PLG_SOCIALLOGIN_FIREBASE_PROVIDER_PASSWORD="Email & Password"
PLG_SOCIALLOGIN_FIREBASE_PROVIDER_APPLE="Apple"
PLG_SOCIALLOGIN_FIREBASE_PROVIDER_GITHUB="GitHub"
PLG_SOCIALLOGIN_FIREBASE_PROVIDER_MICROSOFT="Microsoft"

PLG_SOCIALLOGIN_FIREBASE_BTN_GOOGLE="Sign in with Google"
PLG_SOCIALLOGIN_FIREBASE_BTN_FACEBOOK="Sign in with Facebook"
PLG_SOCIALLOGIN_FIREBASE_BTN_APPLE="Sign in with Apple"
PLG_SOCIALLOGIN_FIREBASE_BTN_GITHUB="Sign in with GitHub"
PLG_SOCIALLOGIN_FIREBASE_BTN_MICROSOFT="Sign in with Microsoft"

PLG_SOCIALLOGIN_FIREBASE_LOGIN_LABEL="Sign in with Firebase"
PLG_SOCIALLOGIN_FIREBASE_LOGIN_DESC="Sign in using your Google, Facebook, or email account via Firebase."

PLG_SOCIALLOGIN_FIREBASE_ERROR_NO_TOKEN="No Firebase ID token was provided."
PLG_SOCIALLOGIN_FIREBASE_ERROR_NOT_LOGGED_IN_FB="You are not logged into your Firebase account or cancelled authentication."
PLG_SOCIALLOGIN_FIREBASE_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Your account on this site is disabled or not activated."
PLG_SOCIALLOGIN_FIREBASE_ERROR_LOCAL_NOT_FOUND="You do not have an account on this site that corresponds to this Firebase account."
PLG_SOCIALLOGIN_FIREBASE_ERROR_LOCAL_USERNAME_CONFLICT="An account with the same email address as your Firebase account already exists on this site. Please log into your site account and link your Firebase account, or enable 'Allow social login to non-linked accounts' in plugin settings."
PLG_SOCIALLOGIN_FIREBASE_ERROR_CANNOT_CREATE="Could not create a new user on our site: %s"
PLG_SOCIALLOGIN_FIREBASE_NOTICE_USERACTIVATE="Your email address needs to be verified before logging in to this site. An email has been sent to you with instructions. After following these instructions please come back here and retry logging in to this site using Firebase."
PLG_SOCIALLOGIN_FIREBASE_NOTICE_ADMINACTIVATE="Your account needs to be reviewed by an administrator. When the review process is complete you will receive a confirmation email. After receiving that email please come back here and retry logging in to this site using Firebase."

PLG_SOCIALLOGIN_FIREBASE_FIELD_LOGINUNLINKED_LABEL="Allow social login to non-linked accounts"
PLG_SOCIALLOGIN_FIREBASE_FIELD_LOGINUNLINKED_DESC="When enabled allows users to log in despite not having linked their Firebase account to their site user account. Their Firebase account's email address must be the same as the email account they use on your site."

PLG_SOCIALLOGIN_FIREBASE_FIELD_CREATENEW_LABEL="Create new user accounts"
PLG_SOCIALLOGIN_FIREBASE_FIELD_CREATENEW_DESC="Creates a new Joomla! user when a user tries to log in via Firebase Authentication but there is no Joomla! user account associated with that email. If user registration is disabled no account will be created and an error will be raised. Set this to No to prevent creation of user accounts through Firebase login."

PLG_SOCIALLOGIN_FIREBASE_FIELD_FORCENEW_LABEL="Ignore Joomla! setting for creating user accounts"
PLG_SOCIALLOGIN_FIREBASE_FIELD_FORCENEW_DESC="When both this option and the 'Create new user accounts' option above are enabled a new user will always be created, even if you have disabled user registration in Joomla's Users configuration."

PLG_SOCIALLOGIN_FIREBASE_FIELD_BYPASSVALIDATION_LABEL="Bypass user validation for Firebase users"
PLG_SOCIALLOGIN_FIREBASE_FIELD_BYPASSVALIDATION_DESC="Only applies when creating new user accounts. When this option is enabled, the new Joomla! user will be created active, without requiring Joomla! email activation, because the email is already verified by Firebase."

PLG_SOCIALLOGIN_FIREBASE_FIELD_CUSTOMCSS_LABEL="Button styling"
PLG_SOCIALLOGIN_FIREBASE_FIELD_CUSTOMCSS_DESC="When enabled custom CSS for login button styling will be output to the page header."

PLG_SOCIALLOGIN_FIREBASE_FIELD_FGCOLOR_LABEL="Button foreground colour"
PLG_SOCIALLOGIN_FIREBASE_FIELD_FGCOLOR_DESC="The foreground (text) colour for the buttons created with this plugin."

PLG_SOCIALLOGIN_FIREBASE_FIELD_BGCOLOR_LABEL="Button background colour"
PLG_SOCIALLOGIN_FIREBASE_FIELD_BGCOLOR_DESC="The background colour for the buttons created with this plugin."

PLG_SOCIALLOGIN_FIREBASE_FIELD_ENABLEDAPPLICATIONS_LABEL="Login buttons can be shown in"
PLG_SOCIALLOGIN_FIREBASE_FIELD_ENABLEDAPPLICATIONS_DESC="In which part(s) of your site do you want to allow showing the Social Login buttons?"
PLG_SOCIALLOGIN_FIREBASE_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_FIREBASE_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_FIREBASE_FIELD_ENABLEDAPPLICATIONS_BOTH="Both"
