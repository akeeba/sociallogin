PLG_SOCIALLOGIN_GITHUB="Akeeba Social Login - integración con GitHub"
PLG_SOCIALLOGIN_GITHUB_DESCRIPTION="Permite el inicio de sesión social con cuentas de GitHub."

PLG_SOCIALLOGIN_GITHUB_LOGIN_LABEL="Iniciar sesión con GitHub"
PLG_SOCIALLOGIN_GITHUB_LOGIN_DESC="Inicie sesión con su cuenta de GitHub. Se creará una nueva cuenta si no existe ninguna cuenta coincidente en nuestro sitio."

PLG_SOCIALLOGIN_GITHUB_LINK_LABEL="Vincular GitHub"
PLG_SOCIALLOGIN_GITHUB_LINK_DESC="Vincula su usuario en este sitio con su cuenta de GitHub. Luego podrá usar su cuenta de GitHub para iniciar sesión en este sitio."

PLG_SOCIALLOGIN_GITHUB_UNLINK_LABEL="Desvincular GitHub"
PLG_SOCIALLOGIN_GITHUB_UNLINK_DESC="Desvincula su usuario en este sitio de su cuenta de GitHub."

PLG_SOCIALLOGIN_GITHUB_FIELD_APPID_LABEL="Client ID de GitHub"
PLG_SOCIALLOGIN_GITHUB_FIELD_APPID_DESC="Introduzca aquí el Client ID de su aplicación OAuth de GitHub. Esto es necesario para habilitar el inicio de sesión social con GitHub. Puede crear una aplicación de GitHub a través de la página de Configuración de su usuario u organización de GitHub."

PLG_SOCIALLOGIN_GITHUB_FIELD_APPSECRET_LABEL="Client Secret de GitHub"
PLG_SOCIALLOGIN_GITHUB_FIELD_APPSECRET_DESC="Introduzca aquí el Client Secret de su aplicación OAuth de GitHub. Esto es necesario para habilitar el inicio de sesión social con GitHub. Puede crear una aplicación de GitHub a través de la página de Configuración de su usuario u organización de GitHub."

PLG_SOCIALLOGIN_GITHUB_FIELD_LOGINUNLINKED_LABEL="Permitir el inicio de sesión social en cuentas no vinculadas"
PLG_SOCIALLOGIN_GITHUB_FIELD_LOGINUNLINKED_DESC="Cuando está habilitado, permite a los usuarios iniciar sesión aunque no hayan vinculado su cuenta de GitHub a su cuenta de usuario del sitio. La dirección de correo electrónico de su cuenta de GitHub debe ser la misma que la cuenta de correo que usan en su sitio y debe ser visible públicamente."

PLG_SOCIALLOGIN_GITHUB_FIELD_CREATENEW_LABEL="Crear nuevas cuentas de usuario"
PLG_SOCIALLOGIN_GITHUB_FIELD_CREATENEW_DESC="Crea un nuevo usuario de Joomla! cuando un usuario intenta iniciar sesión a través de GitHub pero no existe ninguna cuenta de usuario de Joomla! asociada con ese correo electrónico o ID de usuario de GitHub. Si el registro de usuarios está deshabilitado, no se creará ninguna cuenta y se mostrará un error. La cuenta de GitHub del usuario debe tener una dirección de correo electrónico visible públicamente. El nuevo usuario de Joomla! tendrá un nombre de usuario derivado del inicio de sesión de GitHub, la misma dirección de correo electrónico que la cuenta de GitHub y una contraseña larga y aleatoria (que el usuario puede cambiar una vez que haya iniciado sesión). Establezca esto en No para evitar la creación de cuentas de usuario a través del inicio de sesión de GitHub."

PLG_SOCIALLOGIN_GITHUB_FIELD_FORCENEW_LABEL="Ignorar la configuración de Joomla! para crear cuentas de usuario"
PLG_SOCIALLOGIN_GITHUB_FIELD_FORCENEW_DESC="Cuando tanto esta opción como la opción «Crear nuevas cuentas de usuario» anterior están habilitadas, siempre se creará un nuevo usuario, incluso si ha deshabilitado el registro de usuarios en las opciones de la página Usuarios de Joomla. Esto es útil para evitar que alguien se registre en su sitio <em>a menos que</em> tenga una cuenta de GitHub."

PLG_SOCIALLOGIN_GITHUB_FIELD_BYPASSVALIDATION_LABEL="Omitir la validación de usuario para usuarios de GitHub"
PLG_SOCIALLOGIN_GITHUB_FIELD_BYPASSVALIDATION_DESC="Solo se aplica al crear nuevas cuentas de usuario. Cuando esta opción está habilitada, el nuevo usuario de Joomla! se creará activo, sin pasar por la validación de cuenta de usuario de Joomla!. Esto significa que no se enviará ningún correo electrónico de activación de cuenta al usuario ni a los administradores del sitio Joomla!. Esto es seguro porque GitHub solo permite a los usuarios con una dirección de correo electrónico verificada usar su cuenta de GitHub para iniciar sesión en sitios externos."

PLG_SOCIALLOGIN_GITHUB_FIELD_CUSTOMCSS_LABEL="Estilo del botón"
PLG_SOCIALLOGIN_GITHUB_FIELD_CUSTOMCSS_DESC="Cuando está habilitado, se generará CSS personalizado para el estilo de los botones de inicio de sesión, vinculación y desvinculación en el encabezado de la página. Deshabilite esta opción si pretende usar su propio CSS para dar estilo a los botones."

PLG_SOCIALLOGIN_GITHUB_FIELD_FGCOLOR_LABEL="Color de primer plano del botón"
PLG_SOCIALLOGIN_GITHUB_FIELD_FGCOLOR_DESC="El color de primer plano (texto) para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_GITHUB_FIELD_BGCOLOR_LABEL="Color de fondo del botón"
PLG_SOCIALLOGIN_GITHUB_FIELD_BGCOLOR_DESC="El color de fondo para los botones de inicio de sesión, vinculación y desvinculación creados con este plugin. Predeterminado: <code>#000000</code>"

PLG_SOCIALLOGIN_GITHUB_ERROR_NOT_LOGGED_IN_FB="No ha iniciado sesión en GitHub o no ha concedido permisos para que este sitio le autentique a través de GitHub."
PLG_SOCIALLOGIN_GITHUB_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Su cuenta en este sitio está deshabilitada o no está activada."
PLG_SOCIALLOGIN_GITHUB_ERROR_LOCAL_NOT_FOUND="No tiene una cuenta en este sitio que corresponda a esta cuenta de GitHub, o ha elegido no compartir su dirección de correo electrónico en su perfil público de GitHub (esto significa que no podemos identificarle)."
PLG_SOCIALLOGIN_GITHUB_ERROR_LOCAL_USERNAME_CONFLICT="Ya existe una cuenta en este sitio con el mismo nombre de usuario o dirección de correo electrónico que su cuenta de GitHub, o ha elegido no compartir su dirección de correo electrónico en su perfil público de GitHub (esto significa que no podemos identificarle). Por favor, inicie sesión en su cuenta en este sitio y luego vincule su cuenta de GitHub. Si no recuerda tener una cuenta de usuario, cree primero una nueva."
PLG_SOCIALLOGIN_GITHUB_ERROR_CANNOT_CREATE="No se pudo crear un nuevo usuario en nuestro sitio: %s"

PLG_SOCIALLOGIN_GITHUB_NOTICE_USERACTIVATE="Su dirección de correo electrónico debe verificarse antes de iniciar sesión en este sitio. Se le ha enviado un correo electrónico con instrucciones. Tras seguir estas instrucciones, vuelva aquí e intente iniciar sesión en este sitio usando GitHub."
PLG_SOCIALLOGIN_GITHUB_NOTICE_ADMINACTIVATE="Un administrador debe revisar su cuenta. Cuando el proceso de revisión se complete, recibirá un correo electrónico de confirmación. Tras recibir ese correo electrónico, vuelva aquí e intente iniciar sesión en este sitio usando GitHub."

PLG_SOCIALLOGIN_GITHUB_FIELD_ENABLEDAPPLICATIONS_LABEL="Los botones de inicio de sesión se pueden mostrar en"
PLG_SOCIALLOGIN_GITHUB_FIELD_ENABLEDAPPLICATIONS_DESC="¿En qué parte(s) de su sitio desea permitir mostrar los botones de Social Login? <br/> <strong>¡PELIGRO!</strong> Si el único método de inicio de sesión de un usuario es SocialLogin, elegir cualquier opción que no sea Ambos resultará en que quede efectivamente bloqueado de la otra parte de su sitio."
PLG_SOCIALLOGIN_GITHUB_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_GITHUB_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_GITHUB_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
