PLG_SOCIALLOGIN_YAHOO = "Akeeba Social Login - Yahoo Integration"
PLG_SOCIALLOGIN_YAHOO_DESCRIPTION = "Ermöglicht die Anmeldung mit Yahoo-Konten."
PLG_SOCIALLOGIN_YAHOO_LOGIN_LABEL = "Mit Yahoo anmelden"
PLG_SOCIALLOGIN_YAHOO_LOGIN_DESC = "Melden Sie sich mit Ihrem Yahoo-Konto an. Ein neues Konto wird erstellt, wenn kein übereinstimmendes Konto auf unserer Website vorhanden ist."
PLG_SOCIALLOGIN_YAHOO_LINK_LABEL = "Yahoo verknüpfen"
PLG_SOCIALLOGIN_YAHOO_LINK_DESC = "Verknüpft Ihren Benutzer auf dieser Website mit Ihrem Yahoo-Konto. Sie können sich dann mit Ihrem Yahoo-Konto auf dieser Website anmelden."
PLG_SOCIALLOGIN_YAHOO_UNLINK_LABEL = "Yahoo-Verknüpfung aufheben"
PLG_SOCIALLOGIN_YAHOO_UNLINK_DESC = "Hebt die Verknüpfung Ihres Benutzers auf dieser Website mit Ihrem Yahoo-Konto auf."
PLG_SOCIALLOGIN_YAHOO_FIELD_APPID_LABEL = "Yahoo Client ID"
PLG_SOCIALLOGIN_YAHOO_FIELD_APPID_DESC = "Geben Sie hier die Client ID für Ihre Yahoo OAuth2-Anwendung ein. Dies ist erforderlich, um die Anmeldung mit Yahoo zu aktivieren. Sie können eine Yahoo OAuth2-App kostenlos im <a href='https://developer.yahoo.com'>Yahoo-Entwicklerportal</a> erstellen."
PLG_SOCIALLOGIN_YAHOO_FIELD_APPSECRET_LABEL = "Yahoo Client Secret"
PLG_SOCIALLOGIN_YAHOO_FIELD_APPSECRET_DESC = "Geben Sie hier das Client Secret für Ihre Yahoo OAuth2-Anwendung ein. Dies ist erforderlich, um die Anmeldung mit Yahoo zu aktivieren. Sie können eine Yahoo OAuth2-App kostenlos im <a href='https://developer.yahoo.com'>Yahoo-Entwicklerportal</a> erstellen."
PLG_SOCIALLOGIN_YAHOO_FIELD_LOGINUNLINKED_LABEL = "Social-Login für nicht verknüpfte Konten erlauben"
PLG_SOCIALLOGIN_YAHOO_FIELD_LOGINUNLINKED_DESC = "Wenn aktiviert, können sich Benutzer anmelden, auch wenn ihr Yahoo-Konto nicht mit ihrem Website-Benutzerkonto verknüpft ist. Die E-Mail-Adresse des Yahoo-Kontos muss mit der E-Mail-Adresse übereinstimmen, die auf Ihrer Website verwendet wird, und sie muss öffentlich sichtbar sein."
PLG_SOCIALLOGIN_YAHOO_FIELD_CREATENEW_LABEL = "Neue Benutzerkonten erstellen"
PLG_SOCIALLOGIN_YAHOO_FIELD_CREATENEW_DESC = "Erstellt einen neuen Joomla!-Benutzer, wenn sich ein Benutzer über Yahoo anmelden möchte, aber kein Joomla!-Benutzerkonto mit dieser E-Mail-Adresse oder Yahoo-Benutzer-ID verknüpft ist. Wenn die Benutzerregistrierung deaktiviert ist, wird kein Konto erstellt und ein Fehler ausgegeben. Das Yahoo-Konto des Benutzers muss eine öffentlich sichtbare E-Mail-Adresse haben. Der neue Joomla!-Benutzer erhält einen aus dem Yahoo-Login abgeleiteten Benutzernamen, dieselbe E-Mail-Adresse wie das Yahoo-Konto und ein langes, zufälliges Passwort (das der Benutzer nach der Anmeldung ändern kann). Setzen Sie dies auf Nein, um die Erstellung von Benutzerkonten über die Yahoo-Anmeldung zu verhindern."
PLG_SOCIALLOGIN_YAHOO_FIELD_FORCENEW_LABEL = "Joomla!-Einstellung zur Benutzerkontenerstellung ignorieren"
PLG_SOCIALLOGIN_YAHOO_FIELD_FORCENEW_DESC = "Wenn sowohl diese Option als auch die obige Option „Neue Benutzerkonten erstellen" aktiviert sind, wird immer ein neuer Benutzer erstellt, auch wenn Sie die Benutzerregistrierung in den Optionen der Joomla!-Benutzerseite deaktiviert haben. Dies ist nützlich, um zu verhindern, dass sich jemand auf Ihrer Website registriert, <em>es sei denn</em>, er hat ein Yahoo-Konto."
PLG_SOCIALLOGIN_YAHOO_FIELD_BYPASSVALIDATION_LABEL = "Benutzervalidierung für Yahoo-Benutzer überspringen"
PLG_SOCIALLOGIN_YAHOO_FIELD_BYPASSVALIDATION_DESC = "Gilt nur beim Erstellen neuer Benutzerkonten. Wenn diese Option aktiviert ist, wird der neue Joomla!-Benutzer ohne die Joomla!-Benutzerkonto-Validierung aktiv erstellt. Das bedeutet, dass keine Konto-Aktivierungs-E-Mail an den Benutzer oder die Administratoren der Joomla!-Website gesendet wird. Dies ist sicher, da Yahoo nur Benutzern mit einer verifizierten E-Mail-Adresse erlaubt, ihr Yahoo-Konto zur Anmeldung auf externen Websites zu verwenden."
PLG_SOCIALLOGIN_YAHOO_FIELD_CUSTOMCSS_LABEL = "Schaltflächenstil"
PLG_SOCIALLOGIN_YAHOO_FIELD_CUSTOMCSS_DESC = "Wenn aktiviert, wird benutzerdefiniertes CSS für die Gestaltung der Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen in den Seitenkopf ausgegeben. Deaktivieren Sie diese Option, wenn Sie Ihr eigenes CSS zur Gestaltung der Schaltflächen verwenden möchten."
PLG_SOCIALLOGIN_YAHOO_FIELD_FGCOLOR_LABEL = "Vordergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_YAHOO_FIELD_FGCOLOR_DESC = "Die Vordergrundfarbe (Text) für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#FFFFFF</code>"
PLG_SOCIALLOGIN_YAHOO_FIELD_BGCOLOR_LABEL = "Hintergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_YAHOO_FIELD_BGCOLOR_DESC = "Die Hintergrundfarbe für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#000000</code>"
PLG_SOCIALLOGIN_YAHOO_ERROR_NOT_LOGGED_IN_FB = "Sie sind nicht bei Yahoo angemeldet oder haben dieser Website keine Berechtigungen erteilt, Sie über Yahoo anzumelden."
PLG_SOCIALLOGIN_YAHOO_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED = "Ihr Konto auf dieser Website ist deaktiviert oder noch nicht aktiviert."
PLG_SOCIALLOGIN_YAHOO_ERROR_LOCAL_NOT_FOUND = "Sie haben kein Konto auf dieser Website, das diesem Yahoo-Konto entspricht; oder Sie haben sich entschieden, Ihre E-Mail-Adresse in Ihrem öffentlichen Yahoo-Profil nicht zu teilen (dadurch können wir Sie nicht identifizieren)."
PLG_SOCIALLOGIN_YAHOO_ERROR_LOCAL_USERNAME_CONFLICT = "Auf dieser Website existiert bereits ein Konto mit demselben Benutzernamen oder derselben E-Mail-Adresse wie Ihr Yahoo-Konto; oder Sie haben sich entschieden, Ihre E-Mail-Adresse in Ihrem öffentlichen Yahoo-Profil nicht zu teilen (dadurch können wir Sie nicht identifizieren). Bitte melden Sie sich bei Ihrem Konto auf dieser Website an und verknüpfen Sie dann Ihr Yahoo-Konto damit. Wenn Sie sich nicht erinnern, bereits ein Benutzerkonto zu haben, erstellen Sie bitte zuerst ein neues."
PLG_SOCIALLOGIN_YAHOO_ERROR_CANNOT_CREATE = "Es konnte kein neuer Benutzer auf unserer Website erstellt werden: %s"
PLG_SOCIALLOGIN_YAHOO_NOTICE_USERACTIVATE = "Ihre E-Mail-Adresse muss verifiziert werden, bevor Sie sich auf dieser Website anmelden können. Eine E-Mail mit Anweisungen wurde an Sie gesendet. Nachdem Sie diesen Anweisungen gefolgt sind, kehren Sie bitte hierher zurück und versuchen Sie erneut, sich mit Yahoo auf dieser Website anzumelden."
PLG_SOCIALLOGIN_YAHOO_NOTICE_ADMINACTIVATE = "Ihr Konto muss von einem Administrator überprüft werden. Wenn der Überprüfungsprozess abgeschlossen ist, erhalten Sie eine Bestätigungs-E-Mail. Kehren Sie nach Erhalt dieser E-Mail hierher zurück und versuchen Sie erneut, sich mit Yahoo auf dieser Website anzumelden."

PLG_SOCIALLOGIN_YAHOO_FIELD_ENABLEDAPPLICATIONS_LABEL="Anmelde-Schaltflächen können angezeigt werden in"
PLG_SOCIALLOGIN_YAHOO_FIELD_ENABLEDAPPLICATIONS_DESC="In welchem Teil/welchen Teilen Ihrer Website möchten Sie das Anzeigen der Social-Login-Schaltflächen erlauben? <br/> <strong>ACHTUNG!</strong> Wenn die einzige Anmeldemethode eines Benutzers SocialLogin ist, führt die Auswahl einer anderen Option als „Beide" dazu, dass der Benutzer im anderen Teil Ihrer Website praktisch ausgesperrt ist."
PLG_SOCIALLOGIN_YAHOO_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_YAHOO_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_YAHOO_FIELD_ENABLEDAPPLICATIONS_BOTH="Beide"
