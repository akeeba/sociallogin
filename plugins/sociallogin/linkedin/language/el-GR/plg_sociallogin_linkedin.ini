PLG_SOCIALLOGIN_LINKEDIN="Akeeba Social Login - Ενσωμάτωση LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_DESCRIPTION="Επιτρέπει την κοινωνική σύνδεση με λογαριασμούς LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_LOGIN_LABEL="Σύνδεση με LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_LOGIN_DESC="Συνδεθείτε με τον λογαριασμό σας LinkedIn. Θα δημιουργηθεί νέος λογαριασμός εάν δεν υπάρχει αντίστοιχος λογαριασμός στον ιστότοπό μας."

PLG_SOCIALLOGIN_LINKEDIN_LINK_LABEL="Σύνδεση LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_LINK_DESC="Συνδέει τον χρήστη σας σε αυτόν τον ιστότοπο με τον λογαριασμό σας LinkedIn. Μπορείτε έπειτα να χρησιμοποιείτε τον λογαριασμό σας LinkedIn για να συνδέεστε σε αυτόν τον ιστότοπο."

PLG_SOCIALLOGIN_LINKEDIN_UNLINK_LABEL="Αποσύνδεση LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_UNLINK_DESC="Αποσυνδέει τον χρήστη σας σε αυτόν τον ιστότοπο από τον λογαριασμό σας LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPID_LABEL="LinkedIn Client ID"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPID_DESC="Εισαγάγετε εδώ το Client ID για την εφαρμογή σας LinkedIn OAuth. Αυτό απαιτείται για την ενεργοποίηση της κοινωνικής σύνδεσης με LinkedIn. Μπορείτε να δημιουργήσετε εφαρμογή LinkedIn μέσω της πλατφόρμας LinkedIn Developer."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPSECRET_LABEL="LinkedIn Client Secret"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPSECRET_DESC="Εισαγάγετε εδώ το Client Secret για την εφαρμογή σας LinkedIn OAuth. Αυτό απαιτείται για την ενεργοποίηση της κοινωνικής σύνδεσης με LinkedIn. Μπορείτε να δημιουργήσετε εφαρμογή LinkedIn μέσω της πλατφόρμας LinkedIn Developer."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_LOGINUNLINKED_LABEL="Να επιτρέπεται κοινωνική σύνδεση σε μη συνδεδεμένους λογαριασμούς"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_LOGINUNLINKED_DESC="Όταν είναι ενεργοποιημένο, επιτρέπει στους χρήστες να συνδέονται παρά το γεγονός ότι δεν έχουν συνδέσει τον λογαριασμό τους LinkedIn με τον λογαριασμό χρήστη τους στον ιστότοπο. Η διεύθυνση email του λογαριασμού LinkedIn πρέπει να είναι ίδια με τη διεύθυνση email που χρησιμοποιούν στον ιστότοπό σας."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_CREATENEW_LABEL="Δημιουργία νέων λογαριασμών χρηστών"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_CREATENEW_DESC="Δημιουργεί νέο χρήστη Joomla! όταν κάποιος χρήστης προσπαθεί να συνδεθεί μέσω LinkedIn αλλά δεν υπάρχει λογαριασμός χρήστη Joomla! που να σχετίζεται με αυτό το email ή αναγνωριστικό χρήστη LinkedIn. Εάν η εγγραφή χρηστών είναι απενεργοποιημένη, δεν θα δημιουργηθεί λογαριασμός και θα εμφανιστεί σφάλμα. Ο νέος χρήστης Joomla! θα έχει όνομα χρήστη που θα προέρχεται από τη σύνδεση LinkedIn, την ίδια διεύθυνση email με τον λογαριασμό LinkedIn και έναν μακρύ, τυχαίο κωδικό πρόσβασης (τον οποίο ο χρήστης μπορεί να αλλάξει μόλις συνδεθεί). Ορίστε αυτό σε Όχι για να αποτρέψετε τη δημιουργία λογαριασμών χρηστών μέσω σύνδεσης LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_FORCENEW_LABEL="Παράβλεψη ρύθμισης Joomla! για δημιουργία λογαριασμών χρηστών"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_FORCENEW_DESC="Όταν τόσο αυτή η επιλογή όσο και η επιλογή «Δημιουργία νέων λογαριασμών χρηστών» παραπάνω είναι ενεργοποιημένες, θα δημιουργείται πάντα νέος χρήστης, ακόμη και αν έχετε απενεργοποιήσει την εγγραφή χρηστών στις επιλογές της σελίδας Χρηστών του Joomla. Αυτό είναι χρήσιμο για να αποτρέψετε οποιονδήποτε από το να εγγραφεί στον ιστότοπό σας <em>εκτός εάν</em> έχει λογαριασμό LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_BYPASSVALIDATION_LABEL="Παράκαμψη επικύρωσης χρήστη για χρήστες LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_BYPASSVALIDATION_DESC="Ισχύει μόνο κατά τη δημιουργία νέων λογαριασμών χρηστών. Όταν αυτή η επιλογή είναι ενεργοποιημένη, ο νέος χρήστης Joomla! θα δημιουργείται ενεργός, χωρίς να περνά από την επικύρωση λογαριασμού χρήστη του Joomla!. Αυτό σημαίνει ότι δεν θα αποστέλλεται email ενεργοποίησης λογαριασμού στον χρήστη ή στους διαχειριστές του ιστότοπου Joomla!. Αυτό είναι ασφαλές επειδή το LinkedIn επιτρέπει μόνο σε χρήστες με επαληθευμένη διεύθυνση email να κατέχουν λογαριασμό LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_CUSTOMCSS_LABEL="Στυλιζάρισμα κουμπιών"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_CUSTOMCSS_DESC="Όταν είναι ενεργοποιημένο, προσαρμοσμένο CSS για το στυλιζάρισμα κουμπιών σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης θα εξάγεται στην κεφαλίδα της σελίδας. Απενεργοποιήστε αυτή την επιλογή εάν σκοπεύετε να χρησιμοποιήσετε το δικό σας CSS για τα κουμπιά."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_FGCOLOR_LABEL="Χρώμα προσκηνίου κουμπιού"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_FGCOLOR_DESC="Το χρώμα προσκηνίου (κειμένου) για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_LINKEDIN_FIELD_BGCOLOR_LABEL="Χρώμα φόντου κουμπιού"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_BGCOLOR_DESC="Το χρώμα φόντου για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#3077B0</code>"

PLG_SOCIALLOGIN_LINKEDIN_ERROR_NOT_LOGGED_IN_FB="Δεν είστε συνδεδεμένοι στο LinkedIn ή δεν παραχωρήσατε άδειες για να συνδεθείτε σε αυτόν τον ιστότοπο μέσω LinkedIn."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ο λογαριασμός σας σε αυτόν τον ιστότοπο είναι απενεργοποιημένος ή δεν έχει ενεργοποιηθεί."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_LOCAL_NOT_FOUND="Δεν έχετε λογαριασμό σε αυτόν τον ιστότοπο που να αντιστοιχεί σε αυτόν τον λογαριασμό LinkedIn."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_LOCAL_USERNAME_CONFLICT="Υπάρχει ήδη λογαριασμός με το ίδιο όνομα χρήστη ή διεύθυνση email με τον λογαριασμό σας LinkedIn σε αυτόν τον ιστότοπο. Παρακαλώ συνδεθείτε στον λογαριασμό σας σε αυτόν τον ιστότοπο και στη συνέχεια συνδέστε τον λογαριασμό σας LinkedIn με αυτόν. Εάν δεν θυμάστε να έχετε λογαριασμό χρήστη, παρακαλώ δημιουργήστε πρώτα έναν νέο."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_CANNOT_CREATE="Δεν ήταν δυνατή η δημιουργία νέου χρήστη στον ιστότοπό μας: %s"

PLG_SOCIALLOGIN_LINKEDIN_NOTICE_USERACTIVATE="Η διεύθυνση email σας πρέπει να επαληθευτεί πριν από τη σύνδεση σε αυτόν τον ιστότοπο. Σας έχει αποσταλεί email με οδηγίες. Αφού ακολουθήσετε αυτές τις οδηγίες, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας LinkedIn."
PLG_SOCIALLOGIN_LINKEDIN_NOTICE_ADMINACTIVATE="Ο λογαριασμός σας πρέπει να ελεγχθεί από έναν διαχειριστή. Όταν ολοκληρωθεί η διαδικασία ελέγχου, θα λάβετε email επιβεβαίωσης. Αφού λάβετε αυτό το email, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_LABEL="Τα κουμπιά σύνδεσης μπορούν να εμφανιστούν σε"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_DESC="Σε ποιο τμήμα (τμήματα) του ιστότοπού σας θέλετε να επιτρέπεται η εμφάνιση των κουμπιών κοινωνικής σύνδεσης; <br/> <strong>ΚΙΝΔΥΝΟΣ!</strong> Εάν η μόνη μέθοδος σύνδεσης ενός χρήστη είναι το SocialLogin, η επιλογή οποιασδήποτε επιλογής εκτός από Και τα δύο θα έχει ως αποτέλεσμα να αποκλειστεί ουσιαστικά από το άλλο τμήμα του ιστότοπού σας."
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_SITE="Εμπρόσθιο τμήμα"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_ADMIN="Διαχειριστικό τμήμα"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_BOTH="Και τα δύο"
