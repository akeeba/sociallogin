PLG_SOCIALLOGIN_LINKEDIN="Akeeba Social Login - integração com LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_DESCRIPTION="Permite o início de sessão social com contas LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_LOGIN_LABEL="Iniciar sessão com LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_LOGIN_DESC="Inicie sessão com a sua conta LinkedIn. Será criada uma nova conta se não existir nenhuma conta correspondente no nosso site."

PLG_SOCIALLOGIN_LINKEDIN_LINK_LABEL="Vincular LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_LINK_DESC="Vincula o seu utilizador neste site à sua conta LinkedIn. Poderá então utilizar a sua conta LinkedIn para iniciar sessão neste site."

PLG_SOCIALLOGIN_LINKEDIN_UNLINK_LABEL="Desvincular LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_UNLINK_DESC="Desvincula o seu utilizador neste site da sua conta LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPID_LABEL="LinkedIn Client ID"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPID_DESC="Introduza aqui o Client ID da sua aplicação LinkedIn OAuth. Isto é necessário para ativar o início de sessão social com LinkedIn. Pode criar uma aplicação LinkedIn através da plataforma LinkedIn Developer."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPSECRET_LABEL="LinkedIn Client Secret"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_APPSECRET_DESC="Introduza aqui o Client Secret da sua aplicação LinkedIn OAuth. Isto é necessário para ativar o início de sessão social com LinkedIn. Pode criar uma aplicação LinkedIn através da plataforma LinkedIn Developer."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_LOGINUNLINKED_LABEL="Permitir início de sessão social em contas não vinculadas"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_LOGINUNLINKED_DESC="Quando ativado, permite que os utilizadores iniciem sessão sem terem vinculado a sua conta LinkedIn à sua conta de utilizador no site. O endereço de correio eletrónico da conta LinkedIn deve ser o mesmo que utilizam no seu site."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_CREATENEW_LABEL="Criar novas contas de utilizador"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_CREATENEW_DESC="Cria um novo utilizador no Joomla! quando um utilizador tenta iniciar sessão via LinkedIn mas não existe nenhuma conta de utilizador do Joomla! associada a esse endereço de correio eletrónico ou ID de utilizador LinkedIn. Se o registo de utilizadores estiver desativado, nenhuma conta será criada e será gerado um erro. O novo utilizador do Joomla! terá um nome de utilizador derivado do início de sessão LinkedIn, o mesmo endereço de correio eletrónico que a conta LinkedIn e uma palavra-passe longa e aleatória (que o utilizador pode alterar após iniciar sessão). Defina como Não para impedir a criação de contas de utilizador através do início de sessão LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_FORCENEW_LABEL="Ignorar definição do Joomla! para criação de contas de utilizador"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_FORCENEW_DESC="Quando esta opção e a opção 'Criar novas contas de utilizador' acima estiverem ativadas, será sempre criado um novo utilizador, mesmo que tenha desativado o registo de utilizadores nas opções da página de Utilizadores do Joomla!. Isto é útil para impedir que qualquer pessoa se registe no seu site <em>exceto</em> se tiver uma conta LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_BYPASSVALIDATION_LABEL="Ignorar validação de utilizador para utilizadores LinkedIn"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_BYPASSVALIDATION_DESC="Aplica-se apenas ao criar novas contas de utilizador. Quando esta opção está ativada, o novo utilizador do Joomla! será criado como ativo, sem passar pelo processo de validação de conta de utilizador do Joomla!. Isto significa que não será enviado nenhum e-mail de ativação de conta ao utilizador ou aos administradores do site Joomla!. Isto é seguro porque o LinkedIn apenas permite que utilizadores com um endereço de correio eletrónico verificado possuam uma conta LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_CUSTOMCSS_LABEL="Estilo dos botões"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_CUSTOMCSS_DESC="Quando ativado, o CSS personalizado para o estilo dos botões de início de sessão, vinculação e desvinculação será incluído no cabeçalho da página. Desative esta opção se pretender utilizar o seu próprio CSS para estilizar os botões."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_FGCOLOR_LABEL="Cor de primeiro plano do botão"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_FGCOLOR_DESC="A cor de primeiro plano (texto) para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_LINKEDIN_FIELD_BGCOLOR_LABEL="Cor de fundo do botão"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_BGCOLOR_DESC="A cor de fundo para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#3077B0</code>"

PLG_SOCIALLOGIN_LINKEDIN_ERROR_NOT_LOGGED_IN_FB="Não tem sessão iniciada no LinkedIn ou não concedeu permissões para este site iniciar sessão através do LinkedIn."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="A sua conta neste site está desativada ou não foi ativada."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_LOCAL_NOT_FOUND="Não tem uma conta neste site que corresponda a esta conta LinkedIn."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_LOCAL_USERNAME_CONFLICT="Já existe uma conta neste site com o mesmo nome de utilizador ou endereço de correio eletrónico que a sua conta LinkedIn. Por favor inicie sessão na sua conta neste site e depois vincule a sua conta LinkedIn. Se não se lembrar de ter uma conta de utilizador, por favor crie uma nova primeiro."
PLG_SOCIALLOGIN_LINKEDIN_ERROR_CANNOT_CREATE="Não foi possível criar um novo utilizador no nosso site: %s"

PLG_SOCIALLOGIN_LINKEDIN_NOTICE_USERACTIVATE="O seu endereço de correio eletrónico precisa de ser verificado antes de iniciar sessão neste site. Foi-lhe enviado um e-mail com instruções. Após seguir essas instruções, volte aqui e tente novamente iniciar sessão neste site utilizando LinkedIn."
PLG_SOCIALLOGIN_LINKEDIN_NOTICE_ADMINACTIVATE="A sua conta precisa de ser revista por um administrador. Quando o processo de revisão estiver concluído, receberá um e-mail de confirmação. Após receber esse e-mail, volte aqui e tente novamente iniciar sessão neste site utilizando LinkedIn."

PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_LABEL="Os botões de início de sessão podem ser mostrados em"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_DESC="Em que parte(s) do seu site pretende permitir a apresentação dos botões de Início de Sessão Social? <br/> <strong>ATENÇÃO!</strong> Se o único método de início de sessão de um utilizador for o SocialLogin, escolher qualquer opção que não seja Ambos resultará no bloqueio efetivo do acesso à outra parte do seu site."
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_LINKEDIN_FIELD_ENABLEDAPPLICATIONS_BOTH="Ambos"
