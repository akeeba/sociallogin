PLG_SOCIALLOGIN_SPOTIFY_ERROR_LOCAL_NOT_FOUND = "Non hai un account su questo sito corrispondente a questo account Spotify; oppure hai scelto di non condividere il tuo indirizzo email nel tuo profilo Spotify pubblico (questo ci impedisce di identificarti)."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_LOCAL_USERNAME_CONFLICT = "Esiste già un account con lo stesso nome utente o indirizzo email del tuo account Spotify su questo sito; oppure hai scelto di non condividere il tuo indirizzo email nel tuo profilo Spotify pubblico (questo ci impedisce di identificarti). Accedi al tuo account su questo sito e poi collega il tuo account Spotify. Se non ricordi di avere un account utente, creane prima uno nuovo."
