PLG_SOCIALLOGIN_SPOTIFY = "Akeeba Social Login - integrazione Spotify"
PLG_SOCIALLOGIN_SPOTIFY_DESCRIPTION = "🚨🚨🚨 DEPRECATO – NON USARE 🚨🚨🚨 Consente l'accesso social con account Spotify. Spotify ha annunciato che a partire dal 6 marzo 2026 non consentirà più di 5 account collegati a ciascuna applicazione, rendendola inadatta all'uso con SocialLogin. Questa integrazione verrà rimossa dopo il 6 giugno 2026."
PLG_SOCIALLOGIN_SPOTIFY_LOGIN_LABEL = "Accedi con Spotify"
PLG_SOCIALLOGIN_SPOTIFY_LOGIN_DESC = "Accedi con il tuo account Spotify. Se non esiste un account corrispondente sul nostro sito, ne verrà creato uno nuovo."
PLG_SOCIALLOGIN_SPOTIFY_LINK_LABEL = "Collega Spotify"
PLG_SOCIALLOGIN_SPOTIFY_LINK_DESC = "Collega il tuo utente su questo sito al tuo account Spotify. Potrai quindi usare il tuo account Spotify per accedere a questo sito."
PLG_SOCIALLOGIN_SPOTIFY_UNLINK_LABEL = "Scollega Spotify"
PLG_SOCIALLOGIN_SPOTIFY_UNLINK_DESC = "Scollega il tuo utente su questo sito dal tuo account Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPID_LABEL = "Spotify Client ID"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPID_DESC = "Inserisci qui il Client ID della tua applicazione Spotify OAuth2. Questo è necessario per abilitare l'accesso social con Spotify. Puoi creare gratuitamente un'app Spotify OAuth2 sul <a href='https://developer.spotify.com'>portale per sviluppatori Spotify</a>."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPSECRET_LABEL = "Spotify Client Secret"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPSECRET_DESC = "Inserisci qui il Client Secret della tua applicazione Spotify OAuth2. Questo è necessario per abilitare l'accesso social con Spotify. Puoi creare gratuitamente un'app Spotify OAuth2 sul <a href='https://developer.spotify.com'>portale per sviluppatori Spotify</a>."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_LOGINUNLINKED_LABEL = "Consenti accesso social ad account non collegati"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_LOGINUNLINKED_DESC = "Se abilitato, consente agli utenti di accedere anche senza aver collegato il proprio account Spotify all'account utente del sito. L'indirizzo email dell'account Spotify deve essere lo stesso dell'account email utilizzato sul tuo sito e deve essere visibile pubblicamente."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CREATENEW_LABEL = "Crea nuovi account utente"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CREATENEW_DESC = "Crea un nuovo utente Joomla! quando un utente tenta di accedere tramite Spotify ma non esiste un account utente Joomla! associato a quell'email o ID utente Spotify. Se la registrazione utenti è disabilitata, non verrà creato nessun account e verrà generato un errore. L'account Spotify dell'utente deve avere un indirizzo email visibile pubblicamente. Il nuovo utente Joomla! avrà un nome utente derivato dall'accesso Spotify, lo stesso indirizzo email dell'account Spotify e una password lunga e casuale (che l'utente può modificare dopo aver effettuato l'accesso). Imposta su No per impedire la creazione di account utente tramite l'accesso Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FORCENEW_LABEL = "Ignora l'impostazione di Joomla! per la creazione di account utente"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FORCENEW_DESC = "Quando sia questa opzione che l'opzione 'Crea nuovi account utente' qui sopra sono abilitate, verrà sempre creato un nuovo utente, anche se hai disabilitato la registrazione utenti nelle opzioni della pagina Utenti di Joomla!. Questo è utile per impedire a chiunque di registrarsi al tuo sito <em>a meno che</em> non disponga di un account Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BYPASSVALIDATION_LABEL = "Salta la validazione utente per gli utenti Spotify"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BYPASSVALIDATION_DESC = "Si applica solo alla creazione di nuovi account utente. Quando questa opzione è abilitata, il nuovo utente Joomla! verrà creato come attivo, senza passare per la validazione dell'account utente Joomla!. Ciò significa che non verrà inviata nessuna email di attivazione dell'account all'utente o agli amministratori del sito Joomla!. Questo è sicuro perché Spotify consente solo agli utenti con un indirizzo email verificato di usare il proprio account Spotify per accedere a siti esterni."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CUSTOMCSS_LABEL = "Stile dei pulsanti"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CUSTOMCSS_DESC = "Se abilitato, verrà inserito nell'intestazione della pagina il CSS personalizzato per lo stile dei pulsanti di accesso, collegamento e scollegamento. Disabilita questa opzione se intendi usare il tuo CSS per personalizzare i pulsanti."
