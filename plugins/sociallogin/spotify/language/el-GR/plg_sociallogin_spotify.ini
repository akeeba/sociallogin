PLG_SOCIALLOGIN_SPOTIFY = "Akeeba Social Login - Ενσωμάτωση Spotify"
PLG_SOCIALLOGIN_SPOTIFY_DESCRIPTION = "🚨🚨🚨 ΑΠΟΣΥΡΘΗΚΕ – ΜΗΝ ΧΡΗΣΙΜΟΠΟΙΕΙΤΕ 🚨🚨🚨 Επιτρέπει την κοινωνική σύνδεση με λογαριασμούς Spotify. Το Spotify ανακοίνωσε ότι από τις 6 Μαρτίου 2026 δεν θα επιτρέπει πλέον σύνδεση περισσότερων από 5 λογαριασμών με κάθε εφαρμογή, καθιστώντας το ακατάλληλο για χρήση με το SocialLogin. Αυτή η ενσωμάτωση θα αφαιρεθεί μετά τις 6 Ιουνίου 2026."
PLG_SOCIALLOGIN_SPOTIFY_LOGIN_LABEL = "Σύνδεση με Spotify"
PLG_SOCIALLOGIN_SPOTIFY_LOGIN_DESC = "Συνδεθείτε με τον λογαριασμό σας Spotify. Θα δημιουργηθεί νέος λογαριασμός εάν δεν υπάρχει αντίστοιχος λογαριασμός στον ιστότοπό μας."
PLG_SOCIALLOGIN_SPOTIFY_LINK_LABEL = "Σύνδεση Spotify"
PLG_SOCIALLOGIN_SPOTIFY_LINK_DESC = "Συνδέει τον χρήστη σας σε αυτόν τον ιστότοπο με τον λογαριασμό σας Spotify. Μπορείτε έπειτα να χρησιμοποιείτε τον λογαριασμό σας Spotify για να συνδέεστε σε αυτόν τον ιστότοπο."
PLG_SOCIALLOGIN_SPOTIFY_UNLINK_LABEL = "Αποσύνδεση Spotify"
PLG_SOCIALLOGIN_SPOTIFY_UNLINK_DESC = "Αποσυνδέει τον χρήστη σας σε αυτόν τον ιστότοπο από τον λογαριασμό σας Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPID_LABEL = "Spotify Client ID"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPID_DESC = "Εισαγάγετε εδώ το Client ID για την εφαρμογή σας Spotify OAuth2. Αυτό απαιτείται για την ενεργοποίηση της κοινωνικής σύνδεσης με Spotify. Μπορείτε να δημιουργήσετε μια εφαρμογή Spotify OAuth2 δωρεάν στο <a href='https://developer.spotify.com'>πύλη προγραμματιστών Spotify</a>."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPSECRET_LABEL = "Spotify Client Secret"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPSECRET_DESC = "Εισαγάγετε εδώ το Client Secret για την εφαρμογή σας Spotify OAuth2. Αυτό απαιτείται για την ενεργοποίηση της κοινωνικής σύνδεσης με Spotify. Μπορείτε να δημιουργήσετε μια εφαρμογή Spotify OAuth2 δωρεάν στο <a href='https://developer.spotify.com'>πύλη προγραμματιστών Spotify</a>."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_LOGINUNLINKED_LABEL = "Να επιτρέπεται κοινωνική σύνδεση σε μη συνδεδεμένους λογαριασμούς"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_LOGINUNLINKED_DESC = "Όταν είναι ενεργοποιημένο, επιτρέπει στους χρήστες να συνδέονται παρά το γεγονός ότι δεν έχουν συνδέσει τον λογαριασμό τους Spotify με τον λογαριασμό χρήστη τους στον ιστότοπο. Η διεύθυνση email του λογαριασμού Spotify πρέπει να είναι ίδια με τη διεύθυνση email που χρησιμοποιούν στον ιστότοπό σας και πρέπει να είναι δημόσια ορατή."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CREATENEW_LABEL = "Δημιουργία νέων λογαριασμών χρηστών"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CREATENEW_DESC = "Δημιουργεί νέο χρήστη Joomla! όταν κάποιος χρήστης προσπαθεί να συνδεθεί μέσω Spotify αλλά δεν υπάρχει λογαριασμός χρήστη Joomla! που να σχετίζεται με αυτό το email ή αναγνωριστικό χρήστη Spotify. Εάν η εγγραφή χρηστών είναι απενεργοποιημένη, δεν θα δημιουργηθεί λογαριασμός και θα εμφανιστεί σφάλμα. Ο λογαριασμός Spotify του χρήστη πρέπει να έχει δημόσια ορατή διεύθυνση email. Ο νέος χρήστης Joomla! θα έχει όνομα χρήστη που θα προέρχεται από τη σύνδεση Spotify, την ίδια διεύθυνση email με τον λογαριασμό Spotify και έναν μακρύ, τυχαίο κωδικό πρόσβασης (τον οποίο ο χρήστης μπορεί να αλλάξει μόλις συνδεθεί). Ορίστε αυτό σε Όχι για να αποτρέψετε τη δημιουργία λογαριασμών χρηστών μέσω σύνδεσης Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FORCENEW_LABEL = "Παράβλεψη ρύθμισης Joomla! για δημιουργία λογαριασμών χρηστών"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FORCENEW_DESC = "Όταν τόσο αυτή η επιλογή όσο και η επιλογή «Δημιουργία νέων λογαριασμών χρηστών» παραπάνω είναι ενεργοποιημένες, θα δημιουργείται πάντα νέος χρήστης, ακόμη και αν έχετε απενεργοποιήσει την εγγραφή χρηστών στις επιλογές της σελίδας Χρηστών του Joomla. Αυτό είναι χρήσιμο για να αποτρέψετε οποιονδήποτε από το να εγγραφεί στον ιστότοπό σας <em>εκτός εάν</em> έχει λογαριασμό Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BYPASSVALIDATION_LABEL = "Παράκαμψη επικύρωσης χρήστη για χρήστες Spotify"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BYPASSVALIDATION_DESC = "Ισχύει μόνο κατά τη δημιουργία νέων λογαριασμών χρηστών. Όταν αυτή η επιλογή είναι ενεργοποιημένη, ο νέος χρήστης Joomla! θα δημιουργείται ενεργός, χωρίς να περνά από την επικύρωση λογαριασμού χρήστη του Joomla!. Αυτό σημαίνει ότι δεν θα αποστέλλεται email ενεργοποίησης λογαριασμού στον χρήστη ή στους διαχειριστές του ιστότοπου Joomla!. Αυτό είναι ασφαλές επειδή το Spotify επιτρέπει μόνο σε χρήστες με επαληθευμένη διεύθυνση email να χρησιμοποιούν τον λογαριασμό τους Spotify για σύνδεση σε εξωτερικούς ιστότοπους."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CUSTOMCSS_LABEL = "Στυλιζάρισμα κουμπιών"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CUSTOMCSS_DESC = "Όταν είναι ενεργοποιημένο, προσαρμοσμένο CSS για το στυλιζάρισμα κουμπιών σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης θα εξάγεται στην κεφαλίδα της σελίδας. Απενεργοποιήστε αυτή την επιλογή εάν σκοπεύετε να χρησιμοποιήσετε το δικό σας CSS για τα κουμπιά."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FGCOLOR_LABEL = "Χρώμα προσκηνίου κουμπιού"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FGCOLOR_DESC = "Το χρώμα προσκηνίου (κειμένου) για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#FFFFFF</code>"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BGCOLOR_LABEL = "Χρώμα φόντου κουμπιού"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BGCOLOR_DESC = "Το χρώμα φόντου για τα κουμπιά σύνδεσης, σύνδεσης λογαριασμού και αποσύνδεσης που δημιουργούνται από αυτό το πρόσθετο. Προεπιλογή: <code>#000000</code>"
PLG_SOCIALLOGIN_SPOTIFY_ERROR_NOT_LOGGED_IN_FB = "Δεν είστε συνδεδεμένοι στο Spotify ή δεν παραχωρήσατε άδειες για να συνδεθείτε σε αυτόν τον ιστότοπο μέσω Spotify."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED = "Ο λογαριασμός σας σε αυτόν τον ιστότοπο είναι απενεργοποιημένος ή δεν έχει ενεργοποιηθεί."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_LOCAL_NOT_FOUND = "Δεν έχετε λογαριασμό σε αυτόν τον ιστότοπο που να αντιστοιχεί σε αυτόν τον λογαριασμό Spotify· ή έχετε επιλέξει να μην κοινοποιείτε τη διεύθυνση email σας στο δημόσιο προφίλ σας στο Spotify (αυτό σημαίνει ότι δεν μπορούμε να σας αναγνωρίσουμε)."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_LOCAL_USERNAME_CONFLICT = "Υπάρχει ήδη λογαριασμός με το ίδιο όνομα χρήστη ή διεύθυνση email με τον λογαριασμό σας Spotify σε αυτόν τον ιστότοπο· ή έχετε επιλέξει να μην κοινοποιείτε τη διεύθυνση email σας στο δημόσιο προφίλ σας στο Spotify (αυτό σημαίνει ότι δεν μπορούμε να σας αναγνωρίσουμε). Παρακαλώ συνδεθείτε στον λογαριασμό σας σε αυτόν τον ιστότοπο και στη συνέχεια συνδέστε τον λογαριασμό σας Spotify με αυτόν. Εάν δεν θυμάστε να έχετε λογαριασμό χρήστη, παρακαλώ δημιουργήστε πρώτα έναν νέο."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_CANNOT_CREATE = "Δεν ήταν δυνατή η δημιουργία νέου χρήστη στον ιστότοπό μας: %s"
PLG_SOCIALLOGIN_SPOTIFY_NOTICE_USERACTIVATE = "Η διεύθυνση email σας πρέπει να επαληθευτεί πριν από τη σύνδεση σε αυτόν τον ιστότοπο. Σας έχει αποσταλεί email με οδηγίες. Αφού ακολουθήσετε αυτές τις οδηγίες, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Spotify."
PLG_SOCIALLOGIN_SPOTIFY_NOTICE_ADMINACTIVATE = "Ο λογαριασμός σας πρέπει να ελεγχθεί από έναν διαχειριστή. Όταν ολοκληρωθεί η διαδικασία ελέγχου, θα λάβετε email επιβεβαίωσης. Αφού λάβετε αυτό το email, επιστρέψτε εδώ και δοκιμάστε ξανά να συνδεθείτε σε αυτόν τον ιστότοπο χρησιμοποιώντας Spotify."

PLG_SOCIALLOGIN_SPOTIFY_FIELD_ENABLEDAPPLICATIONS_LABEL="Τα κουμπιά σύνδεσης μπορούν να εμφανιστούν σε"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_ENABLEDAPPLICATIONS_DESC="Σε ποιο τμήμα (τμήματα) του ιστότοπού σας θέλετε να επιτρέπεται η εμφάνιση των κουμπιών κοινωνικής σύνδεσης; <br/> <strong>ΚΙΝΔΥΝΟΣ!</strong> Εάν η μόνη μέθοδος σύνδεσης ενός χρήστη είναι το SocialLogin, η επιλογή οποιασδήποτε επιλογής εκτός από Και τα δύο θα έχει ως αποτέλεσμα να αποκλειστεί ουσιαστικά από το άλλο τμήμα του ιστότοπού σας."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_ENABLEDAPPLICATIONS_SITE="Εμπρόσθιο τμήμα"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_ENABLEDAPPLICATIONS_ADMIN="Διαχειριστικό τμήμα"
