PLG_SOCIALLOGIN_SPOTIFY = "Akeeba Social Login - integração com Spotify"
PLG_SOCIALLOGIN_SPOTIFY_DESCRIPTION = "🚨🚨🚨 OBSOLETO – NÃO UTILIZAR 🚨🚨🚨 Permite o início de sessão social com contas Spotify. O Spotify anunciou que a partir de 6 de março de 2026 deixará de permitir mais de 5 contas vinculadas a cada aplicação, tornando-o inadequado para uso com o SocialLogin. Esta integração será removida após 6 de junho de 2026."
PLG_SOCIALLOGIN_SPOTIFY_LOGIN_LABEL = "Iniciar sessão com Spotify"
PLG_SOCIALLOGIN_SPOTIFY_LOGIN_DESC = "Inicie sessão com a sua conta Spotify. Será criada uma nova conta se não existir nenhuma conta correspondente no nosso site."
PLG_SOCIALLOGIN_SPOTIFY_LINK_LABEL = "Vincular Spotify"
PLG_SOCIALLOGIN_SPOTIFY_LINK_DESC = "Vincula o seu utilizador neste site à sua conta Spotify. Poderá então utilizar a sua conta Spotify para iniciar sessão neste site."
PLG_SOCIALLOGIN_SPOTIFY_UNLINK_LABEL = "Desvincular Spotify"
PLG_SOCIALLOGIN_SPOTIFY_UNLINK_DESC = "Desvincula o seu utilizador neste site da sua conta Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPID_LABEL = "Spotify Client ID"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPID_DESC = "Introduza aqui o Client ID da sua aplicação Spotify OAuth2. Isto é necessário para ativar o início de sessão social com Spotify. Pode criar uma aplicação Spotify OAuth2 gratuitamente em <a href='https://developer.spotify.com'>o portal do programador Spotify</a>."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPSECRET_LABEL = "Spotify Client Secret"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_APPSECRET_DESC = "Introduza aqui o Client Secret da sua aplicação Spotify OAuth2. Isto é necessário para ativar o início de sessão social com Spotify. Pode criar uma aplicação Spotify OAuth2 gratuitamente em <a href='https://developer.spotify.com'>o portal do programador Spotify</a>."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_LOGINUNLINKED_LABEL = "Permitir início de sessão social em contas não vinculadas"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_LOGINUNLINKED_DESC = "Quando ativado, permite que os utilizadores iniciem sessão sem terem vinculado a sua conta Spotify à sua conta de utilizador no site. O endereço de correio eletrónico da conta Spotify deve ser o mesmo que utilizam no seu site e deve estar visível publicamente."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CREATENEW_LABEL = "Criar novas contas de utilizador"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CREATENEW_DESC = "Cria um novo utilizador no Joomla! quando um utilizador tenta iniciar sessão via Spotify mas não existe nenhuma conta de utilizador do Joomla! associada a esse endereço de correio eletrónico ou ID de utilizador Spotify. Se o registo de utilizadores estiver desativado, nenhuma conta será criada e será gerado um erro. A conta Spotify do utilizador deve ter um endereço de correio eletrónico visível publicamente. O novo utilizador do Joomla! terá um nome de utilizador derivado do início de sessão Spotify, o mesmo endereço de correio eletrónico que a conta Spotify e uma palavra-passe longa e aleatória (que o utilizador pode alterar após iniciar sessão). Defina como Não para impedir a criação de contas de utilizador através do início de sessão Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FORCENEW_LABEL = "Ignorar definição do Joomla! para criação de contas de utilizador"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FORCENEW_DESC = "Quando esta opção e a opção 'Criar novas contas de utilizador' acima estiverem ativadas, será sempre criado um novo utilizador, mesmo que tenha desativado o registo de utilizadores nas opções da página de Utilizadores do Joomla!. Isto é útil para impedir que qualquer pessoa se registe no seu site <em>exceto</em> se tiver uma conta Spotify."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BYPASSVALIDATION_LABEL = "Ignorar validação de utilizador para utilizadores Spotify"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BYPASSVALIDATION_DESC = "Aplica-se apenas ao criar novas contas de utilizador. Quando esta opção está ativada, o novo utilizador do Joomla! será criado como ativo, sem passar pelo processo de validação de conta de utilizador do Joomla!. Isto significa que não será enviado nenhum e-mail de ativação de conta ao utilizador ou aos administradores do site Joomla!. Isto é seguro porque o Spotify apenas permite que utilizadores com um endereço de correio eletrónico verificado utilizem a sua conta Spotify para iniciar sessão em sites externos."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CUSTOMCSS_LABEL = "Estilo dos botões"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_CUSTOMCSS_DESC = "Quando ativado, o CSS personalizado para o estilo dos botões de início de sessão, vinculação e desvinculação será incluído no cabeçalho da página. Desative esta opção se pretender utilizar o seu próprio CSS para estilizar os botões."
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FGCOLOR_LABEL = "Cor de primeiro plano do botão"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_FGCOLOR_DESC = "A cor de primeiro plano (texto) para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#FFFFFF</code>"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BGCOLOR_LABEL = "Cor de fundo do botão"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_BGCOLOR_DESC = "A cor de fundo para os botões de início de sessão, vinculação e desvinculação criados com este plugin. Predefinição: <code>#000000</code>"
PLG_SOCIALLOGIN_SPOTIFY_ERROR_NOT_LOGGED_IN_FB = "Não tem sessão iniciada no Spotify ou não concedeu permissões para este site iniciar sessão através do Spotify."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED = "A sua conta neste site está desativada ou não foi ativada."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_LOCAL_NOT_FOUND = "Não tem uma conta neste site que corresponda a esta conta Spotify; ou optou por não partilhar o seu endereço de correio eletrónico no seu perfil Spotify público (isso impede-nos de o identificar)."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_LOCAL_USERNAME_CONFLICT = "Já existe uma conta neste site com o mesmo nome de utilizador ou endereço de correio eletrónico que a sua conta Spotify; ou optou por não partilhar o seu endereço de correio eletrónico no seu perfil Spotify público (isso impede-nos de o identificar). Por favor inicie sessão na sua conta neste site e depois vincule a sua conta Spotify. Se não se lembrar de ter uma conta de utilizador, por favor crie uma nova primeiro."
PLG_SOCIALLOGIN_SPOTIFY_ERROR_CANNOT_CREATE = "Não foi possível criar um novo utilizador no nosso site: %s"
PLG_SOCIALLOGIN_SPOTIFY_NOTICE_USERACTIVATE = "O seu endereço de correio eletrónico precisa de ser verificado antes de iniciar sessão neste site. Foi-lhe enviado um e-mail com instruções. Após seguir essas instruções, volte aqui e tente novamente iniciar sessão neste site utilizando Spotify."
PLG_SOCIALLOGIN_SPOTIFY_NOTICE_ADMINACTIVATE = "A sua conta precisa de ser revista por um administrador. Quando o processo de revisão estiver concluído, receberá um e-mail de confirmação. Após receber esse e-mail, volte aqui e tente novamente iniciar sessão neste site utilizando Spotify."

PLG_SOCIALLOGIN_SPOTIFY_FIELD_ENABLEDAPPLICATIONS_LABEL="Os botões de início de sessão podem ser mostrados em"
PLG_SOCIALLOGIN_SPOTIFY_FIELD_ENABLEDAPPLICATIONS_DESC="Em que parte(s) do seu site pretende permitir a apresentação dos botões de Início de Sessão Social? <br/> <strong>ATENÇÃO!</strong> Se o único método de início de sessão de um utilizador for o SocialLogin, escolher qualquer opção que não seja Ambos resultará no bloqueio efetivo do acesso à outra parte do seu site."
