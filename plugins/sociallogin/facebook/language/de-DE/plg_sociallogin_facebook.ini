PLG_SOCIALLOGIN_FACEBOOK="Akeeba Social Login - Facebook Integration"
PLG_SOCIALLOGIN_FACEBOOK_DESCRIPTION="Ermöglicht die Anmeldung mit Facebook-Konten."

PLG_SOCIALLOGIN_FACEBOOK_LOGIN_LABEL="Mit Facebook anmelden"
PLG_SOCIALLOGIN_FACEBOOK_LOGIN_DESC="Melden Sie sich mit Ihrem Facebook-Konto an. Ein neues Konto wird erstellt, wenn kein übereinstimmendes Konto auf unserer Website vorhanden ist."

PLG_SOCIALLOGIN_FACEBOOK_LINK_LABEL="Facebook verknüpfen"
PLG_SOCIALLOGIN_FACEBOOK_LINK_DESC="Verknüpft Ihren Benutzer auf dieser Website mit Ihrem Facebook-Konto. Sie können sich dann mit Ihrem Facebook-Konto auf dieser Website anmelden."

PLG_SOCIALLOGIN_FACEBOOK_UNLINK_LABEL="Facebook-Verknüpfung aufheben"
PLG_SOCIALLOGIN_FACEBOOK_UNLINK_DESC="Hebt die Verknüpfung Ihres Benutzers auf dieser Website mit Ihrem Facebook-Konto auf."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_APPID_LABEL="Facebook Application ID"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_APPID_DESC="Geben Sie hier die App-ID für Ihre benutzerdefinierte Facebook-Anwendung ein. Dies ist erforderlich, um die Anmeldung mit Facebook zu aktivieren. Sie können eine Facebook-App unter https://developers.facebook.com/apps erstellen."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_APPSECRET_LABEL="Facebook Application Secret"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_APPSECRET_DESC="Geben Sie hier das App Secret für Ihre benutzerdefinierte Facebook-Anwendung ein. Dies ist erforderlich, um die Anmeldung mit Facebook zu aktivieren. Sie können eine Facebook-App unter https://developers.facebook.com/apps erstellen."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_LOGINUNLINKED_LABEL="Social-Login für nicht verknüpfte Konten erlauben"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_LOGINUNLINKED_DESC="Wenn aktiviert, können sich Benutzer anmelden, auch wenn ihr Facebook-Konto nicht mit ihrem Website-Benutzerkonto verknüpft ist. Die E-Mail-Adresse des Facebook-Kontos muss mit der E-Mail-Adresse übereinstimmen, die auf Ihrer Website verwendet wird, und sie muss verifiziert sein (Facebook hat die Gültigkeit ihrer E-Mail-Adresse ODER Telefonnummer überprüft)."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_CREATENEW_LABEL="Neue Benutzerkonten erstellen"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_CREATENEW_DESC="Erstellt einen neuen Joomla!-Benutzer, wenn sich ein Benutzer über Facebook anmelden möchte, aber kein Joomla!-Benutzerkonto mit dieser E-Mail-Adresse oder Facebook-Benutzer-ID verknüpft ist. Wenn die Benutzerregistrierung deaktiviert ist, wird kein Konto erstellt und ein Fehler ausgegeben. Der neue Joomla!-Benutzer erhält einen aus dem Facebook-Login abgeleiteten Benutzernamen, dieselbe E-Mail-Adresse wie das Facebook-Konto und ein langes, zufälliges Passwort (das der Benutzer nach der Anmeldung ändern kann). Setzen Sie dies auf Nein, um die Erstellung von Benutzerkonten über die Facebook-Anmeldung zu verhindern."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_FORCENEW_LABEL="Joomla!-Einstellung zur Benutzerkontenerstellung ignorieren"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_FORCENEW_DESC="Wenn sowohl diese Option als auch die obige Option „Neue Benutzerkonten erstellen" aktiviert sind, wird immer ein neuer Benutzer erstellt, auch wenn Sie die Benutzerregistrierung in den Optionen der Joomla!-Benutzerseite deaktiviert haben. Dies ist nützlich, um zu verhindern, dass sich jemand auf Ihrer Website registriert, <em>es sei denn</em>, er hat ein Facebook-Konto."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_BYPASSVALIDATION_LABEL="Benutzervalidierung für verifizierte Facebook-Benutzer überspringen"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_BYPASSVALIDATION_DESC="Gilt nur beim Erstellen neuer Benutzerkonten. Wenn der anmeldende Facebook-Benutzer verifiziert ist (Facebook hat die Gültigkeit seiner E-Mail-Adresse ODER Telefonnummer überprüft), wird der neue Benutzer ohne die Joomla!-Benutzerkonto-Validierung aktiv erstellt. Das bedeutet, dass keine Konto-Aktivierungs-E-Mail an den Benutzer oder die Administratoren der Joomla!-Website gesendet wird."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_CUSTOMCSS_LABEL="Schaltflächenstil"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_CUSTOMCSS_DESC="Wenn aktiviert, wird benutzerdefiniertes CSS für die Gestaltung der Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen in den Seitenkopf ausgegeben. Deaktivieren Sie diese Option, wenn Sie Ihr eigenes CSS zur Gestaltung der Schaltflächen verwenden möchten."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_FGCOLOR_LABEL="Vordergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_FGCOLOR_DESC="Die Vordergrundfarbe (Text) für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#FFFFFF</code>"

PLG_SOCIALLOGIN_FACEBOOK_FIELD_BGCOLOR_LABEL="Hintergrundfarbe der Schaltfläche"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_BGCOLOR_DESC="Die Hintergrundfarbe für die mit diesem Plugin erstellten Anmelde-, Verknüpfungs- und Verknüpfungsaufhebungs-Schaltflächen. Standard: <code>#1877F2</code>"

PLG_SOCIALLOGIN_FACEBOOK_ERROR_NOT_LOGGED_IN_FB="Sie sind nicht bei Facebook angemeldet oder haben dieser Website keine Berechtigungen erteilt, Sie über Facebook anzumelden."
PLG_SOCIALLOGIN_FACEBOOK_ERROR_ACCOUNT_DISABLED_OR_NOT_ACTIVATED="Ihr Konto auf dieser Website ist deaktiviert oder noch nicht aktiviert."
PLG_SOCIALLOGIN_FACEBOOK_ERROR_LOCAL_NOT_FOUND="Sie haben kein Konto auf dieser Website, das diesem Facebook-Konto entspricht."
PLG_SOCIALLOGIN_FACEBOOK_ERROR_LOCAL_USERNAME_CONFLICT="Auf dieser Website existiert bereits ein Konto mit demselben Benutzernamen oder derselben E-Mail-Adresse wie Ihr Facebook-Konto. Bitte melden Sie sich bei Ihrem Konto auf dieser Website an und verknüpfen Sie dann Ihr Facebook-Konto damit. Wenn Sie sich nicht erinnern, bereits ein Benutzerkonto zu haben, erstellen Sie bitte zuerst ein neues."
PLG_SOCIALLOGIN_FACEBOOK_ERROR_CANNOT_CREATE="Es konnte kein neuer Benutzer auf unserer Website erstellt werden: %s"

PLG_SOCIALLOGIN_FACEBOOK_NOTICE_USERACTIVATE="Ihre E-Mail-Adresse muss verifiziert werden, bevor Sie sich auf dieser Website anmelden können. Eine E-Mail mit Anweisungen wurde an Sie gesendet. Nachdem Sie diesen Anweisungen gefolgt sind, kehren Sie bitte hierher zurück und versuchen Sie erneut, sich mit Facebook auf dieser Website anzumelden."
PLG_SOCIALLOGIN_FACEBOOK_NOTICE_ADMINACTIVATE="Ihr Konto muss von einem Administrator überprüft werden. Wenn der Überprüfungsprozess abgeschlossen ist, erhalten Sie eine Bestätigungs-E-Mail. Kehren Sie nach Erhalt dieser E-Mail hierher zurück und versuchen Sie erneut, sich mit Facebook auf dieser Website anzumelden."

PLG_SOCIALLOGIN_FACEBOOK_FIELD_ENABLEDAPPLICATIONS_LABEL="Anmelde-Schaltflächen können angezeigt werden in"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_ENABLEDAPPLICATIONS_DESC="In welchem Teil/welchen Teilen Ihrer Website möchten Sie das Anzeigen der Social-Login-Schaltflächen erlauben? <br/> <strong>ACHTUNG!</strong> Wenn die einzige Anmeldemethode eines Benutzers SocialLogin ist, führt die Auswahl einer anderen Option als „Beide" dazu, dass der Benutzer im anderen Teil Ihrer Website praktisch ausgesperrt ist."
PLG_SOCIALLOGIN_FACEBOOK_FIELD_ENABLEDAPPLICATIONS_SITE="Frontend"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_ENABLEDAPPLICATIONS_ADMIN="Backend"
PLG_SOCIALLOGIN_FACEBOOK_FIELD_ENABLEDAPPLICATIONS_BOTH="Beide"
