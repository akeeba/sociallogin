# Basic release information
release:
  version: '%%VERSION%%'
  date: '%%DATE%%'
  category: 55
  access: 1
  release_notes: '%%DEFAULT_RELEASE_NOTES%%'
  changelog: '%%DEFAULT_CHANGELOG%%'

# Akeeba Release System API connection
api:
  type: 'joomla'
  endpoint: '%%API.ENDPOINT%%'
  connector: '%%API.CONNECTOR%%'
  token: '%%API.TOKEN%%'
  cacert: '%%CUSTOMCACERT%%'

steps: [%%RELEASESTEPS%%]

# File upload connections
connections:
  bunny:
    type: 'bunny'
    key: '%%BUNNY.ACCESS%%'
    zone: '%%BUNNY.ZONE%%'
    region: '%%BUNNY.REGION%%'
    cdnhostname: '%%BUNNY.CDNHOSTNAME%%'
    directory: 'downloads/sociallogin'

# Release source files configuration.
files:
  -
    title: 'SocialLogin'
    connection: bunny
    source: '%%RELEASEDIR%%/pkg_sociallogin-*.zip'
    access: 1

# Update sources
updates:
  -
    title: 'SocialLogin updates'
    connection: bunny
    directory: 'updates'
    stream: 41
    base_name: 'pkgsociallogin'
    formats:
      - 'xml'
